<script>
/* Seguridad: cada pedido a la base va firmado con la sesión de quien está usando el sistema */
(function () {
  var BASE = 'sinoeoaktirnscdpbvdc.supabase.co', f0 = window.fetch;
  function token() { try { return localStorage.getItem('poly_sesion'); } catch (e) { return null; } }
  window.fetch = function (u, o) {
    var url = typeof u === 'string' ? u : (u && u.url) || '', t = token();
    if (!t || url.indexOf(BASE) < 0 || window.__polySinFirma) return f0.call(this, u, o);
    var o2 = Object.assign({}, o || {}), h = new Headers((o && o.headers) || (typeof u !== 'string' && u && u.headers) || {});
    h.set('x-poly-token', t); o2.headers = h;
    var self = this;
    return f0.call(self, u, o2).catch(function (e) {
      // si el navegador rechaza el encabezado, se sigue trabajando como antes
      if (e && e.name === 'TypeError') { window.__polySinFirma = true; return f0.call(self, u, o); }
      throw e;
    });
  };
  function ping() {
    if (!token()) return;
    var m = (location.pathname.split('/').pop() || 'index.html').replace('.html', '') || 'index';
    window.fetch('https://' + BASE + '/rest/v1/rpc/seguridad_ping', { method: 'POST',
      headers: { apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg',
        Authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg', 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_modulo: m + (window.__polySinFirma ? ':sin-firma' : '') }) }).catch(function () {});

<script>
/* Poly Artesanal — control de acceso
   Cada módulo incluye este archivo. Verifica la sesión y deja entrar solo:
   - al administrador (rol admin) a todo
   - a cada usuario de sector, únicamente a su módulo
*/
(function () {
  var SB_URL = 'https://sinoeoaktirnscdpbvdc.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg';
  var ARCHIVO = { cocina: 'asistente_cocina.html', panaderia: 'asistente_panaderia.html', pasteleria: 'asistente_pasteleria.html',
                  madrugada: 'asistente_madrugada.html', salon: 'asistente_salon.html', deposito: 'asistente_deposito.html' };
  var pagina = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  var requerido = null; // módulo que exige esta página; 'admin' = solo Poly
  Object.keys(ARCHIVO).forEach(function (m) { if (ARCHIVO[m] === pagina) requerido = m; });
  if (pagina === 'gestion.html' || pagina === 'central.html') requerido = 'admin';
  if (pagina === 'caja.html') requerido = 'salon';

  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function borrar() { try { localStorage.removeItem('poly_sesion'); localStorage.removeItem('poly_usuario'); } catch (e) {} }
  function irA(p) { location.replace(p); }
  function mostrar() { document.documentElement.style.visibility = ''; }

  window.polyRPC = function (fn, body) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message || 'Error'); return j; }); });
  };
  window.polyToken = function () { return leer('poly_sesion'); };
  window.polySalir = function () {
    var t = leer('poly_sesion'); borrar();
    var fin = function () { location.href = 'index.html'; };
    if (t) window.polyRPC('cerrar_sesion', { p_token: t }).then(fin, fin); else fin();
  };

  function permitido(u) { return u.rol === 'admin' || (requerido && requerido !== 'admin' && u.modulo === requerido); }
  function destino(u) { return u.rol === 'admin' ? 'index.html' : (ARCHIVO[u.modulo] || 'index.html'); }

  function barra(u) {
    if (window.top !== window) return; // dentro del Salón: la barra de sesión ya está afuera
    var b = document.createElement('div');
    b.id = 'poly-sesion';
    b.style.cssText = 'position:fixed;top:4px;left:4px;z-index:99999;font:11px system-ui,sans-serif;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:3px 4px 3px 9px;display:flex;gap:6px;align-items:center;';
    b.innerHTML = '<span>👤 ' + (u.nombre || u.usuario) + '</span>' +
      (u.rol === 'admin' ? '<a href="index.html" style="color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:10px;padding:2px 7px;">Menú</a>' : '') +
      '<button type="button" style="border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:2px 7px;font:inherit;cursor:pointer;">Salir</button>';
    b.querySelector('button').onclick = window.polySalir;
    document.body.appendChild(b);
  }

  if (pagina === 'index.html' || pagina === '') return; // el index maneja su propio login
  // Si en otra pestaña se tocó "Salir" o se entró con otro usuario, esta pestaña vuelve a verificar la sesión
  window.addEventListener('storage', function (e) { if (e.key === 'poly_sesion') location.reload(); });
  document.documentElement.style.visibility = 'hidden';
  var token = leer('poly_sesion');
  if (!token) { irA('index.html'); return; }

  var guardado = null; try { guardado = JSON.parse(leer('poly_usuario') || 'null'); } catch (e) {}
  window.polyRPC('verificar_sesion', { p_token: token }).then(function (u) {
    if (!u || !u.ok) { if (u && u.motivo === 'fuera_local') { irA('index.html#fuera'); return; } borrar(); irA('index.html'); return; }
    try { localStorage.setItem('poly_usuario', JSON.stringify(u)); } catch (e) {}
    if (!permitido(u)) { irA(destino(u)); return; }
    window.POLY_USUARIO = u;
    var listo = function () { barra(u); mostrar(); };
    if (document.body) listo(); else document.addEventListener('DOMContentLoaded', listo);
  }, function () {
    // sin internet: si ya había entrado en este dispositivo, lo dejamos trabajar
    if (guardado && permitido(guardado)) {
      window.POLY_USUARIO = guardado;
      var listo = function () { barra(guardado); mostrar(); };
      if (document.body) listo(); else document.addEventListener('DOMContentLoaded', listo);
    } else { irA('index.html'); }
  });
})();

</script>

<style>

<script>
const SB='https://sinoeoaktirnscdpbvdc.supabase.co/rest/v1/';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
async function api(path,opt){const r=await fetch(SB+path,Object.assign({headers:H},opt||{}));const t=await r.text();const j=t?JSON.parse(t):null;if(!r.ok)throw new Error((j&&j.message)||('Error '+r.status));return j}
const rpc=(fn,body)=>api('rpc/'+fn,{method:'POST',body:JSON.stringify(body||{})});
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const plata=n=>'$ '+(Math.round((+n||0)*100)/100).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
const num=v=>{let s=String(v==null?'':v).trim().replace(/\s|\$/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');const n=+s;return isFinite(n)?n:0};
const kgTxt=q=>String(Math.round(q*1000)/1000).replace('.',',');
function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',ms||2600)}
function modal(h){$('#box').innerHTML=h;$('#ov').style.display='flex';setTimeout(()=>{const i=$('#box [autofocus]');if(i){i.focus();if(i.select)i.select()}},60)}
function cerrar(){$('#ov').style.display='none';$('#box').innerHTML='';$('#bus').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').style.display==='flex')cerrar();if(e.key==='F9'){e.preventDefault();if(!$('#cobrar').disabled)abrirCobro()}});

const LISTAS={minorista:['Minorista','precio_lpu','#8e5bd6'],mayorista:['Mayorista','precio_may','#3d8bd9'],pedidosya:['PedidosYa','precio_pey','#e05252']};
const MEDIOS=['Efectivo','Mercado Pago / QR','Transferencia','Débito','Crédito','Cuenta corriente'];
const COND={cf:'Consumidor final',ri:'Responsable inscripto',mono:'Monotributista',ex:'Exento'};
// Solo Poly (admin) ve saldos y cobra cuentas corrientes; el Salón puede despachar a cuenta pero no ve deudas
// Si la caja está adentro del Salón (solapa), no hace falta el botón para volver
try{if(window.top!==window)document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('bSalon');if(b)b.style.display='none'})}catch(e){}
const ES_ADMIN=(()=>{try{return (JSON.parse(localStorage.getItem('poly_usuario')||'null')||{}).rol==='admin'}catch(e){return false}})();
let PROD=[],TOP=[],CLIENTES=[],SALDOS={},CFG={},TURNO=null,lista='minorista',carrito=[],cliente={tipo:'cf'},REM={on:false,dir:'',notas:''},PEDIDO=null;

async function cargar(){
  const desde=new Date(Date.now()-30*864e5).toISOString();
  const [p,cfg,cl,cc,ci]=await Promise.all([
    api('productos_venta?select=codigo,nombre,precio_may,precio_lpu,precio_pey,iva,por_kg,activo&activo=eq.true&order=nombre'),
    api('config?select=valor&clave=eq.caja'),
    api('crm_clientes?select=id,nombre,razon_social,cuit,tipo,lista,direccion,zona&activo=is.true&order=nombre').catch(()=>[]),
    ES_ADMIN?api('cc_movimientos?select=cliente_id,monto').catch(()=>[]):Promise.resolve([]),
    rpc('caja_mas_vendidos',{p_desde:desde.slice(0,10)}).catch(()=>[])]);
  PROD=(p||[]).filter(x=>!/^articulo libre$/i.test(norm(x.nombre).trim()));
  CFG=(cfg&&cfg[0]&&cfg[0].valor)||{};
  CLIENTES=cl||[];SALDOS={};(cc||[]).forEach(m=>{SALDOS[m.cliente_id]=(SALDOS[m.cliente_id]||0)+(+m.monto||0)});
  TOP=(ci||[]).map(String).filter(c=>PROD.some(p=>p.codigo===c)).slice(0,24);
  if(ES_ADMIN)$('#bCCtop').style.display='';
  await estadoTurno();
  pintarListas();pintarGrid();pintarCarrito();
}
async function estadoTurno(){
  let r=null;try{r=await rpc('caja_resumen')}catch(e){toast('⚠️ '+e.message,5000)}
  TURNO=r&&r.abierto?r:null;
  const modo=CFG.modo||'prueba';

function resPago(){const t=total(),s=PAGOS.reduce((a,p)=>a+(+p.monto||0),0);const ef=PAGOS.find(p=>p.medio==='Efectivo');

function imprimirTicket(v){const C=CFG;$('#ticket').className='';const prueba=(v.fiscal||'')!=='autorizada';
  const iva={};v.items.forEach(it=>{const a=it.iva==null?21:+it.iva;const s=it.cantidad*it.precio;iva[a]=(iva[a]||0)+s});
  const ivaCont=Object.entries(iva).reduce((a,[al,s])=>a+s-s/(1+al/100),0);
  $('#ticket').innerHTML=`<div class="c g">${esc(C.nombre_fantasia||'Poly Artesanal')}</div>${C.razon_social&&C.razon_social!==C.nombre_fantasia?`<div class="c">${esc(C.razon_social)}</div>`:''}
  <div class="c">${esc(C.domicilio||'')}</div>${C.cuit?`<div class="c">CUIT ${esc(C.cuit)} · IIBB ${esc(C.iibb||'')}</div><div class="c">${esc(C.cond_iva||'')} · Inicio act. ${esc(C.inicio_actividades||'')}</div>`:''}
  <hr><div class="c g">${prueba?'COMPROBANTE NO VÁLIDO COMO FACTURA':(v.cbte||'FACTURA')}</div>
  <div>Venta #${v.id} · ${v.fecha.toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}</div>
  ${v.cliente&&(v.cliente.nombre||v.cliente.doc)?`<div>${esc(v.cliente.nombre||'')} ${v.cliente.doc?'· '+esc(v.cliente.doc):''}</div>`:'<div>A CONSUMIDOR FINAL</div>'}
  <hr><table>${v.items.map(it=>`<tr><td colspan="2">${esc(it.nombre)}</td></tr><tr><td>${it.unidad==='kg'?kgTxt(it.cantidad)+' kg':it.cantidad+' u'} x ${plata(it.precio)}</td><td class="r">${plata(it.cantidad*it.precio)}</td></tr>`).join('')}</table>
  <hr><table><tr><td class="g">TOTAL</td><td class="r g">${plata(v.total)}</td></tr>${v.pagos.map(p=>`<tr><td>${esc(p.medio)}</td><td class="r">${plata(p.medio==='Efectivo'&&p.recibe!=null?p.recibe:p.monto)}</td></tr>`).join('')}${v.vuelto?`<tr><td>Vuelto</td><td class="r">${plata(v.vuelto)}</td></tr>`:''}</table>
  <hr><div style="font-size:11px">Régimen de Transparencia Fiscal al Consumidor (Ley 27.743)</div><div style="font-size:11px">IVA Contenido: ${plata(ivaCont)}</div><div style="font-size:11px">Otros Impuestos Nacionales Indirectos: $ 0</div>
  <hr><div class="c">¡Gracias por elegirnos!</div><div class="c">@polyartesanal</div>`;
  setTimeout(()=>window.print(),80)}

function nroRem(n){return '0001-'+String(n).padStart(8,'0')}
function imprimirRemito(v){const C=CFG,r=v.remito;const cc=(v.pagos||[]).some(p=>p.medio==='Cuenta corriente');
  const bu=v.items.reduce((a,it)=>a+(+it.bultos||0),0),kg=v.items.reduce((a,it)=>a+(+it.kg||0),0),un=v.items.filter(it=>it.unidad!=='kg').reduce((a,it)=>a+(+it.cantidad||0),0);
  const hoja=copia=>`<div class="hoja"><div class="cab"><div><div style="font-size:20px;font-weight:800">${esc(C.nombre_fantasia||'Poly Artesanal')}</div><div>${esc(C.razon_social||'')}</div><div>${esc(C.domicilio||'')}</div><div>${esc(C.cond_iva||'')}</div></div>
    <div style="text-align:right"><div style="font-size:18px;font-weight:800">REMITO DE ENTREGA</div><div style="font-size:16px;font-weight:700">N° ${nroRem(r.nro)}</div><div>Fecha: ${v.fecha.toLocaleDateString('es-AR')}</div>${C.cuit?`<div>CUIT ${esc(C.cuit)}</div><div>IIBB ${esc(C.iibb||'')} · Inicio act. ${esc(C.inicio_actividades||'')}</div>`:''}<div style="font-size:11px;margin-top:4px">${copia}</div></div></div>
    <div class="box"><b>Cliente:</b> ${esc(v.cliente&&v.cliente.nombre||'Consumidor final')}${v.cliente&&v.cliente.doc?' · CUIT '+esc(v.cliente.doc):''}<br><b>Entregar en:</b> ${esc(r.dir||'—')}${r.notas?'<br><b>Observaciones:</b> '+esc(r.notas):''}<br><b>Condición:</b> ${cc?'Cuenta corriente':'Pagado'} · Venta #${v.id}</div>
    <table class="det"><tr><th class="n" style="width:70px">Cantidad</th><th style="width:50px">Unid.</th><th>Producto</th><th class="n" style="width:70px">Bultos</th><th class="n" style="width:80px">Kilos</th></tr>
    ${v.items.map(it=>`<tr><td class="n">${it.unidad==='kg'?kgTxt(it.cantidad):it.cantidad}</td><td>${it.unidad==='kg'?'kg':'u'}</td><td>${esc(it.nombre)}</td><td class="n">${it.bultos?it.bultos:''}</td><td class="n">${it.kg?kgTxt(it.kg):''}</td></tr>`).join('')}
    <tr><td class="n"><b>${un}</b></td><td>u</td><td><b>TOTALES</b></td><td class="n"><b>${bu}</b></td><td class="n"><b>${kgTxt(kg)}</b></td></tr></table>
    <div style="font-size:11px;margin-top:6px">Documento no válido como factura.</div>
    <div class="firmas"><div>Firma de quien recibe</div><div>Aclaración</div><div>DNI</div><div>Fecha y hora</div></div></div>`;
  const t=$('#ticket');t.className='a4';t.innerHTML=hoja('ORIGINAL')+'<div class="corte">✂</div>'+hoja('DUPLICADO');setTimeout(()=>window.print(),80)}

// ---------- ventas del turno / anular ----------
async function verVentas(){if(!TURNO)return toast('No hay turno abierto');
  const v=await api('ventas?select=id,created_at,total,estado,pagos,cliente_nombre,cliente_doc,fiscal_estado,remito_nro,entrega_direccion,entrega_notas,ventas_items(nombre,cantidad,unidad,precio,iva,bultos,kg)&turno_id=eq.'+TURNO.turno.id+'&order=id.desc');
  modal(`<h3>📋 Ventas del turno (${v.filter(x=>x.estado==='ok').length})</h3><div style="max-height:60vh;overflow:auto">${v.map(x=>`<div class="vt" style="${x.estado==='anulada'?'opacity:.45;text-decoration:line-through':''}"><b>#${x.id}</b><span class="muted">${new Date(x.created_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</span>
    <span style="font-size:13px">${esc((x.ventas_items||[]).map(i=>i.nombre).join(', ').slice(0,70))}${x.cliente_nombre?' · '+esc(x.cliente_nombre):''}<br><span class="muted">${(x.pagos||[]).map(p=>p.medio).join(' + ')}</span></span>
    <b style="text-align:right">${plata(x.total)}</b><span style="text-align:right">${x.estado==='ok'?`${x.remito_nro?`<button class="tb" onclick="reimprimir(${x.id},1)" title="Remito N° ${x.remito_nro}">📦</button> `:''}<button class="tb" onclick="reimprimir(${x.id})" title="Reimprimir ticket">🖨️</button> <button class="tb" onclick="anular(${x.id})" title="Anular">✕</button>`:''}</span></div>`).join('')||'<p class="muted">Todavía no hay ventas.</p>'}</div>
    <div class="acc"><button class="b-no" onclick="cerrar()">Cerrar</button></div>`);window._ventas=v}
function reimprimir(id,rem){const x=(window._ventas||[]).find(v=>v.id===id);if(!x)return;const v={id:x.id,fecha:new Date(x.created_at),items:(x.ventas_items||[]).map(i=>({nombre:i.nombre,cantidad:+i.cantidad,unidad:i.unidad,precio:+i.precio,iva:i.iva,bultos:i.bultos==null?null:+i.bultos,kg:i.kg==null?null:+i.kg})),pagos:x.pagos||[],vuelto:0,total:x.total,cliente:{nombre:x.cliente_nombre,doc:x.cliente_doc},fiscal:x.fiscal_estado};
  if(rem&&x.remito_nro){v.remito={nro:x.remito_nro,dir:x.entrega_direccion,notas:x.entrega_notas};imprimirRemito(v)}else imprimirTicket(v)}
async function anular(id){const m=prompt('¿Por qué se anula la venta #'+id+'? (vuelve el stock al Salón)');if(m===null)return;
  try{await rpc('caja_anular',{p_id:id,p_motivo:m||'sin motivo'});toast('Venta #'+id+' anulada');await estadoTurno();verVentas()}catch(e){toast('⚠️ '+e.message,6000)}}

// ---------- turno ----------
function turnoBtn(){TURNO?cerrarTurno():abrirTurno()}
function abrirTurno(){const h=+new Date().toLocaleString('en-US',{timeZone:'America/Argentina/Buenos_Aires',hour:'numeric',hour12:false});const sug=h>=5&&h<13?'Mañana':h>=13&&h<21?'Tarde':'Noche';
  modal(`<h3>🔓 Abrir turno</h3><div class="fila"><div><label>Turno</label><select id="tT">${['Mañana','Tarde','Noche'].map(t=>`<option ${t===sug?'selected':''}>${t}</option>`).join('')}</select></div>
  <div><label>Efectivo en la caja al abrir (cambio)</label><input id="tF" inputmode="decimal" placeholder="0" autofocus onkeydown="if(event.key==='Enter')okAbrir()"></div></div>
  <div class="acc"><button class="b-no" onclick="cerrar()">Cancelar</button><button class="b-ok" onclick="okAbrir()">Abrir</button></div>`)}
async function okAbrir(){try{await rpc('caja_abrir',{p_turno:$('#tT').value,p_fondo:num($('#tF').value)});cerrar();await estadoTurno();toast('✅ Turno abierto')}catch(e){toast('⚠️ '+e.message,6000)}}
async function cerrarTurno(){let r;try{r=await rpc('caja_resumen')}catch(e){return toast('⚠️ '+e.message)}if(!r.abierto)return estadoTurno();
  const pm=r.por_medio||{};const ef=(+pm['Efectivo']||0)-(+r.vuelto||0);const ccef=+((r.cc_cobrado||{})['Efectivo'])||0;const esperado=(+r.turno.fondo_inicial||0)+ef+ccef;
  modal(`<h3>🔒 Cerrar turno ${esc(r.turno.turno)}</h3>
  <div class="resu"><span>Ventas</span><b>${r.ventas}</b></div><div class="resu"><span>Total vendido</span><b>${plata(r.total)}</b></div>
  ${Object.entries(pm).map(([m,v])=>`<div class="resu"><span class="muted">${esc(m)}</span><span>${plata(m==='Efectivo'?v-(+r.vuelto||0):v)}</span></div>`).join('')}
  ${Object.keys(r.cc_cobrado||{}).length?`<div class="resu"><span class="muted">Cobros de cuenta corriente</span><span>${Object.entries(r.cc_cobrado).map(([m,v])=>esc(m)+' '+plata(v)).join(' · ')}</span></div>`:''}
  <div class="resu"><span>Efectivo que tiene que haber (con el cambio de ${plata(r.turno.fondo_inicial)})</span><b>${plata(esperado)}</b></div>
  <label>Efectivo contado en la caja</label><input id="cE" inputmode="decimal" autofocus oninput="const d=num(this.value)-${esperado};$('#cDif').innerHTML=this.value?(Math.abs(d)<1?'<span style=color:var(--verde)>✅ Cierra justo</span>':'<span style=color:var(--rojo)>'+(d<0?'Falta ':'Sobra ')+plata(Math.abs(d))+'</span>'):''">
  <div id="cDif" style="margin-top:6px;font-weight:700"></div>
  <label>Notas (opcional)</label><input id="cN">
  <div class="acc"><button class="b-no" onclick="cerrar()">Cancelar</button><button class="b-rojo" onclick="okCerrar()">Cerrar turno</button></div>`)}
async function okCerrar(){if(!$('#cE').value.trim())return toast('Contá el efectivo y ponelo');
  try{const r=await rpc('caja_cerrar',{p_efectivo:num($('#cE').value),p_notas:$('#cN').value||null});
    modal(`<h3>✅ Turno cerrado</h3><div class="resu"><span>Total vendido</span><b>${plata(r.total)}</b></div><div class="resu"><span>Ventas</span><b>${r.tickets}</b></div>
    <div class="resu"><span>Efectivo esperado</span><b>${plata(r.efectivo_esperado)}</b></div><div class="resu"><span>Efectivo contado</span><b>${plata(r.efectivo_contado)}</b></div>
    <div class="resu grande" style="color:${Math.abs(r.diferencia)<1?'var(--verde)':'var(--rojo)'}"><span>${Math.abs(r.diferencia)<1?'Cierra':'Diferencia'}</span><span>${plata(r.diferencia)}</span></div>
    <p class="muted" style="margin-top:10px">La venta del turno ya quedó cargada en Gestión → Finanzas.</p><div class="acc"><button class="b-ok" onclick="cerrar()">Listo</button></div>`);
    await estadoTurno()}catch(e){toast('⚠️ '+e.message,6000)}}

// ---------- cuenta corriente ----------
function cobrarCC(){if(!ES_ADMIN)return toast('Las cobranzas de cuenta corriente las lleva Poly');if(!TURNO)return toast('Primero abrí el turno');const conDeuda=CLIENTES.filter(c=>(SALDOS[c.id]||0)>0.009);
  modal(`<h3>💳 Cobrar cuenta corriente</h3>${conDeuda.length?`<div style="margin-bottom:6px">${conDeuda.map(c=>`<div class="resu"><span>${esc(c.nombre)}</span><b>${plata(SALDOS[c.id])}</b></div>`).join('')}</div>`:'<p class="muted">Nadie debe nada.</p>'}
  <label>Cliente</label><select id="ccC">${CLIENTES.map(c=>`<option value="${c.id}">${esc(c.nombre)}${SALDOS[c.id]?' · debe '+plata(SALDOS[c.id]):''}</option>`).join('')}</select>
  <div class="fila"><div><label>Importe</label><input id="ccM" inputmode="decimal" autofocus></div><div><label>Cómo paga</label><select id="ccP">${MEDIOS.filter(m=>m!=='Cuenta corriente').map(m=>`<option>${m}</option>`).join('')}</select></div></div>
  <label>N° de operación / referencia (opcional)</label><input id="ccR" placeholder="ej: n° de transferencia">
  <label>Comprobante de pago (foto o PDF, opcional)</label><input id="ccF" type="file" accept="image/*,application/pdf">
  <div class="acc"><button class="b-no" onclick="cerrar()">Cancelar</button><button class="b-ok" id="bCC" onclick="okCC()">Registrar pago</button></div>`)}
async function archivoADatos(f){if(!f)return null;
  if(/^image\//.test(f.type)){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});
    const sc=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return {nombre:f.name,tipo:'image/jpeg',datos:c.toDataURL('image/jpeg',0.72)}}
  if(f.size>4e6)throw new Error('El PDF es muy pesado (máx. 4 MB)');
  const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});return {nombre:f.name,tipo:f.type||'application/pdf',datos:d}}
async function okCC(){const id=+$('#ccC').value,m=num($('#ccM').value);if(!(m>0))return toast('Poné el importe');$('#bCC').disabled=true;
  try{const comp=await archivoADatos(($('#ccF').files||[])[0]);
    const r=await rpc('cc_registrar_pago',{p_cliente:id,p_monto:m,p_medio:$('#ccP').value,p_ref:$('#ccR').value||null});
    if(comp)await api('cc_comprobantes',{method:'POST',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify([Object.assign({mov_id:r.mov_id,cliente_id:id},comp)])});
    SALDOS[id]=+r.saldo;cerrar();toast('✅ Pago registrado'+(comp?' con comprobante':'')+' · saldo '+plata(r.saldo),4000);estadoTurno()}catch(e){toast('⚠️ '+e.message,6000);$('#bCC').disabled=false}}

cargar().catch(e=>{$('#estado').textContent='⚠️ No se pudo cargar: '+e.message});
setTimeout(()=>$('#bus').focus(),300);
</script>
