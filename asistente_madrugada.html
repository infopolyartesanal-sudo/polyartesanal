<script>
/* Poly Artesanal — control de acceso
   Cada módulo incluye este archivo. Verifica la sesión y deja entrar solo:
   - al administrador (rol admin) a todo
   - a cada usuario de sector, únicamente a su módulo
*/
(function () {
  var SB_URL = 'https://sinoeoaktirnscdpbvdc.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg';
  var ARCHIVO = { cocina: 'asistente_cocina.html', panaderia: 'asistente_panaderia.html', pasteleria: 'asistente_pasteleria.html',
                  madrugada: 'asistente_madrugada.html', salon: 'asistente_salon.html', deposito: 'asistente_deposito.html' };
  var pagina = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  var requerido = null; // módulo que exige esta página; 'admin' = solo Poly
  Object.keys(ARCHIVO).forEach(function (m) { if (ARCHIVO[m] === pagina) requerido = m; });
  if (pagina === 'gestion.html' || pagina === 'central.html') requerido = 'admin';

  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function borrar() { try { localStorage.removeItem('poly_sesion'); localStorage.removeItem('poly_usuario'); } catch (e) {} }
  function irA(p) { location.replace(p); }
  function mostrar() { document.documentElement.style.visibility = ''; }

  window.polyRPC = function (fn, body) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message || 'Error'); return j; }); });
  };
  window.polyToken = function () { return leer('poly_sesion'); };
  window.polySalir = function () {
    var t = leer('poly_sesion'); borrar();
    var fin = function () { location.href = 'index.html'; };
    if (t) window.polyRPC('cerrar_sesion', { p_token: t }).then(fin, fin); else fin();
  };

  function permitido(u) { return u.rol === 'admin' || (requerido && requerido !== 'admin' && u.modulo === requerido); }
  function destino(u) { return u.rol === 'admin' ? 'index.html' : (ARCHIVO[u.modulo] || 'index.html'); }

  function barra(u) {
    var b = document.createElement('div');
    b.id = 'poly-sesion';
    b.style.cssText = 'position:fixed;top:4px;left:4px;z-index:99999;font:11px system-ui,sans-serif;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:3px 4px 3px 9px;display:flex;gap:6px;align-items:center;';
    b.innerHTML = '<span>👤 ' + (u.nombre || u.usuario) + '</span>' +
      (u.rol === 'admin' ? '<a href="index.html" style="color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:10px;padding:2px 7px;">Menú</a>' : '') +
      '<button type="button" style="border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:2px 7px;font:inherit;cursor:pointer;">Salir</button>';
    b.querySelector('button').onclick = window.polySalir;
    document.body.appendChild(b);
  }

  if (pagina === 'index.html' || pagina === '') return; // el index maneja su propio login
  document.documentElement.style.visibility = 'hidden';
  var token = leer('poly_sesion');
  if (!token) { irA('index.html'); return; }

  var guardado = null; try { guardado = JSON.parse(leer('poly_usuario') || 'null'); } catch (e) {}
  window.polyRPC('verificar_sesion', { p_token: token }).then(function (u) {
    if (!u || !u.ok) { if (u && u.motivo === 'fuera_local') { irA('index.html#fuera'); return; } borrar(); irA('index.html'); return; }
    try { localStorage.setItem('poly_usuario', JSON.stringify(u)); } catch (e) {}
    if (!permitido(u)) { irA(destino(u)); return; }
    window.POLY_USUARIO = u;
    var listo = function () { barra(u); mostrar(); };
    if (document.body) listo(); else document.addEventListener('DOMContentLoaded', listo);
  }, function () {
    // sin internet: si ya había entrado en este dispositivo, lo dejamos trabajar
    if (guardado && permitido(guardado)) {
      window.POLY_USUARIO = guardado;
      var listo = function () { barra(guardado); mostrar(); };
      if (document.body) listo(); else document.addEventListener('DOMContentLoaded', listo);
    } else { irA('index.html'); }
  });
})();

</script>

<script>
/* Poly Artesanal · tema "Noche Poly": modo oscuro, orbe del asistente y pronóstico para el leudado.
   No guarda nada en la base. Clima: Open-Meteo (gratis, sin clave). */
(function () {
  var KT = 'poly_tema', KC = 'poly_clima', KA = 'poly_aviso_leudado';
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  if (ls.get(KT) !== 'clasico') document.documentElement.classList.add('noche');

  // Villa Urquiza, CABA
  var LAT = -34.573, LON = -58.488;
  // Regla de leudado: con 24° o más se avisa a las 7:00; con 10° o menos, a las 14:00; en el medio, proporcional.
  var REGLA = { calor: 24, horaCalor: 7, frio: 10, horaFrio: 14 };
  var pagina = (location.pathname.split('/').pop() || 'index.html').replace('.html', '');
  var CON_AVISO = { asistente_cocina: 1 };

  function horaLeudado(t) {
    if (t >= REGLA.calor) return REGLA.horaCalor;
    if (t <= REGLA.frio) return REGLA.horaFrio;
    var h = REGLA.horaFrio - (t - REGLA.frio) * (REGLA.horaFrio - REGLA.horaCalor) / (REGLA.calor - REGLA.frio);
    return Math.round(h * 2) / 2;
  }
  function hhmm(h) { var m = Math.round((h % 1) * 60); return Math.floor(h) + ':' + (m < 10 ? '0' : '') + m; }
  function icono(c, noche) {
    if (c == null) return '';
    if (c === 0) return noche ? '🌙' : '☀️';
    if (c <= 2) return noche ? '☁️' : '🌤️';
    if (c === 3) return '☁️';
    if (c <= 48) return '🌫️';
    if (c <= 67 || (c >= 80 && c <= 82)) return '🌧️';
    if (c <= 77 || c === 85 || c === 86) return '❄️';
    return '⛈️';
  }
  function hoyBA() { return new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); }
  function ahoraHorasBA() { var d = new Date(Date.now() - 3 * 3600e3); return d.getUTCHours() + d.getUTCMinutes() / 60; }

  function leerClima() {
    try { var c = JSON.parse(ls.get(KC) || 'null'); if (c && Date.now() - c.ts < 3600e3 && c.dia === hoyBA()) return Promise.resolve(c); } catch (e) {}
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code' +
      '&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=2';
    return fetch(u).then(function (r) { if (!r.ok) throw new Error('clima ' + r.status); return r.json(); }).then(function (j) {
      var hs = j.hourly.time, ts = j.hourly.temperature_2m, cs = j.hourly.weather_code, dia = j.daily.time[0], man = j.daily.time[1];
      var noche = [], nc = null;
      for (var i = 0; i < hs.length; i++) {
        var f = hs[i].slice(0, 10), h = +hs[i].slice(11, 13);
        if ((f === dia && h >= 20) || (f === man && h <= 6)) { noche.push(ts[i]); if (f === dia && h === 23) nc = cs[i]; }
      }
      var c = { ts: Date.now(), dia: dia, ahora: j.current ? j.current.temperature_2m : null, codAhora: j.current ? j.current.weather_code : null,
        max: j.daily.temperature_2m_max[0], min: j.daily.temperature_2m_min[0], cod: j.daily.weather_code[0],
        noche: noche.length ? Math.min.apply(null, noche) : j.daily.temperature_2m_min[1], codNoche: nc };
      ls.set(KC, JSON.stringify(c));
      return c;
    });
  }

  var clima = null, orbe, panel;
  function r0(x) { return x == null ? '–' : Math.round(x) + '°'; }

  function pintarPanel() {
    var oscuro = document.documentElement.classList.contains('noche');
    var h = '<div class="pp-tit"><span>Poly · hoy</span><button aria-label="Cerrar" onclick="PolyTema.cerrar()">✕</button></div>';
    if (!clima) h += '<div class="pp-err">' + (PolyTema.error ? 'No pude traer el pronóstico (¿sin internet?).' : 'Buscando el pronóstico…') + '</div>';
    else {
      var hl = horaLeudado(clima.max);
      h += '<div class="pp-clima">' +
        '<div class="pp-c"><div class="l">Día</div><div class="t">' + icono(clima.cod) + ' ' + r0(clima.max) + '</div><div class="s">ahora ' + r0(clima.ahora) + ' · mín ' + r0(clima.min) + '</div></div>' +
        '<div class="pp-c"><div class="l">Noche</div><div class="t">' + icono(clima.codNoche == null ? clima.cod : clima.codNoche, true) + ' ' + r0(clima.noche) + '</div><div class="s">de 20 a 6 h</div></div></div>' +
        '<div class="pp-leu">🥖 Sacar a leudar a las <b>' + hhmm(hl) + '</b><div class="s">' +
        (clima.max >= REGLA.calor ? 'Día caluroso: la masa leuda rápido.' : clima.max <= REGLA.frio ? 'Día frío: la masa tarda más.' : 'Con ' + r0(clima.max) + ' de máxima (24° → 7:00 · 10° → 14:00).') + '</div></div>';
    }
    h += '<button class="pp-tema" onclick="PolyTema.cambiarTema()">' + (oscuro ? '☀️ Volver al estilo clásico' : '🌙 Usar el estilo Noche Poly') + '</button>';
    panel.innerHTML = h;
  }

  function revisarAviso() {
    if (!clima || !CON_AVISO[pagina]) return;
    var hl = horaLeudado(clima.max), ya = ahoraHorasBA(), hoy = hoyBA();
    var activo = ya >= hl - 0.5 && ya < hl + 3 && ls.get(KA) !== hoy;
    orbe.classList.toggle('alerta', activo);
    var av = document.getElementById('poly-aviso');
    if (activo && !av) {
      av = document.createElement('div'); av.id = 'poly-aviso';
      av.innerHTML = '<span class="ic">⏰</span><div>' + (ya >= hl ? 'Es hora de <b>sacar la mercadería a leudar</b>' : 'A las <b>' + hhmm(hl) + '</b> hay que sacar la mercadería a leudar') +
        '<br><small>Hoy ' + r0(clima.max) + ' de máxima</small></div><button onclick="PolyTema.listoAviso()">Listo</button>';
      document.body.appendChild(av);
    } else if (!activo && av) av.remove();
  }

  window.PolyTema = {
    horaLeudado: horaLeudado, regla: REGLA, error: null,
    abrir: function () { panel.classList.add('abierto'); pintarPanel(); },
    cerrar: function () { panel.classList.remove('abierto'); },
    alternar: function () { panel.classList.contains('abierto') ? PolyTema.cerrar() : PolyTema.abrir(); },
    cambiarTema: function () {
      var on = document.documentElement.classList.toggle('noche');
      ls.set(KT, on ? 'noche' : 'clasico'); pintarPanel();
    },
    listoAviso: function () { ls.set(KA, hoyBA()); revisarAviso(); }
  };

  function iniciar() {
    if (document.getElementById('poly-orbe')) return;
    panel = document.createElement('div'); panel.id = 'poly-panel'; document.body.appendChild(panel);
    var lg = document.querySelector('#header .logo');
    var hd = document.querySelector('#header') || document.querySelector('body>header');
    if (lg && !lg.querySelector('img') && lg.textContent.trim().length <= 4) {
      // asistentes: el logo del encabezado se vuelve el orbe
      lg.innerHTML = '<span>' + lg.textContent.trim() + '</span><b id="poly-orbe-t" style="display:none"></b>';
      lg.classList.add('poly-logo-orbe'); lg.title = 'Pronóstico y leudado'; lg.onclick = PolyTema.alternar;
      orbe = lg; panel.classList.add('arriba'); panel.style.left = '14px'; panel.style.right = 'auto';
    } else {
      orbe = document.createElement('button'); orbe.id = 'poly-orbe'; orbe.type = 'button'; orbe.title = 'Pronóstico y leudado';
      orbe.innerHTML = '<span class="o-halo"></span><span class="o-giro"></span><span class="o-nucleo" id="poly-orbe-t">✦</span>';
      orbe.onclick = PolyTema.alternar;
      if (hd) {
        orbe.classList.add('en-header'); panel.classList.add('arriba');
        var ult = hd.querySelector(':scope>button:last-of-type');
        if (ult) hd.insertBefore(orbe, ult); else hd.appendChild(orbe);
      } else document.body.appendChild(orbe);
    }
    document.addEventListener('click', function (e) { if (panel.classList.contains('abierto') && !panel.contains(e.target) && !orbe.contains(e.target)) PolyTema.cerrar(); });
    function cargar() {
      leerClima().then(function (c) { clima = c; PolyTema.error = null; document.getElementById('poly-orbe-t').textContent = r0(c.ahora != null ? c.ahora : c.max);
        if (panel.classList.contains('abierto')) pintarPanel(); revisarAviso(); })
        .catch(function (e) { PolyTema.error = e; if (panel.classList.contains('abierto')) pintarPanel(); });
    }
    cargar(); setInterval(cargar, 20 * 60e3); setInterval(revisarAviso, 60e3);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();

</script>

<style id="tema-noche">
/* Poly Artesanal · estilo "Noche Poly" (compartido por todos los módulos) */
html.noche{color-scheme:dark}
html.noche body{background:radial-gradient(1100px 620px at 50% -12%,#1b4a2b 0%,#0b1f12 46%,#050d08 100%) fixed !important;color:#e6efe8}
html.noche input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=color]),
html.noche select,html.noche textarea{background-color:#0c1d12 !important;color:#eaf2ec !important;border-color:#2a4a34 !important}
html.noche input:focus,html.noche select:focus,html.noche textarea:focus{border-color:#c9a84c !important;outline:none;box-shadow:0 0 0 3px rgba(201,168,76,.18)}
html.noche ::placeholder{color:#6f8a78 !important}
html.noche input[type=checkbox],html.noche input[type=radio]{accent-color:#c9a84c}
html.noche ::-webkit-scrollbar{width:9px;height:9px}
html.noche ::-webkit-scrollbar-thumb{background:#21402b;border-radius:9px}
html.noche ::-webkit-scrollbar-track{background:transparent}
html.noche hr{border-color:#21402b}
html.noche a{color:#9fe0b2}
html.noche img{opacity:.96}

/* ── Orbe (la burbuja del asistente) ── */
#poly-orbe{position:fixed;left:14px;bottom:14px;width:52px;height:52px;border-radius:50%;z-index:9990;cursor:pointer;border:0;padding:0;background:transparent;-webkit-tap-highlight-color:transparent}
#poly-orbe .o-halo{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.35),rgba(24,107,52,.18) 45%,transparent 70%);animation:poly-respira 3.2s ease-in-out infinite}
#poly-orbe .o-giro{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#186b34,#c9a84c,#2fae5e,#0c461f,#e6c873,#186b34);animation:poly-gira 6s linear infinite;filter:blur(.4px)}
#poly-orbe .o-nucleo{position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a6a3e,#0a1d10 70%);display:flex;align-items:center;justify-content:center;color:#f2e6c4;font:700 13px/1 system-ui,sans-serif;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
#poly-orbe.alerta .o-halo{background:radial-gradient(circle,rgba(255,196,64,.75),rgba(255,140,0,.25) 50%,transparent 72%);animation-duration:1.1s}
#poly-orbe.alerta .o-giro{animation-duration:1.8s}
@keyframes poly-gira{to{transform:rotate(360deg)}}
@keyframes poly-respira{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.12);opacity:1}}

#poly-panel{position:fixed;left:14px;bottom:76px;width:min(330px,calc(100vw - 28px));z-index:9991;border-radius:18px;padding:16px;
  background:rgba(9,24,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(201,168,76,.28);
  box-shadow:0 18px 50px rgba(0,0,0,.55);color:#eaf2ec;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:none}
#poly-panel.abierto{display:block;animation:poly-sube .18s ease-out}
@keyframes poly-sube{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#poly-panel .pp-tit{font:700 11px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#c9a84c;margin-bottom:10px;display:flex;justify-content:space-between}
#poly-panel .pp-tit button{background:none;border:0;color:#9fb7a7;font-size:16px;cursor:pointer;line-height:1}
#poly-panel .pp-clima{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#poly-panel .pp-c{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px}
#poly-panel .pp-c .l{font-size:11px;color:#9fb7a7;text-transform:uppercase;letter-spacing:.08em}
#poly-panel .pp-c .t{font-size:26px;font-weight:700;margin-top:2px}
#poly-panel .pp-c .s{font-size:12px;color:#9fb7a7}
#poly-panel .pp-leu{margin-top:10px;border-radius:12px;padding:11px 12px;background:linear-gradient(135deg,rgba(201,168,76,.18),rgba(24,107,52,.18));border:1px solid rgba(201,168,76,.35)}
#poly-panel .pp-leu b{color:#f0d68a;font-size:17px}
#poly-panel .pp-leu .s{font-size:12px;color:#b9cbbf;margin-top:3px}
#poly-panel .pp-tema{margin-top:12px;width:100%;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#eaf2ec;cursor:pointer;font:600 13px system-ui,sans-serif}
#poly-panel .pp-err{font-size:13px;color:#b9cbbf}

#poly-aviso{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9992;width:min(440px,calc(100vw - 24px));border-radius:16px;padding:12px 14px;
  background:linear-gradient(135deg,#3a2a08,#1c3a22);border:1px solid #c9a84c;color:#fff3d6;box-shadow:0 14px 40px rgba(0,0,0,.5);
  font:14px/1.4 system-ui,sans-serif;display:flex;gap:10px;align-items:center;animation:poly-sube .25s ease-out}
#poly-aviso .ic{font-size:24px;animation:poly-respira 1.2s ease-in-out infinite}
#poly-aviso b{color:#ffd77a}
#poly-aviso button{margin-left:auto;background:#c9a84c;color:#1b1405;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap}

/* logo del encabezado de los asistentes como mini-orbe */
html.noche .poly-logo-orbe{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;flex-shrink:0}
html.noche .poly-logo-orbe::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#186b34,#c9a84c,#2fae5e,#0c461f,#186b34);animation:poly-gira 7s linear infinite;z-index:0}
html.noche .poly-logo-orbe::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#0b1f12;z-index:0}
html.noche .poly-logo-orbe>span{position:relative;z-index:1;font-size:20px;line-height:1}
@media print{#poly-orbe,#poly-panel,#poly-aviso{display:none !important}}

/* encabezados: vidrio oscuro en vez de bloques de color */
html.noche #header,html.noche body>header{background:linear-gradient(180deg,#123222 0%,#0b2014 100%) !important;border-bottom:1px solid rgba(201,168,76,.35) !important;box-shadow:0 6px 24px rgba(0,0,0,.35)}
html.noche body>nav{background:rgba(8,22,13,.92) !important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #1f3d29}
html.noche body>nav a.on{color:#f0d68a !important}
/* orbe dentro del encabezado */
#poly-orbe.en-header{position:relative;left:auto;bottom:auto;width:36px;height:36px;flex-shrink:0;margin-left:4px}
#poly-orbe.en-header .o-halo{inset:-6px}
#poly-orbe.en-header .o-nucleo{inset:3px;font-size:11px}
#poly-panel.arriba{bottom:auto;top:64px;left:auto;right:14px}
html.noche .poly-logo-orbe{cursor:pointer}
html.noche .poly-logo-orbe.alerta::before{animation-duration:1.4s;box-shadow:0 0 18px 4px rgba(255,196,64,.7)}

</style>
<!-- /tema-noche -->
</head>

async function sbFetch(method, table, body=null, params='') {
  const url = SUPABASE_URL + '/rest/v1/' + table + params;
  const headers = {
    'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=representation' : 'return=representation'
  };
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) { console.error('Supabase error:', await res.text()); return null; }
  return method === 'DELETE' ? null : await res.json();
}
async function sbUpsert(table, data) { return sbFetch('POST', table, Array.isArray(data) ? data : [data]); }

async function loadLeudando(){

      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'
      + '<div style="flex:1;min-width:0;"><div style="font-size:16px;font-weight:700;">'+nombre+'</div>'
      + '<div style="font-size:13px;color:#666;margin-top:3px;">'+cantTxt+' · '+origen+' · '+fmtHora(l.created_at)+'</div>'
      + (l.pedido_item_id ? '<div style="font-size:12px;font-weight:700;color:#BF360C;background:#FFF3E0;border-radius:6px;padding:4px 8px;margin-top:5px;">📦 '+(l.nota||'Pedido de cliente').replace(/</g,'&lt;')+'</div>' : '')
      + '</div></div>'

      + '</div>';
  }).join('');
}

// Cuando algo no salió (no se horneó, se dejó en 0): se saca de la lista sin mandar nada al Salón ni cargar merma
async function noSalio(){

function closeModal(){ document.getElementById('hornear-modal').style.display='none'; pendingItem=null; photoFile=null; }
function updateMerma(){
  if(!pendingItem) return;

function onPhotoChange(input){
  const f = input.files && input.files[0]; if(!f) return;
  photoFile = f;
  input.value = '';
  const url = URL.createObjectURL(f);
  document.getElementById('hm-foto-preview').innerHTML = '<img src="'+url+'" onload="URL.revokeObjectURL(this.src)" style="max-width:100%;max-height:220px;border-radius:8px;margin-top:10px;" />';
}
// Achica la foto (máx 1600 px, JPEG) antes de subirla: las fotos del celu pesan varios MB y en celulares con poca memoria se colgaba.
function achicarFoto(file, lado){
  lado = lado || 1600;
  return new Promise(ok => {
    if (!file || !/^image\//.test(file.type || 'image/')) return ok(file);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { try {
        const k = Math.min(1, lado / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(b => { c.width = c.height = 0; ok(b ? new File([b], 'foto.jpg', { type: 'image/jpeg' }) : file); }, 'image/jpeg', 0.82);
      } catch (e) { URL.revokeObjectURL(url); ok(file); } };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}
async function uploadFoto(file, item){
  file = await achicarFoto(file);
  const ext = ((file.name||'foto.jpg').split('.').pop()||'jpg').toLowerCase();
  const obj = Date.now() + '_' + ((item.producto_id||'item').replace(/[^a-z0-9_-]/gi,'')) + '.' + ext;
  const res = await fetch(SUPABASE_URL + '/storage/v1/object/madrugada/' + obj, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type': file.type||'image/jpeg', 'x-upsert':'true' },
    body: file
  });
  if(!res.ok) throw new Error('upload '+res.status);
  return SUPABASE_URL + '/storage/v1/object/public/madrugada/' + obj;
}
// Kilos: acepta coma o punto como decimal ("2,235" o "2.235" = 2,235 kg). Antes el campo numérico tomaba el punto como miles (2.235 → 2235 kg).
function leerKg(id){
  let s = String((document.getElementById(id)||{}).value||'').trim().replace(/\s/g,'');
  if (!s) return 0;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',', '.');
  else if ((s.match(/\./g)||[]).length > 1) s = s.replace(/\./g,'');
  const n = Number(s);
  return isFinite(n) && n > 0 ? n : 0;
}
const KG_MAX_TANDA = 40; // más de esto en una sola carga casi seguro es un error de tipeo
async function confirmHornear(){
  if(!pendingItem) return;

  const merma = peso ? Math.round((leerKg('hm-kg-merma'))*1000)/1000 : Math.max(0, leud-horn);
  if (!(leud > 0) || (!(horn > 0) && !(merma > 0))) { btn.disabled = false; btn.style.opacity = '1'; return noSalio(); }
  if (peso && (horn > KG_MAX_TANDA || merma > KG_MAX_TANDA) && !confirm('¿Seguro que son ' + String(Math.max(horn, merma)).replace('.', ',') + ' kg? Revisá que no sean gramos (ej: 2,5 kg y no 2500).')) { btn.disabled = false; btn.style.opacity = '1'; return; }
  setStatus('Despachando…');
  let fotoUrl = null;
  if(photoFile){ try { fotoUrl = await uploadFoto(photoFile, pendingItem); } catch(e){ console.warn('foto:', e); } }
  try {
    if(horn > 0 && pendingItem.pedido_item_id){
      // es de un pedido de cliente: se despacha a nombre del pedido (el Salón lo ve como pedido, no como stock suelto)
      await sbFetch('POST', 'rpc/pedido_item_avanzar', { p_item: pendingItem.pedido_item_id, p_estado: 'despachado' });
    } else if(horn > 0){
      await sbUpsert('salon_recepciones', [{
        producto_id: pendingItem.producto_id,
        producto_nombre: pendingItem.producto_nombre || pendingItem.producto_id,
        cantidad: horn, unidad: peso ? 'kg' : 'u', sector_origen: 'madrugada', destino: 'salon', estado: 'despachado', foto_url: fotoUrl
      }]);
    }
    if(merma > 0){
      await sbUpsert('mermas', [{
        sector: 'madrugada', producto_id: pendingItem.producto_id,
        producto_nombre: pendingItem.producto_nombre || pendingItem.producto_id,
        cantidad: merma, motivo: peso ? 'Se tiró al hornear (kg)' : 'No leudó / no se pudo hornear'
      }]);
    }

// ── PRODUCTOS POR PESO: salen de leudado por lata pero se venden por kilo (libritos, caseritos, chipa…) ──
let reglasPeso = null;
async function cargarReglasPeso(){
  if (reglasPeso) return reglasPeso;
  try { const c = await sbSelect('config', '?clave=eq.productos_por_peso'); reglasPeso = ((((c||[])[0]||{}).valor||{}).reglas) || []; } catch (e) { reglasPeso = []; }
  return reglasPeso;
}
function esPorPeso(nombre){ const n = nrmMad(nombre); return (reglasPeso||[]).some(r => r.patron && n.includes(nrmMad(r.patron))); }
function latasTxt(n){ n = Number(n)||0; return n + (n === 1 ? ' lata' : ' latas'); }
async function descontarComprado(producto, kg){
  try {
    const r = await polyRPC('madrugada_comprado', { p_producto: producto, p_kg: kg, p_usuario: (window.POLY_USUARIO && window.POLY_USUARIO.usuario) || null });
    if (!r || !r.aplicado) return '';
    return ' · quedan ' + String(r.quedan).replace('.', ',') + ' kg de ' + r.insumo.toLowerCase();
  } catch (e) { console.warn('comprado', e); return ''; }
}

// ── RELLENOS: al hornear lenguitas, popurrí, etc. se descuenta la crema pastelera (u otro relleno) del stock de Cocina.
// Las reglas (qué producto, qué relleno, cuántos gramos por unidad) se cargan en Gestión → Depósitos.
async function descontarRelleno(producto, unidades){
  if (!(unidades > 0)) return '';
  try {
    const r = await polyRPC('madrugada_consumos', { p_producto: producto, p_unidades: unidades, p_usuario: (window.POLY_USUARIO && window.POLY_USUARIO.usuario) || null });
    const items = (r && r.items) || [];
    if (!items.length) return '';
    const corto = n => { const x = String(n||'').toLowerCase(); return x.includes('imp') ? 'azúcar impalpable' : x; };
    const cant = x => x.kg < 1 ? Math.round(x.kg * 1000) + ' g' : String(Math.round(x.kg * 100) / 100).replace('.', ',') + ' kg';
    await sbLog('madrugada', 'relleno', 'Al hornear ' + unidades + ' ' + producto + ' se usaron: ' + items.map(x => cant(x) + ' de ' + x.insumo + ' (quedan ' + x.quedan + ' kg)').join(' · '), null, null, null);
    const pocos = items.filter(x => x.destino !== 'deposito' && x.quedan < 1);
    return ' · usaste ' + items.map(x => cant(x) + ' de ' + corto(x.insumo)).join(', ') + (pocos.length ? ' ⚠️ queda poca ' + pocos.map(x => corto(x.insumo) + ' (' + String(x.quedan).replace('.', ',') + ' kg)').join(' y ') : '');
  } catch (e) { console.warn('relleno', e); return ''; }
}

let recetasMad = [], prodSel = null, prodFoto = null, prodSect = '';
const SECT_MAD = { panaderia:'🍞 Panadería', pasteleria:'🍰 Pastelería', cocina:'🍳 Cocina', venta:'🛒 Local' };
function nrmMad(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function escMad(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function loadRecetasMad(){

// ── ORIGEN: de dónde sale lo que se hornea (freezer, cámara o una masa que estaba fermentando)
let prodOrigen = null, origFreezer = [], origCamara = [], origMasas = [];
const ORIG_BTN = [['freezer','🧊 Freezer'],['camara','❄️ Cámara'],['fermentacion','🫧 Fermentación'],['nuevo','🆕 Masa del día']];

function esCompradoMad(n){ const x = nrmMad(n); return (reglasPeso||[]).some(r => r.comprado && r.patron && x.includes(nrmMad(r.patron))); }
async function pintarOrigen(){

  const n = nrmMad(prodSel.nombre), parecido = r => { const m = nrmMad(r.nombre || r.receta || r.id); return m && (m.includes(n) || n.includes(m) || m.split(' ')[0] === n.split(' ')[0]); };

    if (prodOrigen === 'fermentacion') { origMasas = await sbSelect('masas_fermentando', '?estado=eq.fermentando&order=ingreso_at.asc') || []; L = origMasas.map(r => ({ id: r.id, nom: r.codigo + ' · ' + r.receta + (r.contenido ? ' (' + r.contenido + ')' : ''), receta: r.receta })); }
  } catch (e) { L = []; }

}

async function descontarOrigen(){

}
function cerrarProd(){ document.getElementById('prod-modal').style.display = 'none'; prodSel = null; prodFoto = null; }

    if (confirm('Pusiste ' + cant + ' kg. ¿Eran ' + cant + ' gramos? Tocá Aceptar y lo cargo como ' + String(Math.round(cant) / 1000).replace('.', ',') + ' kg.')) { cant = Math.round(cant) / 1000; } else return;
  }

  const btn = document.getElementById('pm-ok'); btn.disabled = true; btn.style.opacity = '.6'; setStatus('Despachando…');
  const pid = prodSel._libre ? 'mad_' + nrmMad(prodSel.nombre).replace(/[^a-z0-9]+/g, '_') : prodSel._sinReceta ? prodSel.ssId : 'rec_' + prodSel.id;
  let foto = null; if (prodFoto) { try { foto = await uploadFoto(prodFoto, { producto_id: pid }); } catch (e) { console.warn('foto', e); } }
  try {
    await sbUpsert('salon_recepciones', [{ producto_id: pid, producto_nombre: prodSel.nombre, cantidad: Math.round(cant * 1000) / 1000, unidad: porKg ? 'kg' : 'u',
      sector_origen: 'madrugada', destino: 'salon', estado: 'despachado', foto_url: foto }]);
    if (!prodSel._sinReceta && document.getElementById('pm-desc').checked) {
      try { await polyRPC('registrar_produccion', { p_sector: 'madrugada', p_producto: prodSel.nombre, p_tandas: 1, p_unidades: cant, p_unidades_por_tanda: null }); } catch (e) { console.warn('insumos', e); }
    }
    await sbLog('madrugada', 'produccion', 'Horneado y despachado al Salón: ' + (porKg ? cant + ' kg' : cant + ' u') + ' ' + prodSel.nombre + (kg && !porKg ? ' (' + kg + ' kg)' : '') + (u && porKg ? ' (' + u + ' u)' : ''), cant, pid, porKg ? 'kg' : 'u');
    const rell = porKg ? await descontarComprado(prodSel.nombre, cant) : await descontarRelleno(prodSel.nombre, cant);
    const orig = await descontarOrigen();
    toast('✅ Despachado al Salón: ' + String(cant).replace('.', ',') + (porKg ? ' kg' : ' u') + rell + orig, 5000);
    cerrarProd();
  } catch (e) { console.error(e); toast('⚠️ Hubo un error, probá de nuevo'); }
  btn.disabled = false; btn.style.opacity = '1'; setStatus('Listo');
}

// ── CHURRERO: boleta del día (precios fijos cargados en Gestión) ─────────
let chItems = [], chBoletas = [];
function hoyMad(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function pesos(n){ return '$ ' + Math.round(+n||0).toLocaleString('es-AR'); }
async function loadChurrero(){
  setStatus('Cargando…');
  const [cfg, bol] = await Promise.all([sbSelect('config', '?clave=eq.churrero'), sbSelect('churrero_boletas', '?order=fecha.desc,id.desc&limit=14')]);
  chItems = (((cfg||[])[0]||{}).valor||{}).items || []; chBoletas = bol || [];
  renderChurrero(); setStatus('Listo');
}
function chMult(it){ return it.remito === 'docena' ? 12 : 1; }
function chSub(it, u){ return (it.unidad === 'docena' ? u / 12 : u) * (Number(it.precio)||0); }
let chFoto = null, chLeido = null;
const CH_BORRADOR = 'mad_churrero_borrador';
function chGuardarBorrador(){ try { const q = {}; chItems.forEach((it, i) => { const v = (document.getElementById('ch-q' + i)||{}).value; if (v) q[it.codigo || it.id || i] = v; });
  localStorage.setItem(CH_BORRADOR, JSON.stringify({ dia: hoyMad(), q, ped: (document.getElementById('ch-ped')||{}).value || '' })); } catch (e) {} }
function chRestaurarBorrador(){ try { const b = JSON.parse(localStorage.getItem(CH_BORRADOR) || 'null'); if (!b || b.dia !== hoyMad()) return;
  chItems.forEach((it, i) => { const v = b.q[it.codigo || it.id || i]; const el = document.getElementById('ch-q' + i); if (v && el && !el.value) el.value = v; });
  const p = document.getElementById('ch-ped'); if (p && b.ped && !p.value) p.value = b.ped; } catch (e) {} }
function chCalcular(){
  chGuardarBorrador();
  let t = 0; chItems.forEach((it, i) => { const q = Number((document.getElementById('ch-q' + i)||{}).value) || 0, u = q * chMult(it), sub = chSub(it, u); t += sub;
    const s = document.getElementById('ch-s' + i); if (s) s.textContent = q ? (chMult(it) > 1 ? u + ' u · ' : '') + pesos(sub) : ''; });
  document.getElementById('ch-total').textContent = pesos(t);
}
function renderChurrero(){
  const el = document.getElementById('ch-form');
  if (!chItems.length) { el.innerHTML = emptyState('Todavía no hay productos del churrero.', 'Se cargan en Gestión → Churrero.'); return; }
  const tieneKey = !!localStorage.getItem('anthropic_api_key');
  el.innerHTML = '<div style="font-size:15px;font-weight:800;color:#1B5E20;margin-bottom:4px;">🍩 Remito del churrero</div>'
    + '<div style="font-size:12px;color:#888;margin-bottom:10px;">Copiá los números del remito en el mismo casillero (son <b>docenas</b>). Entra al Salón: churros y donas como Facturas, pastelitos como Pastelitos.</div>'
    + '<div style="display:flex;gap:8px;margin-bottom:10px;"><label style="flex:1;background:#E8F5E9;color:#1B5E20;border-radius:10px;padding:12px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;"><i class="ti ti-camera"></i> Foto del remito (cámara o galería)<input type="file" accept="image/*" onchange="chFotoElegida(this.files[0]);this.value=\'\';" style="display:none;"></label></div>'
    + '<div id="ch-foto-info" style="font-size:12px;color:#666;margin:-4px 0 8px;">' + (chFoto ? '📷 Foto lista' + (chLeido ? ' · ' + chLeido : '') : (tieneKey ? 'Con la foto, el sistema completa los casilleros solo. Después revisalos.' : '')) + '</div>'
    + (!tieneKey ? '<details style="font-size:12px;color:#666;margin-bottom:10px;"><summary>Activar lectura automática de la foto</summary><div style="margin-top:6px;">Pegá la clave de IA (la misma de Gestión):<input id="ch-key" placeholder="sk-ant-…" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #ddd;border-radius:6px;margin-top:4px;"><button onclick="localStorage.setItem(\'anthropic_api_key\',document.getElementById(\'ch-key\').value.trim());renderChurrero();" style="margin-top:6px;background:#1B5E20;color:#fff;border:none;border-radius:6px;padding:8px 12px;">Guardar clave</button></div></details>' : '')
    + '<div style="display:flex;gap:8px;"><div style="flex:1"><label style="font-size:13px;font-weight:600;">Fecha</label><input type="date" id="ch-fecha" value="' + hoyMad() + '" style="width:100%;box-sizing:border-box;padding:10px;border:1.5px solid #ddd;border-radius:8px;margin:4px 0 10px;font-size:15px;"></div>'
    + '<div style="width:110px"><label style="font-size:13px;font-weight:600;">N° pedido</label><input id="ch-ped" inputmode="numeric" oninput="chGuardarBorrador()" style="width:100%;box-sizing:border-box;padding:10px;border:1.5px solid #ddd;border-radius:8px;margin:4px 0 10px;font-size:15px;"></div></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' + chItems.map((it, i) => '<div style="background:#fff;border:1.5px solid #F8BBD0;border-radius:10px;padding:8px;">'
      + '<div style="font-size:12px;color:#C2185B;font-weight:800;letter-spacing:1px;">' + escMad(it.codigo || '—') + '</div><div style="font-size:12px;font-weight:700;line-height:1.2;min-height:28px;">' + escMad(it.nombre) + '</div>'
      + '<div style="display:flex;align-items:center;gap:6px;margin-top:4px;"><input type="number" id="ch-q' + i + '" min="0" step="1" inputmode="numeric" placeholder="0" oninput="chCalcular()" style="width:70px;padding:8px;font-size:18px;text-align:center;border:1.5px solid #C8E6C9;border-radius:8px;font-weight:700;"><span style="font-size:11px;color:#888;">' + (chMult(it) > 1 ? 'doc.' : 'u') + '</span></div>'
      + '<div id="ch-s' + i + '" style="font-size:11px;color:#1B5E20;font-weight:700;min-height:14px;"></div></div>').join('') + '</div>'
    + '<div id="ch-extra" style="font-size:12px;color:#B71C1C;margin-top:6px;"></div>'
    + '<div style="display:flex;justify-content:space-between;font-size:17px;font-weight:800;margin:12px 2px;"><span>Total</span><span id="ch-total">$ 0</span></div>'
    + '<label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;background:#FFF8E1;border-radius:10px;padding:10px;"><input type="checkbox" id="ch-rev" style="width:22px;height:22px;"> <span><b>Revisé los números contra el remito</b> y están bien.</span></label>'
    + '<button onclick="guardarBoleta()" id="ch-ok" style="width:100%;margin-top:10px;background:#1B5E20;color:#fff;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;"><i class="ti ti-check"></i> OK: guardar y mandar al Salón</button>'
    + '<div style="background:#FFF8E1;border:1px solid #FFE082;border-radius:12px;padding:12px;margin-top:16px;">'
    + '<div style="font-size:14px;font-weight:700;color:#E65100;">♻️ Churros de ayer, azucarados</div>'
    + '<div style="font-size:12px;color:#666;margin:4px 0 8px;">Si sobraron churros, a la noche se dieron de baja. Si al otro día están bien y los pasás por azúcar, cargalos acá: vuelven al Salón como Facturas, <b>sin boleta ni pago al churrero</b>.</div>'
    + '<div style="display:flex;gap:8px;"><input type="number" id="ch-rec" min="1" step="1" inputmode="numeric" placeholder="Cantidad (unidades)" style="flex:1;min-width:0;padding:11px;font-size:16px;border:1px solid #FFE082;border-radius:8px;text-align:center;">'
    + '<button onclick="mandarChurrosRecuperados()" id="ch-rec-ok" style="background:#E65100;color:#fff;border:none;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer;">Mandar al Salón</button></div></div>'
    + '<div style="font-size:14px;font-weight:700;color:#1B5E20;margin:18px 0 6px;">Últimas boletas</div>'
    + (chBoletas.length ? chBoletas.map(b => '<div style="background:#fafafa;border:1px solid #eee;border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:13px;"><div style="display:flex;justify-content:space-between;font-weight:700;"><span>' + new Date(b.fecha + 'T12:00:00').toLocaleDateString('es-AR', { weekday:'short', day:'2-digit', month:'2-digit' }) + (b.pedido ? ' · pedido ' + escMad(b.pedido) : '') + '</span><span>' + pesos(b.total) + (b.pago_id ? ' · ✅ pagada' : '') + '</span></div><div style="color:#666;">' + (b.items||[]).map(x => (x.docenas != null ? x.docenas + ' doc. ' : x.cantidad + ' ') + escMad(x.codigo || x.nombre)).join(' · ') + (b.revisado_por ? ' · ✔ ' + escMad(b.revisado_por) : '') + (b.foto_url ? ' · <a href="' + b.foto_url + '" target="_blank">📷</a>' : '') + '</div></div>').join('') : '<div style="font-size:13px;color:#999;">Todavía no hay boletas.</div>');
  chRestaurarBorrador();
  chCalcular();
}
// Churros que sobraron, se dieron de baja a la noche y al otro día vuelven al local pasados por azúcar: entran como Facturas, sin boleta.
async function mandarChurrosRecuperados(){
  const q = Math.round(Number(document.getElementById('ch-rec').value) || 0);
  if (!(q > 0)) { toast('Poné cuántos churros volvés a sacar'); return; }
  if (q > 100 && !confirm('¿Seguro que son ' + q + ' churros?')) return;
  const btn = document.getElementById('ch-rec-ok'); btn.disabled = true; btn.style.opacity = '.6'; setStatus('Mandando…');
  try {
    const rec = await sbUpsert('salon_recepciones', [{ producto_id: 'churros_recuperados', producto_nombre: 'Churros', cantidad: q, unidad: 'u', sector_origen: 'madrugada', destino: 'salon', estado: 'despachado' }]);
    if (!rec) throw new Error('No se pudo mandar');
    try { await sbLog('madrugada', 'recupero', 'Churros de ayer azucarados, vuelven al Salón: ' + q + ' u (sin boleta)', q, 'churros_recuperados', 'u'); } catch (e) {}
    document.getElementById('ch-rec').value = '';
    toast('✅ ' + q + ' churros mandados al Salón');
  } catch (e) { toast('⚠️ ' + (e.message || 'Error')); }
  btn.disabled = false; btn.style.opacity = '1'; setStatus('Listo');
}
function chImagenBase64(file){
  return new Promise((ok, mal) => { const url = URL.createObjectURL(file), img = new Image(); img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); const d = c.toDataURL('image/jpeg', 0.85).split(',')[1]; c.width = c.height = 0; ok(d); }; img.onerror = e => { URL.revokeObjectURL(url); mal(new Error('no se pudo abrir la foto')); }; img.src = url; });
}
async function chFotoElegida(file){
  if (!file) return; chLeido = null;
  try { chFoto = await achicarFoto(file); } catch (e) { chFoto = file; }
  const info = document.getElementById('ch-foto-info');
  const key = localStorage.getItem('anthropic_api_key');
  if (!key) { info.textContent = '📷 Foto lista (se guarda con la boleta). Completá los casilleros a mano.'; return; }
  info.textContent = '📷 Leyendo el remito…'; setStatus('Leyendo remito…');
  try {
    const b64 = await chImagenBase64(chFoto);
    const codigos = chItems.filter(it => it.codigo).map(it => it.codigo + ' = ' + it.nombre);
    const prompt = 'Es un remito de una churrería. Tiene una grilla con casilleros, cada uno con un código impreso arriba (CH, D, B, CHR, DG, CHBR, DBN, MINI, DREN, BREN, BOMB, DGL, DRRG, DRNG, PBAT, PDDL, AZUCAR, BOLSAS, CAJAS, etc.) y, a veces, un número escrito a mano debajo. '
      + 'Leé solo los casilleros que tienen un número escrito a mano. Los códigos que nos interesan: ' + codigos.join('; ') + '. Atención: CHR y CHBR son distintos, DRRG y DRNG son distintos. '
      + 'También leé la fecha, el número de PEDIDO y BULTOS si están. Si no estás segura de un número, no lo inventes: ponelo en "dudas". '
      + 'Respondé SOLO con JSON: {"fecha":"YYYY-MM-DD o null","pedido":"texto o null","bultos":numero o null,"cantidades":{"CODIGO":numero},"dudas":"texto corto o null"}';
    const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-5-5', max_tokens: 1000, messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } }, { type: 'text', text: prompt }] }] }) });
    const j = await r.json(); if (j.error) throw new Error(j.error.message);
    const txt = (j.content || []).map(c => c.text || '').join(''); const out = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
    const cant = out.cantidades || {}; let n = 0; const extra = [];
    Object.keys(cant).forEach(cod => { const v = Number(cant[cod]) || 0; if (!v) return; const i = chItems.findIndex(it => (it.codigo || '').toUpperCase() === cod.toUpperCase());
      if (i >= 0) { document.getElementById('ch-q' + i).value = v; n++; } else extra.push(cod + ': ' + v); });
    chItems.forEach((it, i) => { if (it.codigo && !Object.keys(cant).some(c => c.toUpperCase() === it.codigo.toUpperCase())) document.getElementById('ch-q' + i).value = ''; });
    if (out.fecha && /^\d{4}-\d{2}-\d{2}$/.test(out.fecha)) document.getElementById('ch-fecha').value = out.fecha;
    if (out.pedido) document.getElementById('ch-ped').value = String(out.pedido).replace(/\D/g, '') || out.pedido;
    document.getElementById('ch-extra').textContent = (extra.length ? '⚠️ El remito trae códigos que no están cargados en Gestión: ' + extra.join(', ') + '. ' : '') + (out.dudas ? '⚠️ ' + out.dudas : '');
    chLeido = 'leí ' + n + ' casillero' + (n === 1 ? '' : 's') + ': revisalos contra el papel';
    info.textContent = '📷 ' + chLeido; chCalcular();
  } catch (e) { console.warn(e); info.textContent = '📷 Foto lista, pero no pude leerla (' + (e.message || 'error') + '). Completá a mano.'; }
  setStatus('Listo');
}
async function guardarBoleta(){
  const fecha = document.getElementById('ch-fecha').value || hoyMad();
  if (!document.getElementById('ch-rev').checked) { toast('Revisá los números contra el remito y marcá la casilla'); return; }
  const items = chItems.map((it, i) => { const q = Number(document.getElementById('ch-q' + i).value) || 0; if (!(q > 0)) return null; const u = q * chMult(it);
    return { id: it.id, codigo: it.codigo || null, nombre: it.nombre, cantidad: u, docenas: chMult(it) > 1 ? q : null, unidad: 'u', precio: Number(it.precio)||0, subtotal: Math.round(chSub(it, u) * 100) / 100, destino: it.destino || 'Facturas' }; }).filter(Boolean);
  if (!items.length) { toast('Cargá al menos una cantidad'); return; }
  const raros = items.filter(x => (x.docenas != null ? x.docenas > 12 : x.cantidad > 150));
  if (raros.length && !confirm('Revisá estas cantidades, parecen muy altas:\n' + raros.map(x => '• ' + x.nombre + ': ' + (x.docenas != null ? x.docenas + ' docenas = ' + x.cantidad + ' u' : x.cantidad + ' u')).join('\n') + '\n\n¿Las cargo igual?')) return;
  const ped = document.getElementById('ch-ped').value.trim() || null;
  if (chBoletas.some(b => b.fecha === fecha && (!ped || b.pedido === ped)) && !confirm('Ya hay una boleta cargada para ese día' + (ped ? ' con ese pedido' : '') + '. ¿Cargar otra igual?')) return;
  const total = items.reduce((a, x) => a + x.subtotal, 0);
  const btn = document.getElementById('ch-ok'); btn.disabled = true; btn.style.opacity = '.6'; setStatus('Guardando…');
  try {
    const usr = (window.POLY_USUARIO && (window.POLY_USUARIO.nombre || window.POLY_USUARIO.usuario)) || null;
    let foto = null; if (chFoto) { try { foto = await uploadFoto(chFoto, { producto_id: 'remito_churrero' }); } catch (e) { console.warn('foto remito', e); } }
    const codigos = {}; items.forEach(x => { if (x.codigo) codigos[x.codigo] = x.docenas != null ? x.docenas : x.cantidad; });
    const res = await sbUpsert('churrero_boletas', [{ fecha, items, total, cargado_por: usr, revisado_por: usr, pedido: ped, codigos, foto_url: foto }]);
    if (!res) throw new Error('No se pudo guardar');
    const rec = await sbUpsert('salon_recepciones', items.map(x => ({ producto_id: 'churrero_' + x.id, producto_nombre: x.nombre, cantidad: x.cantidad, unidad: 'u', sector_origen: 'churrero', destino: 'salon', estado: 'despachado' })));
    if (!rec) toast('⚠️ La boleta se guardó pero no llegó al Salón: avisá para que lo carguen a mano');
    await sbLog('madrugada', 'churrero', 'Remito del churrero ' + fecha + (ped ? ' (pedido ' + ped + ')' : '') + ': ' + items.map(x => (x.docenas != null ? x.docenas + ' doc. ' : x.cantidad + ' ') + x.nombre).join(', ') + ' · ' + pesos(total) + (usr ? ' · revisó ' + usr : ''), total, null, '$');
    toast('✅ Remito guardado y enviado al Salón'); chFoto = null; chLeido = null; try { localStorage.removeItem(CH_BORRADOR); } catch (e) {}
    await loadChurrero();
  } catch (e) { console.error(e); toast('⚠️ ' + (e.message || 'Hubo un error, probá de nuevo')); btn.disabled = false; btn.style.opacity = '1'; }
  setStatus('Listo');
}
