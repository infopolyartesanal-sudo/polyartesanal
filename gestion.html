async function pvGuardarVinc(k){IS.cargado=false;const l=PV._filas[k];const v=$('#pva'+k).value;const p=pvLeer(v);
  if(v.trim()&&!p)return toast('No encontré ese producto. Elegilo de la lista.');
  if(!p){const a=pvAliasDe(l.k);if(a)return pvQuitarVinc(a.alias);return toast('Elegí un producto de venta');}
  const [x]=await sbIns('productos_venta_alias?on_conflict=alias',[{alias:l.k,codigo:p.codigo,receta_id:pvRecIdDe(l.k)}],true);
  PV.alias=PV.alias.filter(a=>a.alias!==l.k).concat([x]);toast('Vinculado ✅ '+l.nombre+' → '+p.nombre);vVenta()}
// ---------- Fotos de productos (formato PedidosYa: JPG/PNG, 4:3, 1440×1080 a 4000×3000, < 1 MB) ----------
const FOTO={ancho:1600,alto:1200,minAncho:1440,minAlto:1080,maxBytes:990000};
function pvFotoPintar(){const b=$('#pvFotoBox');if(!b)return;const f=window._pvFoto||{};
  b.innerHTML=`<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
    <div style="width:220px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#f2efe8;display:flex;align-items:center;justify-content:center;border:1px solid #ddd">${f.url?`<img src="${esc(f.prev||f.url)}" style="width:100%;height:100%;object-fit:cover">`:'<span class="muted" style="font-size:13px">Sin foto</span>'}</div>
    <div style="flex:1;min-width:200px">
      <label class="btn peq" style="display:inline-block;cursor:pointer;margin:0 6px 6px 0">📷 ${f.url?'Cambiar foto':'Subir o sacar foto'}<input type="file" accept="image/jpeg,image/png,image/*" style="display:none" onchange="pvFotoArchivo(this)"></label>
      ${f.url?`<button class="btn peq sec" type="button" style="margin:0 6px 6px 0" onclick="pvFotoDescargar()">⬇ Descargar para PedidosYa</button><button class="btn peq sec" type="button" style="margin:0 0 6px" onclick="window._pvFoto={url:null,cambio:true};pvFotoPintar()">🗑 Quitar</button>`:''}
      <div style="margin-top:4px;font-size:12px">
        <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pvFb" ${f.blanco?'checked':''} style="width:auto" onchange="pvFotoRehacer()"> No recortar: completar con fondo blanco</label>
        ${f.img&&!f.blanco?`<label style="margin:6px 0 0">Encuadre (qué parte de la foto queda)</label><input type="range" min="0" max="100" value="${f.pos??50}" oninput="window._pvFoto.pos=+this.value" onchange="pvFotoRehacer()" style="width:100%">`:''}
      </div>
      <div id="pvFotoInfo" class="muted" style="font-size:12px;margin-top:6px">${esc(f.info||'')}</div>
    </div></div>`}
function pvFotoArchivo(inp){const file=inp.files&&inp.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{Object.assign(window._pvFoto,{img,pos:50,nombreOrig:file.name});pvFotoRehacer()};img.onerror=()=>toast('⚠️ No se pudo leer esa imagen',4000);img.src=rd.result};rd.readAsDataURL(file)}
// Recorta (o completa con blanco) a 4:3, lleva a 1600×1200 y baja la calidad JPG hasta que pese menos de 1 MB
async function pvFotoProcesar(img,blanco,pos){const W=FOTO.ancho,H=FOTO.alto,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.imageSmoothingQuality='high';const iw=img.naturalWidth,ih=img.naturalHeight,ar=W/H;
  if(blanco){const k=Math.min(W/iw,H/ih),dw=iw*k,dh=ih*k;x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh)}
  else{let sw=iw,sh=iw/ar;if(sh>ih){sh=ih;sw=ih*ar}const p=(pos??50)/100,sx=(iw-sw)*p,sy=(ih-sh)*p;x.drawImage(img,sx,sy,sw,sh,0,0,W,H)}
  let q=.9,blob;for(;q>=.4;q-=.08){blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(blob.size<FOTO.maxBytes)break}
  return {blob,q,chica:Math.min(iw,ih*ar)<FOTO.minAncho}}
async function pvFotoRehacer(){const f=window._pvFoto;if(!f||!f.img)return;f.blanco=!!($('#pvFb')||{}).checked;
  const r=await pvFotoProcesar(f.img,f.blanco,f.pos);const info=$('#pvFotoInfo');if(info)info.textContent='Subiendo…';
  const cod=($('#pvC')||{}).value||'nuevo';const path='pv/'+String(cod).replace(/[^a-z0-9_-]/gi,'')+'_'+Date.now()+'.jpg';
  try{const res=await fetch(SB_URL+'/storage/v1/object/productos/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'image/jpeg','x-upsert':'true'},body:r.blob});
    if(!res.ok)throw new Error('No se pudo subir ('+res.status+')');
    if(f.prev)URL.revokeObjectURL(f.prev);
    Object.assign(f,{url:SB_URL+'/storage/v1/object/public/productos/'+path,prev:URL.createObjectURL(r.blob),blob:r.blob,cambio:true,
      info:'✅ Lista para PedidosYa: 1600×1200 (4:3) · JPG · '+Math.round(r.blob.size/1024)+' KB'+(r.chica?' · ⚠️ la foto original era chica, puede verse un poco borrosa':'')+'. Tocá Guardar para dejarla en el producto.'});
  }catch(e){f.info='⚠️ '+e.message}
  pvFotoPintar()}
async function pvFotoDescargar(){const f=window._pvFoto||{};let blob=f.blob;
  try{if(!blob){const r=await fetch(f.url);blob=await r.blob()}}catch(e){return toast('⚠️ No se pudo bajar la foto',4000)}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(($('#pvN')||{}).value||'producto').replace(/[^a-z0-9áéíóúñ ]/gi,'').trim().replace(/\s+/g,'_')+'_pedidosya.jpg';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function pvVarsLeer(){const nn=v=>{const x=String(v||'').replace(',','.').trim();return x===''?null:+x};
  return [...document.querySelectorAll('#pvVars .pvvar')].map(r=>({n:r.querySelector('.vn').value.trim(),v:r.querySelector('.vv').checked,st:r.querySelector('.vs').checked,i:r.querySelector('.vi').checked,sa:r.querySelector('.vsa').checked,k:r.querySelector('.vk').checked,may:nn(r.querySelector('.vm').value),lpu:nn(r.querySelector('.vl').value)}))
    .filter(x=>x.n).map(x=>{const o={n:x.n,v:x.v};if(x.st)o.st=true;if(x.i)o.i=true;if(x.sa)o.sa=true;if(x.k)o.k=true;if(x.may>0)o.may=x.may;if(x.lpu>0)o.lpu=x.lpu;return o})}
function pvVarsPintar(){const b=$('#pvVars');if(!b)return;const a=window._pvVars||[];
  b.innerHTML=a.length?`<div class="muted" style="font-size:12px;display:flex;gap:6px;margin-bottom:2px"><span style="flex:3">Nombre</span><span style="width:52px">🌱</span><span style="width:52px">🌰</span><span style="width:24px">🌾</span><span style="width:24px">🍃</span><span style="width:24px">🥑</span><span style="flex:1">$ mayor.*</span><span style="flex:1">$ local*</span><span style="width:30px"></span></div>`+a.map((x,i)=>`<div class="pvvar" data-f="${esc(x.f||'')}" style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
    <input class="vn" style="flex:3" value="${esc(x.n)}" placeholder="Ej: Medialuna"><label style="width:52px;display:flex;gap:3px;align-items:center;margin:0"><input type="checkbox" class="vv" ${x.v?'checked':''} style="width:auto">veg</label><label style="width:52px;display:flex;gap:3px;align-items:center;margin:0"><input type="checkbox" class="vs" ${x.st?'checked':''} style="width:auto">s/t</label><input type="checkbox" class="vi" title="Integral" ${x.i?'checked':''} style="width:24px"><input type="checkbox" class="vsa" title="Sin azúcar" ${x.sa?'checked':''} style="width:24px"><input type="checkbox" class="vk" title="Keto" ${x.k?'checked':''} style="width:24px">
    <input class="vm" style="flex:1" inputmode="decimal" value="${x.may!=null?x.may:''}" placeholder="igual"><input class="vl" style="flex:1" inputmode="decimal" value="${x.lpu!=null?x.lpu:''}" placeholder="igual">
    <button class="btn peq sec" type="button" style="width:30px;padding:4px" onclick="window._pvVars=pvVarsLeerTodas();window._pvVars.splice(${i},1);pvVarsPintar()">✕</button></div>`).join('')+'<p class="muted" style="font-size:12px;margin:2px 0 6px">* Precio propio solo si esa variedad cuesta distinto (ej: cremona chica). Vacío = el precio del producto.</p>':'<p class="muted" style="font-size:13px">Sin variedades: se pide el producto solo.</p>'}
function pvVarsLeerTodas(){return [...document.querySelectorAll('#pvVars .pvvar')].map(r=>({n:r.querySelector('.vn').value,v:r.querySelector('.vv').checked,st:r.querySelector('.vs').checked,i:r.querySelector('.vi').checked,sa:r.querySelector('.vsa').checked,k:r.querySelector('.vk').checked,may:r.querySelector('.vm').value===''?null:r.querySelector('.vm').value,lpu:r.querySelector('.vl').value===''?null:r.querySelector('.vl').value,...(r.dataset.f?{f:r.dataset.f}:{})}))}
function pvVarAdd(){window._pvVars=pvVarsLeerTodas();window._pvVars.push({n:'',v:false});pvVarsPintar();const r=[...document.querySelectorAll('#pvVars .vn')].pop();if(r)r.focus()}
async function pvFlag(cod,campo,txt){const p=pvPorCod(cod);if(!p)return;try{const [x]=await sbUpd('productos_venta','codigo=eq.'+encodeURIComponent(cod),{[campo]:!p[campo],updated_at:new Date().toISOString()});Object.assign(p,x);toast(x[campo]?'Marcado: '+txt:'Ya no figura '+txt.toLowerCase(),1500);vVenta()}catch(e){toast('⚠️ '+(e.message||'No se pudo guardar'),5000)}}
async function pvSinTrigo(cod){const p=pvPorCod(cod);if(!p)return;try{const [x]=await sbUpd('productos_venta','codigo=eq.'+encodeURIComponent(cod),{sin_trigo:!p.sin_trigo,updated_at:new Date().toISOString()});Object.assign(p,x);toast(x.sin_trigo?'🌰 Marcado sin trigo':'Ya no figura sin trigo',1500);vVenta()}catch(e){toast('⚠️ '+(e.message||'No se pudo guardar'),5000)}}
async function pvVegano(cod){const p=pvPorCod(cod);if(!p)return;try{const [x]=await sbUpd('productos_venta','codigo=eq.'+encodeURIComponent(cod),{vegano:!p.vegano,updated_at:new Date().toISOString()});Object.assign(p,x);toast(x.vegano?'🌱 Marcado vegano':'Ya no figura como vegano',1500);vVenta()}catch(e){toast('⚠️ '+(e.message||'No se pudo guardar'),5000)}}
async function pvQuitarVinc(alias){IS.cargado=false;await sbDel('productos_venta_alias','alias=eq.'+encodeURIComponent(alias));PV.alias=PV.alias.filter(a=>a.alias!==alias);toast('Vínculo quitado');vVenta()}
async function pvVincularNuevo(){const n=normV($('#pvNn').value);const p=pvLeer($('#pvNp').value);if(!n)return toast('Escribí el nombre');if(!p)return toast('Elegí el producto de venta de la lista');
  const [x]=await sbIns('productos_venta_alias?on_conflict=alias',[{alias:n,codigo:p.codigo,receta_id:pvRecIdDe(n)}],true);PV.alias=PV.alias.filter(a=>a.alias!==n).concat([x]);
  if(!PV.llegadas.find(l=>l.k===n))PV.llegadas.push({k:n,nombre:$('#pvNn').value.trim(),sectores:new Set(),veces:0});toast('Vinculado ✅');vVenta()}
const IVA_OPC=[['','— sin cargar —'],['10.5','10,5 %'],['21','21 %'],['27','27 %'],['0','Exento']];
function ivaTxt(v){return v==null||v===''?'—':(+v===0?'Exento':String(v).replace('.',',')+' %')}
// recetas que se venden como este producto: por vínculo (alias) o porque se llaman igual
function pvRecetasDe(cod){const p=pvPorCod(cod);const k=p?normV(p.nombre):'';
  return D.recetas.filter(r=>{const ai=PV.alias.find(a=>a.receta_id===r.id);if(ai)return ai.codigo===cod;const n=normV(r.nombre);const a=pvAliasDe(n);return a?a.codigo===cod:(k&&n===k)}).sort((x,y)=>x.nombre.localeCompare(y.nombre))}
function pvRecOpc(){return `<datalist id="dlRecPV">${D.recetas.map(r=>`<option value="${esc(r.nombre)}">${esc(r.sector||'')}</option>`).join('')}</datalist>`}
async function pvVincReceta(cod){const v=($('#pvRec').value||'').trim();if(!v)return toast('Elegí una receta de la lista');
  const r=D.recetas.find(x=>norm(x.nombre)===norm(v));if(!r)return toast('No encontré esa receta. Elegila de la lista.');
  const k=normV(r.nombre);const ya=pvAliasDe(k);
  if(ya&&ya.codigo===cod)return toast('Esa receta ya está vinculada a este producto');
  if(ya){const otro=pvPorCod(ya.codigo);if(!confirm('"'+r.nombre+'" hoy se vende como "'+(otro?otro.nombre:ya.codigo)+'". ¿La paso a este producto?'))return}
  IS.cargado=false;const [x]=await sbIns('productos_venta_alias?on_conflict=alias',[{alias:k,codigo:cod,receta_id:r.id}],true);
  PV.alias=PV.alias.filter(a=>a.alias!==k).concat([x]);toast('Receta vinculada ✅');pvEditar(cod)}
function pvEditar(cod){const p=cod?pvPorCod(cod):{codigo:'',nombre:'',tipo:'Artículo',precio_may:null,precio_lpu:null,precio_pey:null,iva:null,por_kg:false,activo:true};
  const recs=cod?pvRecetasDe(cod):[];const recK=new Set(recs.map(r=>normV(r.nombre)));
  const otros=cod?PV.alias.filter(a=>a.codigo===cod&&!recK.has(a.alias)):[];
  const nv=v=>v==null?'':v;const ivaAct=p.iva==null?'':String(+p.iva);
  window._pvVars=JSON.parse(JSON.stringify(p.variantes||[]));
  window._pvFoto={url:p.foto_url||null,cambio:false};
  modal(`<h3>${cod?'Editar producto de venta':'Nuevo producto de venta'}</h3>
  <div class="fila"><div><label>Código (el de la caja)</label><input id="pvC" value="${esc(p.codigo)}" ${cod?'disabled':''}></div><div><label>Tipo</label><select id="pvT">${['Artículo','Combo'].map(x=>`<option ${x===p.tipo?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <label>Nombre (como se cobra en la caja)</label><input id="pvN" value="${esc(p.nombre)}">
  <h4 style="margin-top:14px">📷 Foto <span class="muted" style="font-weight:400;font-size:12px">(se ajusta sola al formato de PedidosYa: JPG 4:3, mínimo 1440×1080, menos de 1 MB)</span></h4>
  <div id="pvFotoBox"></div>
  <div class="fila"><div><label>Precio mayorista</label><input id="pvM" type="number" step="any" value="${nv(p.precio_may)}"></div><div><label>Precio local (LPU)</label><input id="pvL" type="number" step="any" value="${nv(p.precio_lpu)}"></div><div><label>Precio PedidosYa</label><input id="pvP" type="number" step="any" value="${nv(p.precio_pey)}"></div></div>
  <div class="fila"><div><label>IVA</label><select id="pvI">${IVA_OPC.map(([v,t])=>`<option value="${v}" ${v===ivaAct?'selected':''}>${t}</option>`).join('')}</select></div><div></div></div>
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="pvK" ${p.por_kg?'checked':''} style="width:auto"> Se vende por kilo (los precios son por kg)</label>
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="pvV" ${p.vegano?'checked':''} style="width:auto"> 🌱 Vegano (todo el producto; si solo algunas variedades lo son, marcalas abajo)</label>
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="pvS" ${p.sin_trigo?'checked':''} style="width:auto"> 🌰 Sin trigo, a base de harina de almendras (todo el producto; si son solo algunas variedades, marcalas abajo)</label>
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">
    <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pvIn" ${p.integral?'checked':''} style="width:auto"> 🌾 Integral</label>
    <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pvSA" ${p.sin_azucar?'checked':''} style="width:auto"> 🍃 Sin azúcar</label>
    <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="pvKt" ${p.keto?'checked':''} style="width:auto"> 🥑 Keto</label>
  </div>
  <h4 style="margin-top:14px">Variedades <span class="muted" style="font-weight:400;font-size:12px">(en la página de pedidos se despliegan con una flecha y el cliente elige cuánto de cada una)</span></h4>
  <div id="pvVars"></div>
  <button class="btn peq sec" type="button" onclick="pvVarAdd()">+ Agregar variedad</button>
  <label style="margin-top:10px">Presentación que puede elegir el cliente <span class="muted" style="font-weight:400">(separadas por coma; vacío = no se elige)</span></label>
  <input id="pvO" value="${esc((p.opciones||[]).join(', '))}" placeholder="Ej: Horneado, Congelado, Crudo">
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="pvA" ${p.activo?'checked':''} style="width:auto"> Activo (se vende y aparece en el Control del Salón)</label>
  ${cod?`<h4 style="margin-top:16px">🧾 Recetas que se venden como este producto</h4>
    ${recs.length?recs.map(r=>{const a=pvAliasDe(normV(r.nombre));return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #eee"><span>${esc(r.nombre)} <span class="muted" style="font-size:12px">${esc(r.sector||'')}${r.tipo==='BASE'?' · base':''}</span></span>${a?`<button class="btn peq sec" onclick="pvQuitarVinc('${esc(a.alias)}').then(()=>pvEditar('${esc(cod)}'))">Quitar</button>`:'<span class="muted" style="font-size:11px">mismo nombre</span>'}</div>`}).join(''):'<p class="muted">Ninguna todavía.</p>'}
    ${pvRecOpc()}<div class="fila" style="margin-top:8px;align-items:flex-end"><div><label>Vincular una receta</label><input id="pvRec" list="dlRecPV" placeholder="Escribí y elegí la receta…" autocomplete="off"></div><div style="flex:0 0 auto"><button class="btn sec" onclick="pvVincReceta('${esc(cod)}')">➕ Vincular</button></div></div>
    ${otros.length?`<h4 style="margin-top:14px">Otros nombres vinculados <span class="muted" style="font-weight:400;font-size:12px">(como lo mandan los sectores o el churrero)</span></h4>${otros.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #eee"><span>${esc(a.alias)}</span><button class="btn peq sec" onclick="pvQuitarVinc('${esc(a.alias)}').then(()=>pvEditar('${esc(cod)}'))">Quitar</button></div>`).join('')}`:''}`
  :'<p class="muted" style="margin-top:12px">Guardá el producto y después vas a poder vincularle las recetas.</p>'}
  <div class="acciones" style="margin-top:14px"><button class="btn" id="bPV">💾 Guardar</button><button class="btn sec" onclick="cerrarModal()">${cod?'Cerrar':'Cancelar'}</button></div>`);
  pvVarsPintar();pvFotoPintar();
  $('#bPV').onclick=async()=>{const num=id=>$(id).value===''?null:+$(id).value;
    const row={codigo:cod||$('#pvC').value.trim(),nombre:$('#pvN').value.trim(),tipo:$('#pvT').value,precio_may:num('#pvM'),precio_lpu:num('#pvL'),precio_pey:num('#pvP'),iva:num('#pvI'),por_kg:$('#pvK').checked,vegano:$('#pvV').checked,sin_trigo:$('#pvS').checked,integral:$('#pvIn').checked,sin_azucar:$('#pvSA').checked,keto:$('#pvKt').checked,variantes:pvVarsLeer(),foto_url:(window._pvFoto||{}).url||null,opciones:$('#pvO').value.split(',').map(x=>x.trim()).filter(Boolean),activo:$('#pvA').checked,updated_at:new Date().toISOString()};
    if(!row.codigo||!row.nombre)return toast('Completá código y nombre');
    if(!cod&&pvPorCod(row.codigo))return toast('Ya existe un producto con el código '+row.codigo);
    try{const [x]=cod?await sbUpd('productos_venta','codigo=eq.'+encodeURIComponent(cod),row):await sbIns('productos_venta',[row]);
      PV.prods=PV.prods.filter(q=>q.codigo!==x.codigo).concat([x]).sort((a,b)=>a.nombre.localeCompare(b.nombre));toast('Guardado ✅');
      if(!cod){pvEditar(x.codigo);return}cerrarModal();vVenta()}catch(e){toast('⚠️ '+(e.message||'No se pudo guardar'),5000)}};
}

// ================= PAPELERA Y LIMPIEZA =================
// Reglas de consumo: por venta (desde el Excel de artículos de Ayres, ticket por ticket), por pedidos mayoristas y fijas por día/mes (se descuentan solas cada noche).
let PAP={cargado:false,reglas:[],uso:{},alertas:[]};
const PAP_GRUPOS=[['venta','🛍️ Por venta en el local','Se descuenta al guardar la venta del turno con el Excel "Control de artículos" de Ayres (Finanzas → Cargar venta).'],['mayorista','🚚 Por pedidos mayoristas','Se descuenta cuando un pedido mayorista se marca como entregado.'],['tiempo','📅 Consumo fijo','Se descuenta solo, todas las noches (lo mensual se reparte por día).']];
const PAP_MODO={por_ticket:'cada venta que lo lleva',por_unidad:'por unidad vendida',kg_hasta:'por bolsa de hasta {kg} kg',kg_mas:'por bolsa de más de {kg} kg',camiseta:'según cantidad de productos del ticket',cada_kg:'cada {cada} kg',por_dia:'por día',por_mes:'por mes'};
async function cargarPAP(){
  const desde=sumaDias(hoy(),-30);
  const [r,c,a,ins]=await Promise.all([sbGet('papelera_reglas','order=orden,id'),sbGet('papelera_consumos','fecha=gte.'+desde),sbGet('alertas_sistema','sector=eq.papelera&leida=eq.false&order=tipo'),sbGet('insumos','order=nombre')]);
  if(ins){D.insumos=ins;indexar()}
  const uso={};(c||[]).forEach(x=>{uso[x.regla_id]=(uso[x.regla_id]||0)+(+x.usos||0)});
  PAP={cargado:true,reglas:r||[],uso,alertas:a||[]};
  if(!PV.cargado){try{await cargarPV()}catch(e){}}
}
function papProd(cods){if(!cods||!cods.length)return '<span class="muted">todos</span>';return cods.map(c=>{const p=pvPorCod(c);return esc(p?p.nombre:c)}).join(', ')}
function papModo(r){return (PAP_MODO[r.modo]||r.modo).replace('{kg}',fnum(r.kg_limite,3)).replace('{cada}',fnum(r.cada_kg,2))+(r.modo==='por_dia'&&r.cantidad_lunes!=null?' (lunes '+fnum(r.cantidad_lunes,3)+')':'')}
async function vPapelera(){
  if(!PAP.cargado){$('#app').innerHTML='<div class="cargando">Cargando papelera y limpieza…</div>';try{await cargarPAP()}catch(e){$('#app').innerHTML='<div class="card">No se pudo cargar: '+esc(e.message)+'</div>';return}}
  const al=PAP.alertas;const otras=al.filter(a=>a.tipo!=='stock_bajo');
  // insumos de papelera y limpieza (los que usan las reglas) en o debajo del mínimo
  const papIns=[...new Set(PAP.reglas.filter(r=>r.activo&&r.insumo_id).map(r=>r.insumo_id))].map(id=>insMap[id]).filter(Boolean);
  const bajo=papIns.filter(i=>(+i.stock_minimo||0)>0&&(+i.stock||0)<=(+i.stock_minimo||0));
  const sinMin=papIns.filter(i=>!((+i.stock_minimo||0)>0));
  let html=`<h2>📦 Inventario</h2>${invTabs('papelera')}<p class="muted">Stock de papelera y limpieza y cuánto descuenta cada regla. La papelera se le pide a <b>Polipel</b>; la limpieza se compra en el día. Corregí el stock y el mínimo acá mismo.</p>
  <div class="grid g4" style="margin-bottom:12px"><div class="card kpi"><div class="lbl">Reglas activas</div><div class="val">${PAP.reglas.filter(r=>r.activo).length}</div></div>
  <div class="card kpi"><div class="lbl">Para pedir</div><div class="val" style="color:${bajo.length?'var(--rojo)':'var(--verde)'}">${bajo.length}</div></div>
  <div class="card kpi"><div class="lbl">Datos que faltan</div><div class="val" style="color:${otras.length?'#a07000':'var(--verde)'}">${otras.length}</div></div>
  <div class="card kpi"><div class="lbl">Sin mínimo cargado</div><div class="val" style="color:${sinMin.length?'#a07000':'var(--verde)'}">${sinMin.length}</div><div class="sub muted">sin mínimo no avisa cuándo pedir</div></div></div>`;
  if(!PAP.reglas.length)html+=`<div class="card" style="margin-bottom:12px;color:var(--rojo)">⚠️ No llegaron las reglas desde la base. Probá tocar <b>Salir</b> y volver a entrar: suele ser la sesión vencida.</div>`;
  const esLimp=i=>norm(i.categoria||'')==='limpieza';
  const filaBajo=i=>`<tr><td>${esc(i.nombre)}</td><td class="num" style="color:var(--rojo);font-weight:700">${fnum(i.stock,3)} ${esc(i.unidad||'')}</td><td class="num">${fnum(i.stock_minimo,3)}</td><td class="num">${+i.stock_optimo?fnum(i.stock_optimo,3):'—'}</td></tr>`;
  const cab='<tr><th>Insumo</th><th class="num">Stock</th><th class="num">Mínimo</th><th class="num">Óptimo</th></tr>';
  const bPap=bajo.filter(i=>!esLimp(i)),bLim=bajo.filter(esLimp);
  if(bPap.length)html+=`<div class="card" style="margin-bottom:12px"><h3>🛒 Papelera para pedir a Polipel</h3><table>${cab}${bPap.map(filaBajo).join('')}</table>
    <div class="acciones" style="margin-top:10px"><button class="btn" onclick="location.hash='#compras'">🛒 Armar pedido a Polipel en Compras</button></div></div>`;
  if(bLim.length)html+=`<div class="card" style="margin-bottom:12px"><h3>🧽 Limpieza para comprar en el día</h3><p class="muted">No tiene proveedor fijo: es la lista para la próxima compra. Cuando compres, cargá el stock en la tabla de abajo.</p><table>${cab}${bLim.map(filaBajo).join('')}</table></div>`;
  if(otras.length)html+=`<div class="card" style="margin-bottom:12px"><h3>🔔 Datos que faltan</h3>${otras.map(a=>`<div style="padding:5px 0;border-bottom:1px solid #eee;color:#a07000">⚠️ ${esc(a.mensaje)}</div>`).join('')}</div>`;
  html+=`<datalist id="dlInsPap">${D.insumos.filter(i=>i.activo!==false).map(i=>`<option value="${esc(i.nombre)}">`).join('')}</datalist>`;
  for(const [g,tit,sub] of PAP_GRUPOS){const rs=PAP.reglas.filter(r=>r.grupo===g);if(!rs.length)continue;
    html+=`<div class="card" style="margin-bottom:12px"><h3>${tit}</h3><p class="muted">${sub}</p><div class="scroll"><table><tr><th>Qué</th>${g!=='tiempo'?'<th>Productos</th>':''}<th>Insumo del stock</th><th class="num">Cantidad</th><th>Cuándo</th><th class="num" title="Cuántos usos equivalen a 1 unidad del stock (ej. 100 fajas = 1 kg). Vacío = no se descuenta.">Usos por unidad de stock</th><th class="num">Stock</th><th class="num">Mínimo</th><th class="num">Usado 30 días</th><th>Activa</th></tr>
    ${rs.map(r=>{const i=r.insumo_id?insMap[r.insumo_id]:null;const crit=i&&(+i.stock||0)<=(+i.stock_minimo||0);
      return `<tr style="${r.activo?'':'opacity:.5'}"><td>${esc(r.descripcion)}</td>${g!=='tiempo'?`<td style="font-size:12px">${papProd(r.productos)}</td>`:''}
      <td><input list="dlInsPap" value="${esc(i?i.nombre:r.insumo_nombre)}" style="min-width:230px;${i?'':'border-color:var(--rojo)'}" onchange="papInsumo(${r.id},this.value)">${i?'':'<div style="font-size:11px;color:var(--rojo)">no está en el stock</div>'}</td>
      <td class="num"><input class="mini" type="number" step="any" value="${+r.cantidad}" onchange="papCampo(${r.id},'cantidad',this.value)"></td>
      <td style="font-size:12px">${papModo(r)}</td>

// ================= FINANZAS =================
let perFin=0;
function costoVentaItem(i){const m=recetaDeVenta(i.producto);if(!m)return null;let u=+i.cantidad||0;if(i.unidad==='kg'&&m.peso>0)u=u/m.peso;return {costo:u*costoUnit(m.receta),seccion:m.receta.seccion||'OTROS'}}
function vFinanzas(){
  const [a,b]=mesRango(perFin);const nombreMes=new Date(a+'T12:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const cier=D.cierres.filter(c=>{const d=diaLocal(c.fecha);return d>=a&&d<=b});
  const fac=D.facturas.filter(f=>f.fecha&&f.fecha>=a&&f.fecha<=b);const gas=D.gastos.filter(g=>g.fecha>=a&&g.fecha<=b);
  const ing=cier.reduce((s,c)=>s+(+c.total||0),0),gF=fac.reduce((s,f)=>s+(+f.total||0),0),gM=gas.reduce((s,g)=>s+(+g.monto||0),0);
  const pc=porCanal(cier);const totCom=Object.entries(pc).reduce((s,[k,v])=>s+comisionDe(k,v),0);
  const IC=impCfg();const ivaD=ing*IC.iva/(100+IC.iva),ivaC=fac.reduce((s,f)=>s+(+f.impuestos||0),0),ivaN=Math.max(0,ivaD-ivaC),iibbM=(ing-ivaD)*IC.iibb/100;
  const egr=gF+gM+totCom+ivaN+iibbM,util=ing-egr;const ef=pc['Efectivo']||0,on=ing-ef;
  const dias=new Set(cier.map(c=>diaLocal(c.fecha))).size;
  // contribución por sección (según productos cargados)
  const sec={};let conItems=0,sinRec=0;cier.forEach(c=>(c.items||[]).forEach(i=>{conItems+=+i.total||0;const x=costoVentaItem(i);const k=x?x.seccion:'Sin receta';sec[k]=sec[k]||{v:0,c:0,n:0};sec[k].v+=+i.total||0;if(x)sec[k].c+=x.costo;else sinRec+=+i.total||0}));
  // semanas
  const l0=lunes(hoy()),sem=[];for(let k=7;k>=0;k--){const d0=sumaDias(l0,-7*k),d1=sumaDias(d0,6);const cs=D.cierres.filter(c=>{const d=diaLocal(c.fecha);return d>=d0&&d<=d1});const p=porCanal(cs);const t=cs.reduce((s,c)=>s+(+c.total||0),0);sem.push({d0,t,ef:p['Efectivo']||0})}

function difTurno(t){return (+t.diferencia||0)+(+t.diferencia_online||0)}

function txtDif(d){return Math.abs(d)<1?'<span style="color:var(--verde)">✅ cierra</span>':`<span style="color:var(--rojo);font-weight:700">${d<0?'falta':'sobra'} ${$$(Math.abs(d))}</span>`}

  A.forEach(a=>{const p=por[a.usuario]=por[a.usuario]||{n:0,falt:0,sobr:0,aj:0,malos:0};p.aj+=+a.monto||0});

    <td class="num">${txtDif(f.saldo)}</td><td><button class="btn sec peq" onclick="ajusteCajero('${esc(f.u)}')">Ajuste</button></td></tr>`).join('')}</table></div>

function ajusteCajero(u){modal(`<h3>Ajuste · ${esc(nomCajero(u))}</h3><p class="muted">Positivo si repuso un faltante (ej: 5000). Negativo si se le devolvió un sobrante (ej: -2000).</p>

        var win = null; if (wa(p.telefono)) try { win = window.open('', '_blank'); if (win) win.document.write('<p style="font:16px system-ui;padding:20px">Confirmando pedido y abriendo WhatsApp…</p>'); } catch (x) { win = null; }
        var s = +document.getElementById('pw-s' + id).value || 0, m = document.getElementById('pw-m' + id).value, e = p.envio ? (+document.getElementById('pw-e' + id).value || 0) : null;
        rpc('pedido_web_confirmar', { p_pedido: id, p_sena: s, p_medio: m, p_usuario: usr(), p_costo_envio: e }).then(function () {
          var tot = (+p.total || 0) + (e || 0), saldo = tot - s;
          var msg = p.lista_precios === 'mayorista' ? '¡Hola ' + String(p.cliente).split(' ')[0] + '! 🥐 Tu pedido #' + p.numero + ' para el ' + fecha(p.fecha_retiro) + (p.hora_retiro ? ' (' + p.hora_retiro + ')' : '') + ' quedó *confirmado* ✅ Total ' + plata(tot) + ', va a tu cuenta corriente. ¡Gracias!' : '¡Hola ' + String(p.cliente).split(' ')[0] + '! 🥐 Recibimos tu seña de ' + plata(s) + '. Tu pedido #' + p.numero + ' para el ' + fecha(p.fecha_retiro) + (p.hora_retiro ? ' (' + p.hora_retiro + ')' : '') + ' quedó *confirmado* ✅\n' +
            (e ? 'Envío: ' + plata(e) + '. ' : '') + 'Saldo a pagar ' + (p.envio ? 'al recibirlo' : 'al retirar') + ': ' + plata(saldo) + '.\n¡Gracias por elegir Poly Artesanal!';
          var lk = wa(p.telefono) ? 'https://wa.me/' + wa(p.telefono) + '?text=' + encodeURIComponent(msg) : null, abierto = false;
          if (lk && win && !win.closed) try { win.location.href = lk; abierto = true; } catch (x) {}
          if (lk && !abierto) try { abierto = !!window.open(lk, '_blank'); } catch (x) {}
          if (abierto) patch(id, { aviso_confirmado_at: new Date().toISOString() }).catch(function () {});
          c.innerHTML = '<b>✅ Pedido #' + p.numero + ' confirmado.</b> Ya está en los sectores y en el Salón.' +
            (lk ? '<div style="font-size:13px;margin-top:6px">' + (abierto ? '📲 Se abrió WhatsApp con el aviso de confirmación: tocá <b>Enviar</b>.' : '⚠️ No se pudo abrir WhatsApp solo: tocá el botón para avisarle.') + '</div><div class="pw-f"><a class="pw-b g" style="text-decoration:none" target="_blank" href="' + lk + '" onclick="this.textContent=\'✓ Aviso abierto\'">💬 ' + (abierto ? 'Volver a abrir el aviso' : 'Avisarle al cliente que está confirmado') + '</a></div>' : '<div style="font-size:13px;margin-top:6px">Sin WhatsApp válido: avisale por otro medio.</div>');
          lista = lista.filter(function (x) { return x.id !== id; }); vistos = lista.map(function (x) { return x.id; });
          pillTxt();
          try { if (typeof window.switchTab === 'function' && document.getElementById('pcs-seccion')) window.switchTab('clientes'); } catch (x) {}
        }).catch(function (err) { bt.disabled = false; try { if (win) win.close(); } catch (x) {} alert('⚠️ ' + err.message); });
      };
    },
    rechazar: function (id) {
      var p = ped(id); if (!confirm('¿Rechazar el pedido #' + p.numero + ' de ' + p.cliente + '? (por ejemplo, si no llegó la seña)')) return;
      rpc('pedido_web_rechazar', { p_pedido: id, p_usuario: usr() }).then(function () {
        var c = document.getElementById('pw-' + id), msg = '¡Hola ' + String(p.cliente).split(' ')[0] + '! Te escribimos de Poly Artesanal: no pudimos confirmar tu pedido #' + p.numero + ' porque no recibimos la seña. Si querés, hacelo de nuevo desde la web o escribinos. ¡Gracias!';
        c.innerHTML = '<b>Pedido #' + p.numero + ' rechazado.</b>' + (wa(p.telefono) ? '<div class="pw-f"><a class="pw-b g" style="text-decoration:none" target="_blank" href="https://wa.me/' + wa(p.telefono) + '?text=' + encodeURIComponent(msg) + '">💬 Avisarle por WhatsApp</a></div>' : '');
        lista = lista.filter(function (x) { return x.id !== id; }); vistos = lista.map(function (x) { return x.id; });
        var pill = document.getElementById('pw-pill'); if (pill) pill.style.display = lista.length ? 'block' : 'none';
      }).catch(function (err) { alert('⚠️ ' + err.message); });
    }
  };
  function iniciar() { montar(); get('config?clave=eq.pedidos_web&select=valor').then(function (r) { var v = r && r[0] && r[0].valor; if (typeof v === 'string') try { v = JSON.parse(v); } catch (x) {} CFG = v || {}; }).catch(function () {}); cargar(); setInterval(cargar, 60e3); document.addEventListener('visibilitychange', function () { if (!document.hidden) cargar(); }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();
</script>

<script>
/* Etiquetas para cajas/bolsas de un pedido (se agregan al remito como hoja aparte) */
window.polyEtiquetas = function (p, its) {
  var E = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var L = [];
  (its || []).forEach(function (i) { (i.bultos_det || []).forEach(function (b) { L.push({ prod: i.producto, kg: b.kg, tipo: b.tipo, aparte: b.aparte }); }); });
  if (!L.length) return '';
  var f = (p.fecha_retiro || '').split('-').reverse().join('/'), tot = L.length;
  var kgTxt = function (k) { return String(Math.round(k * 100) / 100).replace('.', ','); };
  return '<style>.etq-pag{page-break-before:always;break-before:page;display:grid;grid-template-columns:1fr 1fr;gap:0}.etq{border:1px dashed #888;height:66mm;padding:5mm 6mm;box-sizing:border-box;break-inside:avoid;display:flex;flex-direction:column;justify-content:space-between;font-family:Arial,sans-serif}.etq .m{font:700 15px Arial}.etq .c{font:700 19px Arial;margin:2mm 0}.etq .pr{font:600 15px Arial}.etq .kg{font:800 34px Arial}.etq .ap{background:#000;color:#fff;padding:1mm 3mm;border-radius:2mm;font:700 13px Arial;display:inline-block}.etq .pie{display:flex;justify-content:space-between;font-size:12px}</style>' +
    '<div class="etq-pag">' + L.map(function (b, k) {
      return '<div class="etq"><div><div class="m">Poly Artesanal · Panadería de Autor</div><div class="c">' + E(p.cliente) + '</div><div class="pr">' + E(b.prod) + '</div></div>' +
        '<div><span class="kg">' + kgTxt(b.kg) + ' kg</span> ' + (b.aparte ? '<span class="ap">' + (b.tipo === 'bolsa' ? 'BOLSA APARTE' : 'CAJA APARTE') + '</span>' : '') + '</div>' +
        '<div class="pie"><b>' + (b.tipo === 'bolsa' ? 'Bolsa' : 'Caja') + ' ' + (k + 1) + ' de ' + tot + '</b><span>Pedido N° ' + E(p.numero) + ' · ' + f + '</span></div></div>';
    }).join('') + '</div>';
};
</script>
