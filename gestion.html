<script>
/* Seguridad: cada pedido a la base va firmado con la sesión de quien está usando el sistema */
(function () {

  function token() { try { return localStorage.getItem('poly_sesion'); } catch (e) { return null; } }

    if (!t || url.indexOf(BASE) < 0 || window.__polySinFirma) return f0.call(this, u, o);
    var o2 = Object.assign({}, o || {}), h = new Headers((o && o.headers) || (typeof u !== 'string' && u && u.headers) || {});
    h.set('x-poly-token', t); o2.headers = h;
    var self = this;
    return f0.call(self, u, o2).catch(function (e) {
      // si el navegador rechaza el encabezado, se sigue trabajando como antes
      if (e && e.name === 'TypeError') { window.__polySinFirma = true; return f0.call(self, u, o); }

  function ping() {

<script>
/* Poly Artesanal — control de acceso
   Cada módulo incluye este archivo. Verifica la sesión y deja entrar solo:
   - al administrador (rol admin) a todo
   - a cada usuario de sector, únicamente a su módulo
*/
(function () {
  var SB_URL = 'https://sinoeoaktirnscdpbvdc.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg';
  var ARCHIVO = { cocina: 'asistente_cocina.html', panaderia: 'asistente_panaderia.html', pasteleria: 'asistente_pasteleria.html',
                  madrugada: 'asistente_madrugada.html', salon: 'asistente_salon.html', deposito: 'asistente_deposito.html' };
  var pagina = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  var requerido = null; // módulo que exige esta página; 'admin' = solo Poly
  Object.keys(ARCHIVO).forEach(function (m) { if (ARCHIVO[m] === pagina) requerido = m; });
  if (pagina === 'gestion.html' || pagina === 'central.html') requerido = 'admin';

  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function borrar() { try { localStorage.removeItem('poly_sesion'); localStorage.removeItem('poly_usuario'); } catch (e) {} }
  function irA(p) { location.replace(p); }
  function mostrar() { document.documentElement.style.visibility = ''; }

  window.polyRPC = function (fn, body) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message || 'Error'); return j; }); });
  };
  window.polyToken = function () { return leer('poly_sesion'); };
  window.polySalir = function () {
    var t = leer('poly_sesion'); borrar();
    var fin = function () { location.href = 'index.html'; };
    if (t) window.polyRPC('cerrar_sesion', { p_token: t }).then(fin, fin); else fin();
  };

  function permitido(u) { return u.rol === 'admin' || (requerido && requerido !== 'admin' && u.modulo === requerido); }
  function destino(u) { return u.rol === 'admin' ? 'index.html' : (ARCHIVO[u.modulo] || 'index.html'); }

  function barra(u) {
    var b = document.createElement('div');
    b.id = 'poly-sesion';
    b.style.cssText = 'position:fixed;top:4px;left:4px;z-index:99999;font:11px system-ui,sans-serif;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:3px 4px 3px 9px;display:flex;gap:6px;align-items:center;';
    b.innerHTML = '<span>👤 ' + (u.nombre || u.usuario) + '</span>' +
      (u.rol === 'admin' ? '<a href="index.html" style="color:#fff;text-decoration:none;background:rgba(255,255,255,.18);border-radius:10px;padding:2px 7px;">Menú</a>' : '') +
      '<button type="button" style="border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:2px 7px;font:inherit;cursor:pointer;">Salir</button>';
    b.querySelector('button').onclick = window.polySalir;
    document.body.appendChild(b);
  }

  if (pagina === 'index.html' || pagina === '') return; // el index maneja su propio login
  document.documentElement.style.visibility = 'hidden';
  var token = leer('poly_sesion');
  if (!token) { irA('index.html'); return; }

  var guardado = null; try { guardado = JSON.parse(leer('poly_usuario') || 'null'); } catch (e) {}
  window.polyRPC('verificar_sesion', { p_token: token }).then(function (u) {
    if (!u || !u.ok) { if (u && u.motivo === 'fuera_local') { irA('index.html#fuera'); return; } borrar(); irA('index.html'); return; }
    try { localStorage.setItem('poly_usuario', JSON.stringify(u)); } catch (e) {}
    if (!permitido(u)) { irA(destino(u)); return; }
    window.POLY_USUARIO = u;
    var listo = function () { barra(u); mostrar(); };
    if (document.body) listo(); else document.addEventListener('DOMContentLoaded', listo);
  }, function () {
    // sin internet: si ya había entrado en este dispositivo, lo dejamos trabajar
    if (guardado && permitido(guardado)) {
      window.POLY_USUARIO = guardado;
      var listo = function () { barra(guardado); mostrar(); };
      if (document.body) listo(); else document.addEventListener('DOMContentLoaded', listo);
    } else { irA('index.html'); }
  });
})();

</script>

<script>
/* Poly Artesanal · tema "Noche Poly": modo oscuro, orbe del asistente y pronóstico para el leudado.
   No guarda nada en la base. Clima: Open-Meteo (gratis, sin clave). */
(function () {
  var KT = 'poly_tema', KC = 'poly_clima', KA = 'poly_aviso_leudado';
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  if (ls.get(KT) !== 'clasico') document.documentElement.classList.add('noche');

  // Villa Urquiza, CABA
  var LAT = -34.573, LON = -58.488;
  // Regla de leudado: con 24° o más se avisa a las 7:00; con 10° o menos, a las 14:00; en el medio, proporcional.
  var REGLA = { calor: 24, horaCalor: 7, frio: 10, horaFrio: 14 };
  var pagina = (location.pathname.split('/').pop() || 'index.html').replace('.html', '');
  var CON_AVISO = { asistente_cocina: 1 };

  function horaLeudado(t) {
    if (t >= REGLA.calor) return REGLA.horaCalor;
    if (t <= REGLA.frio) return REGLA.horaFrio;
    var h = REGLA.horaFrio - (t - REGLA.frio) * (REGLA.horaFrio - REGLA.horaCalor) / (REGLA.calor - REGLA.frio);
    return Math.round(h * 2) / 2;
  }
  function hhmm(h) { var m = Math.round((h % 1) * 60); return Math.floor(h) + ':' + (m < 10 ? '0' : '') + m; }
  function icono(c, noche) {
    if (c == null) return '';
    if (c === 0) return noche ? '🌙' : '☀️';
    if (c <= 2) return noche ? '☁️' : '🌤️';
    if (c === 3) return '☁️';
    if (c <= 48) return '🌫️';
    if (c <= 67 || (c >= 80 && c <= 82)) return '🌧️';
    if (c <= 77 || c === 85 || c === 86) return '❄️';
    return '⛈️';
  }
  function hoyBA() { return new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); }
  function ahoraHorasBA() { var d = new Date(Date.now() - 3 * 3600e3); return d.getUTCHours() + d.getUTCMinutes() / 60; }

  function leerClima() {
    try { var c = JSON.parse(ls.get(KC) || 'null'); if (c && Date.now() - c.ts < 3600e3 && c.dia === hoyBA()) return Promise.resolve(c); } catch (e) {}
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code' +
      '&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=2';
    return fetch(u).then(function (r) { if (!r.ok) throw new Error('clima ' + r.status); return r.json(); }).then(function (j) {
      var hs = j.hourly.time, ts = j.hourly.temperature_2m, cs = j.hourly.weather_code, dia = j.daily.time[0], man = j.daily.time[1];
      var noche = [], nc = null;
      for (var i = 0; i < hs.length; i++) {
        var f = hs[i].slice(0, 10), h = +hs[i].slice(11, 13);
        if ((f === dia && h >= 20) || (f === man && h <= 6)) { noche.push(ts[i]); if (f === dia && h === 23) nc = cs[i]; }
      }
      var c = { ts: Date.now(), dia: dia, ahora: j.current ? j.current.temperature_2m : null, codAhora: j.current ? j.current.weather_code : null,
        max: j.daily.temperature_2m_max[0], min: j.daily.temperature_2m_min[0], cod: j.daily.weather_code[0],
        noche: noche.length ? Math.min.apply(null, noche) : j.daily.temperature_2m_min[1], codNoche: nc };
      ls.set(KC, JSON.stringify(c));
      return c;
    });
  }

  var clima = null, orbe, panel;
  function r0(x) { return x == null ? '–' : Math.round(x) + '°'; }

  function pintarPanel() {
    var oscuro = document.documentElement.classList.contains('noche');
    var h = '<div class="pp-tit"><span>Poly · hoy</span><button aria-label="Cerrar" onclick="PolyTema.cerrar()">✕</button></div>';
    if (!clima) h += '<div class="pp-err">' + (PolyTema.error ? 'No pude traer el pronóstico (¿sin internet?).' : 'Buscando el pronóstico…') + '</div>';
    else {
      var hl = horaLeudado(clima.max);
      h += '<div class="pp-clima">' +
        '<div class="pp-c"><div class="l">Día</div><div class="t">' + icono(clima.cod) + ' ' + r0(clima.max) + '</div><div class="s">ahora ' + r0(clima.ahora) + ' · mín ' + r0(clima.min) + '</div></div>' +
        '<div class="pp-c"><div class="l">Noche</div><div class="t">' + icono(clima.codNoche == null ? clima.cod : clima.codNoche, true) + ' ' + r0(clima.noche) + '</div><div class="s">de 20 a 6 h</div></div></div>' +
        '<div class="pp-leu">🥖 Sacar a leudar a las <b>' + hhmm(hl) + '</b><div class="s">' +
        (clima.max >= REGLA.calor ? 'Día caluroso: la masa leuda rápido.' : clima.max <= REGLA.frio ? 'Día frío: la masa tarda más.' : 'Con ' + r0(clima.max) + ' de máxima (24° → 7:00 · 10° → 14:00).') + '</div></div>';
    }
    h += '<button class="pp-tema" onclick="PolyTema.cambiarTema()">' + (oscuro ? '☀️ Volver al estilo clásico' : '🌙 Usar el estilo Noche Poly') + '</button>';
    panel.innerHTML = h;
  }

  function revisarAviso() {
    if (!clima || !CON_AVISO[pagina]) return;
    var hl = horaLeudado(clima.max), ya = ahoraHorasBA(), hoy = hoyBA();
    var activo = ya >= hl - 0.5 && ya < hl + 3 && ls.get(KA) !== hoy;
    orbe.classList.toggle('alerta', activo);
    var av = document.getElementById('poly-aviso');
    if (activo && !av) {
      av = document.createElement('div'); av.id = 'poly-aviso';
      av.innerHTML = '<span class="ic">⏰</span><div>' + (ya >= hl ? 'Es hora de <b>sacar la mercadería a leudar</b>' : 'A las <b>' + hhmm(hl) + '</b> hay que sacar la mercadería a leudar') +
        '<br><small>Hoy ' + r0(clima.max) + ' de máxima</small></div><button onclick="PolyTema.listoAviso()">Listo</button>';
      document.body.appendChild(av);
    } else if (!activo && av) av.remove();
  }

  window.PolyTema = {
    horaLeudado: horaLeudado, regla: REGLA, error: null,
    abrir: function () { panel.classList.add('abierto'); pintarPanel(); },
    cerrar: function () { panel.classList.remove('abierto'); },
    alternar: function () { panel.classList.contains('abierto') ? PolyTema.cerrar() : PolyTema.abrir(); },
    cambiarTema: function () {
      var on = document.documentElement.classList.toggle('noche');
      ls.set(KT, on ? 'noche' : 'clasico'); pintarPanel();
    },
    listoAviso: function () { ls.set(KA, hoyBA()); revisarAviso(); }
  };

  function iniciar() {
    if (document.getElementById('poly-orbe')) return;
    panel = document.createElement('div'); panel.id = 'poly-panel'; document.body.appendChild(panel);
    var lg = document.querySelector('#header .logo');
    var hd = document.querySelector('#header') || document.querySelector('body>header');
    if (lg && !lg.querySelector('img') && lg.textContent.trim().length <= 4) {
      // asistentes: el logo del encabezado se vuelve el orbe
      lg.innerHTML = '<span>' + lg.textContent.trim() + '</span><b id="poly-orbe-t" style="display:none"></b>';
      lg.classList.add('poly-logo-orbe'); lg.title = 'Pronóstico y leudado'; lg.onclick = PolyTema.alternar;
      orbe = lg; panel.classList.add('arriba'); panel.style.left = '14px'; panel.style.right = 'auto';
    } else {
      orbe = document.createElement('button'); orbe.id = 'poly-orbe'; orbe.type = 'button'; orbe.title = 'Pronóstico y leudado';
      orbe.innerHTML = '<span class="o-halo"></span><span class="o-giro"></span><span class="o-nucleo" id="poly-orbe-t">✦</span>';
      orbe.onclick = PolyTema.alternar;
      if (hd) {
        orbe.classList.add('en-header'); panel.classList.add('arriba');
        var ult = hd.querySelector(':scope>button:last-of-type');
        if (ult) hd.insertBefore(orbe, ult); else hd.appendChild(orbe);
      } else document.body.appendChild(orbe);
    }
    document.addEventListener('click', function (e) { if (panel.classList.contains('abierto') && !panel.contains(e.target) && !orbe.contains(e.target)) PolyTema.cerrar(); });
    function cargar() {
      leerClima().then(function (c) { clima = c; PolyTema.error = null; document.getElementById('poly-orbe-t').textContent = r0(c.ahora != null ? c.ahora : c.max);
        if (panel.classList.contains('abierto')) pintarPanel(); revisarAviso(); })
        .catch(function (e) { PolyTema.error = e; if (panel.classList.contains('abierto')) pintarPanel(); });
    }
    cargar(); setInterval(cargar, 20 * 60e3); setInterval(revisarAviso, 60e3);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();

</script>

<script>

const $$=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Math.round(+n||0));
const fnum=(n,d=2)=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:d}).format(+n||0);

const sumaDias=(ymd,n)=>{const d=new Date(ymd+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fechaCorta=ymd=>ymd?new Date(ymd.slice(0,10)+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}):'—';
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function modal(html){$('#modalc').innerHTML=html;$('#modal').style.display='flex';$('#modal').scrollTop=0}
function cerrarModal(){$('#modal').style.display='none';$('#modalc').innerHTML=''}
function confirmar(texto,accion){modal(`<h3>${esc(texto)}</h3><div class="acciones" style="margin-top:16px"><button class="btn rojo" id="okConf">Sí, confirmar</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`);$('#okConf').onclick=async()=>{cerrarModal();await accion()}}

async function sb(path,{method='GET',body,prefer}={}){
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(prefer)h.Prefer=prefer;
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.text();console.error('Supabase',path,r.status,t);
    if(r.status===401||/42501|row-level security/.test(t)){sesionVencida();throw new Error('Tu sesión se cerró: volvé a entrar')}
    toast('⚠️ Error guardando: '+t.slice(0,120),6000);throw new Error(t)}
  const t=await r.text();return t?JSON.parse(t):null;
}
// La sesión de este navegador ya no es válida (se cerró en otro lado, se cambió la clave o venció): avisar claro en vez de un error técnico
function sesionVencida(){if(window._avisoSesion)return;window._avisoSesion=1;
  const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px';

  d.querySelector('button').onclick=()=>{try{localStorage.removeItem('poly_sesion');localStorage.removeItem('poly_usuario')}catch(e){}location.href='index.html'};document.body.appendChild(d)}
const sbGet=(t,q='')=>sb(t+'?select=*'+(q?'&'+q:''));
const sbIns=(t,rows,upsert)=>sb(t,{method:'POST',body:rows,prefer:'return=representation'+(upsert?',resolution=merge-duplicates':'')});

// ================= ESTADO =================
const D={insumos:[],recetas:[],proveedores:[],facturas:[],cierres:[],gastos:[],gastosFijos:[],pedidos:[],empleados:[],fichajes:[],turnos:[],tareas:[],alias:[],equiv:[],produccion:[],mapeo:[],config:{}};
let insMap={},recMap={},recByName={},insByName={};
function indexar(){
  insMap={};insByName={};D.insumos.forEach(i=>{insMap[i.id]=i;insByName[norm(i.nombre)]=i});
  recMap={};recByName={};D.recetas.forEach(r=>{recMap[r.id]=r;recByName[norm(r.nombre)]=r});
}
async function cargarTodo(){
  const desde=sumaDias(hoy(),-400);
  const [ins,rec,prov,fac,cie,gas,gf,ped,emp,fic,tur,tar,ali,eq,pro,map,cfg]=await Promise.all([

    sbGet('fichajes','momento=gte.'+sumaDias(hoy(),-35)+'&order=momento'),sbGet('turnos_plan','fecha=gte.'+sumaDias(hoy(),-14)),
    sbGet('tareas','fecha=gte.'+sumaDias(hoy(),-7)+'&order=created_at'),sbGet('alias_pos'),sbGet('equivalencias'),
    sbGet('produccion','fecha=gte.'+sumaDias(hoy(),-60)+'&order=fecha.desc'),sbGet('produccion_mapeo','order=sector,producto'),sbGet('config')]);
  Object.assign(D,{insumos:ins,recetas:rec,proveedores:prov,facturas:fac,cierres:cie,gastos:gas,gastosFijos:gf,pedidos:ped,empleados:emp,fichajes:fic,turnos:tur,tareas:tar,alias:ali,equiv:eq,produccion:pro,mapeo:map,config:Object.fromEntries(cfg.map(c=>[c.clave,c.valor]))});

// ================= COSTEO DE RECETAS =================
function costoIngrediente(i,prof=0){
  const q=(+i.cantidad||0)*(1+(+i.merma||0)/100);
  if(i.insumo_id&&insMap[i.insumo_id])return q*(+insMap[i.insumo_id].costo_unitario||0);
  if(i.receta_id&&recMap[i.receta_id]&&prof<6){const s=recMap[i.receta_id];return q*costoReceta(s,prof+1)/(+s.rendimiento||1)}
  return q*(+i.costo_ref||0);
}
function costoReceta(r,prof=0){return (r.ingredientes||[]).reduce((a,i)=>a+costoIngrediente(i,prof),0)}

// Explota una receta en insumos (para descontar stock)
function explotar(receta,unidades,acc={},prof=0){
  if(prof>6)return acc;const rend=+receta.rendimiento||1;
  (receta.ingredientes||[]).forEach(i=>{const q=(+i.cantidad||0)*(1+(+i.merma||0)/100)*unidades/rend;
    if(i.insumo_id)acc[i.insumo_id]=(acc[i.insumo_id]||0)+q;
    else if(i.receta_id&&recMap[i.receta_id])explotar(recMap[i.receta_id],q,acc,prof+1);});
  return acc;
}

    let u=+it.cantidad||0;if(it.unidad==='kg'&&m.peso>0)u=u/m.peso;explotar(m.receta,u,acc)});

const esPlanilla=f=>/\.(xlsx|xlsm|xls|csv|txt)$/i.test(f.name)||/sheet|excel|csv/i.test(f.type);
async function abrirZip(buf){
  const dv=new DataView(buf),td=new TextDecoder();let e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('El archivo no es un Excel .xlsx válido');
  const n=dv.getUint16(e+10,true);let q=dv.getUint32(e+16,true);const idx={};
  for(let i=0;i<n;i++){const met=dv.getUint16(q+10,true),csz=dv.getUint32(q+20,true),nl=dv.getUint16(q+28,true),xl=dv.getUint16(q+30,true),cl=dv.getUint16(q+32,true),off=dv.getUint32(q+42,true);
    idx[td.decode(new Uint8Array(buf,q+46,nl))]={met,csz,off};q+=46+nl+xl+cl}
  return {nombres:Object.keys(idx),async leer(nombre){const f=idx[nombre];if(!f)return null;
    const data=new Uint8Array(buf,f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),f.csz);
    if(f.met===0)return td.decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}};
}
// Devuelve las hojas como [{nombre, filas:[[celda,...],...]}]. Los números quedan como número.
async function xlsxAHojas(buf){
  const z=await abrirZip(buf),dp=new DOMParser(),X=t=>dp.parseFromString(t,'application/xml');
  const ss=[];const sst=await z.leer('xl/sharedStrings.xml');
  if(sst)[...X(sst).getElementsByTagName('si')].forEach(si=>ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));
  const wb=X(await z.leer('xl/workbook.xml')||'<x/>'),rels=X(await z.leer('xl/_rels/workbook.xml.rels')||'<x/>');const rmap={};
  [...rels.getElementsByTagName('Relationship')].forEach(r=>rmap[r.getAttribute('Id')]=r.getAttribute('Target'));
  let hojas=[...wb.getElementsByTagName('sheet')].map(h=>{let t=rmap[h.getAttribute('r:id')]||'';t=t.replace(/^\/?(xl\/)?/,'');return {nombre:h.getAttribute('name'),archivo:'xl/'+t}});
  if(!hojas.length)hojas=z.nombres.filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort().map((a,i)=>({nombre:'Hoja '+(i+1),archivo:a}));
  const colN=ref=>{let n=0;for(const ch of ref.replace(/\d+/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
  const out=[];
  for(const h of hojas){const xml=await z.leer(h.archivo);if(!xml)continue;const filas=[];
    for(const row of X(xml).getElementsByTagName('row')){const f=[];
      for(const c of row.getElementsByTagName('c')){const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
        if(t==='s')val=ss[+(v?.textContent)]??'';else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
        else if(t==='str'||t==='b'||t==='e')val=v?v.textContent:'';else val=v&&v.textContent!==''?+v.textContent:'';
        f[colN(c.getAttribute('r')||'A1')]=val}
      for(let i=0;i<f.length;i++)if(f[i]===undefined)f[i]='';
      if(f.some(x=>String(x).trim()))filas.push(f)}
    out.push({nombre:h.nombre,filas})}
  return out;
}
function cargarSheetJS(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,err)=>{const sc=document.createElement('script');sc.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=()=>err(new Error('No se pudo abrir el Excel .xls. Guardalo como .xlsx o .csv y probá de nuevo'));document.head.appendChild(sc)})}
function csvAFilas(txt){const sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  return txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur=''}else cur+=ch}
    out.push(cur);return out})}
async function planillaAHojas(file){
  const buf=await file.arrayBuffer();
  if(/\.(csv|txt)$/i.test(file.name)||/csv/i.test(file.type)){let txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('�'))txt=new TextDecoder('windows-1252').decode(buf);return [{nombre:file.name,filas:csvAFilas(txt)}]}
  const z=new Uint8Array(buf,0,2);
  if(z[0]===0x50&&z[1]===0x4b){try{const h=await xlsxAHojas(buf);if(h.some(x=>x.filas.length))return h}catch(e){console.warn(e)}}
  const XL=await cargarSheetJS();const wb=XL.read(buf,{type:'array'});

// Fecha/hora de Excel (número de serie) o texto → Date en hora local
function fechaExcel(v){if(v instanceof Date)return v;if(typeof v==='number'&&v>20000){const ms=Math.round((v-25569)*864e5);const d=new Date(ms);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds())}
  const m=String(v||'').match(/(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);if(!m)return null;
  let [_,a,b,c,h,mi,se]=m;let y,mo,d;if(a.length===4){y=+a;mo=+b;d=+c}else{d=+a;mo=+b;y=+c<100?2000+ +c:+c}
  return new Date(y,mo-1,d,+h||0,+mi||0,+se||0)}

// Lee el "Control de artículos" de Ayres: una fila por artículo vendido, con hora, código, cantidad y subtotal.
// Devuelve null si el archivo no tiene ese formato.
async function leerAyresArticulos(file){
  const hojas=await planillaAHojas(file);
  for(const h of hojas){
    const hi=h.filas.findIndex(f=>{const n=f.map(x=>norm(String(x)));return n.includes('codigo')&&n.includes('cantidad')&&n.some(x=>x==='subtotal'||x==='importe'||x==='total')});
    if(hi<0)continue;
    const H=h.filas[hi].map(x=>norm(String(x)));const col=(...ks)=>H.findIndex(x=>ks.includes(x));
    const cE=col('e','estado'),cH=col('hora','fecha','fecha y hora'),cCod=col('codigo'),cArt=col('articulo','producto','descripcion'),cCant=col('cantidad'),cSub=col('subtotal','importe','total');
    const cTipo=H.findIndex((x,i)=>i!==cArt&&i>cCod&&h.filas.slice(hi+1,hi+30).some(f=>/^(articulo|combo|descuento|recargo|cupon|ajuste|adelanto|observacion)$/.test(norm(String(f[i]||'')))));
    const prods={},horas=new Set(),tks={};let total=0,anuladas=0,desde=null,hasta=null,descuentos=0;
    for(const f of h.filas.slice(hi+1)){
      const est=cE>=0?norm(String(f[cE]||'')):'cobrada';
      if(!est&&!f[cCod]&&!f[cSub])continue;
      if(/anulad|proceso/.test(est)){anuladas++;continue}
      const sub=numAR(f[cSub]),cant=numAR(f[cCant]);const tipo=cTipo>=0?norm(String(f[cTipo]||'')):'articulo';
      total+=sub;
      const fh=cH>=0?fechaExcel(f[cH]):null;if(fh){horas.add(fh.getTime());if(!desde||fh<desde)desde=fh;if(!hasta||fh>hasta)hasta=fh}
      const cod=String(f[cCod]??'').trim();
      if(!cod||!/articulo|combo/.test(tipo)){if(sub<0)descuentos+=sub;continue}
      const k=cod;const nom=String(f[cArt]||'').trim();
      const x=prods[k]||(prods[k]={codigo:cod,producto:nom,cantidad:0,total:0,fracc:false});
      x.cantidad+=cant;x.total+=sub;if(Math.abs(cant-Math.round(cant))>1e-6)x.fracc=true
      // cada ticket = misma fecha y hora en Ayres: sirve para descontar papelera por venta
      if(fh&&cant>0){const tk=tks[fh.getTime()]||(tks[fh.getTime()]=[]);tk.push({c:cod,q:Math.round(cant*1000)/1000})}}
    const items=Object.values(prods).sort((a,b)=>b.total-a.total).map(x=>({codigo:x.codigo,producto:x.producto,unidad:x.fracc?'kg':'un',cantidad:Math.round(x.cantidad*1000)/1000,total:Math.round(x.total*100)/100}));
    if(!items.length)continue;
    return {items,total:Math.round(total*100)/100,tickets:horas.size||null,desde,hasta,anuladas,descuentos,detalle:Object.values(tks)};
  }
  return null;
}

// Cambiar estas cantidades NO toca insumos (harina, etc.): es solo el conteo de lo ya elaborado.
const DEP={kidx:[],cargado:false,tab:'freezer',f:'',edit:{},freezer:[],camara:[],cocina:[],pasteleria:[],mov:[]};
const DEP_UBIC=[['local','🏪 Local'],['heladera','❄️ Heladera'],['freezer','🧊 Freezer'],['estante','📦 Estante']];

async function cargarDEP(){
  const [f,c,co,pa]=await Promise.all([sbGet('freezer_panaderia','order=nombre.asc'),sbGet('camara_panaderia','order=nombre.asc'),sbGet('cocina_stock','order=nombre.asc'),sbGet('pasteleria_stock','order=nombre.asc')]);
  DEP.freezer=f||[];DEP.camara=c||[];DEP.cocina=co||[];DEP.pasteleria=pa||[];
  try{DEP.mov=await sbGet('movimientos_terminados','order=fecha.desc&limit=150')||[]}catch(e){DEP.mov=[]}
  // Todas las recetas de cada sector tienen que poder cargarse, aunque el sector todavía no las haya producido
  try{
    const [recs,map]=await Promise.all([sb('recetas?select=id,nombre,tipo,sector,unidad_venta&sector=in.(panaderia,cocina,pasteleria)&tipo=in.(PRODUCCION,BASE)&order=nombre.asc'),sb('produccion_mapeo?select=sector,producto,receta_id')]);
    const nd=x=>(x||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
    const slugP=x=>'g_'+(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
    const vinc={};(map||[]).forEach(m=>{if(m.receta_id)(vinc[m.receta_id]=vinc[m.receta_id]||[]).push(nd(m.producto))});
    const vistos={};
    (recs||[]).forEach(r=>{
      const n=nd(r.nombre),k=r.sector+'|'+n;
      if(!n||n.includes('mayorista')||n.includes('(nativo)')||vistos[k])return;vistos[k]=1;
      if((vinc[r.id]||[]).some(p=>p!==n))return;           // ya está vinculada a un producto del sector con otro nombre
      if(r.sector==='panaderia'){
        const id=slugP(r.nombre),u=r.unidad_venta||'u';
        if(!DEP.freezer.some(x=>x.id===id||nd(x.nombre)===n))DEP.freezer.push({id,nombre:r.nombre,total:0,subtipos:{},unidad:u,def:[],_nuevo:1});
        if(!DEP.camara.some(x=>x.id===id||nd(x.nombre)===n))DEP.camara.push({id,nombre:r.nombre,cantidad:0,unidad:u,_nuevo:1});
      }else{
        const L=DEP[r.sector];
        if(!L.some(x=>nd(x.nombre||x.id)===n))L.push({id:r.nombre,nombre:r.nombre,local:0,heladera:0,freezer:0,estante:0,_nuevo:1});
      }
    });
    const orden=(a,b)=>nd(a.nombre||a.id).localeCompare(nd(b.nombre||b.id));
    ['freezer','camara','cocina','pasteleria'].forEach(t=>DEP[t].sort(orden));
  }catch(e){console.warn('recetas para depósitos',e)}

// Rellenos que Madrugada descuenta del stock de Cocina (heladera, en kg) al hornear: ej. 50 g de crema pastelera por lenguita.
async function rellAbrir(){let cfg={reglas:[]};try{const [c,ins]=await Promise.all([sbGet('config','clave=eq.consumos_horneado'),sb('insumos?select=id,nombre,unidad,stock&activo=eq.true&order=nombre')]);cfg=((c||[])[0]||{}).valor||cfg;window._rellIns=ins||[]}catch(e){}
  window._rell=(cfg.reglas||[]).map(r=>({...r}));rellPintar()}
function rellPintar(){const R=window._rell;const cs=(DEP.cocina||[]).map(r=>r.nombre||r.id),di=(window._rellIns||[]).map(r=>r.nombre);
  modal(`<h2>🥄 Lo que se usa al hornear</h2>
  <p class="muted">Cuando Madrugada hornea, se descuentan estos gramos <b>por unidad</b>: de la <b>heladera de Cocina</b> (crema pastelera, almíbar…) o del <b>Depósito</b> (azúcar impalpable…). Ej.: 30 lenguitas × 50 g = 1,5 kg de crema. Si un producto coincide con dos reglas del mismo insumo, se usa la más específica.</p>
  <div class="scroll"><table><tr><th>Aplica a</th><th>Se descuenta de</th><th>Insumo / relleno</th><th class="num">g por unidad</th><th></th></tr>
  ${R.map((r,i)=>`<tr><td><select id="rlA${i}" style="width:auto" onchange="rellLeer();rellPintar()"><option value="p" ${r.grupo!=='facturas'?'selected':''}>Productos que dicen…</option><option value="f" ${r.grupo==='facturas'?'selected':''}>Todas las facturas</option></select>${r.grupo!=='facturas'?`<input id="rlP${i}" value="${esc(r.patron||'')}" placeholder="ej: lenguita" style="margin-top:4px">`:''}</td>
    <td><select id="rlD${i}" style="width:auto" onchange="rellLeer();rellPintar()"><option value="cocina" ${(r.destino||'cocina')==='cocina'?'selected':''}>Heladera de Cocina</option><option value="deposito" ${r.destino==='deposito'?'selected':''}>Depósito</option></select></td>
    <td><input id="rlI${i}" value="${esc(r.insumo||'')}" list="${r.destino==='deposito'?'rlLD':'rlLC'}" placeholder="${r.destino==='deposito'?'AZUCAR IMP…':'Crema pastelera'}"></td>
    <td class="num"><input id="rlG${i}" type="number" min="0" step="any" value="${+r.gramos||''}" style="max-width:80px;text-align:right"></td><td><button class="btn peq sec" onclick="rellLeer();window._rell.splice(${i},1);rellPintar()">✕</button></td></tr>`).join('')}</table></div>
  <datalist id="rlLC">${cs.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><datalist id="rlLD">${di.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <p class="muted" style="font-size:12px">"Todas las facturas" = todo lo que en el local se vende como Facturas (medialunas, lenguitas, popurrí, vigilantes, santiagueñas…). "Popurrí + Roll" lleva menos crema e impalpable porque de cada 17 unidades, 9 son rolls. Almíbar: 4 ml ≈ 5 g.</p>
  <div class="acciones" style="margin-top:8px"><button class="btn sec" onclick="rellLeer();window._rell.push({patron:'',insumo:'',gramos:0,destino:'cocina'});rellPintar()">➕ Agregar</button><button class="btn" onclick="rellGuardar()">💾 Guardar</button></div>`)}
function rellLeer(){window._rell=window._rell.map((r,i)=>{const a=($('#rlA'+i)||{}).value,d=($('#rlD'+i)||{}).value||'cocina',ins=(($('#rlI'+i)||{}).value||'').trim();
  const o={insumo:ins,gramos:+(($('#rlG'+i)||{}).value)||0,destino:d};if(a==='f')o.grupo='facturas';else o.patron=(($('#rlP'+i)||{}).value||r.patron||'').trim();
  if(d==='deposito'){const m=(window._rellIns||[]).find(x=>norm(x.nombre)===norm(ins));if(m)o.insumo_id=m.id}return o})}
async function rellGuardar(){rellLeer();const reglas=window._rell.filter(r=>(r.patron||r.grupo)&&r.insumo&&r.gramos>0);
  const malos=reglas.filter(r=>r.destino==='deposito'&&!r.insumo_id);if(malos.length)return toast('No encontré en el Depósito: '+malos.map(r=>r.insumo).join(', '),6000);
  await sbIns('config',[{clave:'consumos_horneado',valor:{reglas}}],true);
  for(const r of reglas.filter(r=>r.destino!=='deposito')){if(!(DEP.cocina||[]).some(x=>norm(x.nombre||x.id)===norm(r.insumo))){try{await polyRPC('stock_sector_ajustar',{p_sector:'cocina',p_nombre:r.insumo,p_delta:{},p_motivo:'alta relleno',p_usuario:null})}catch(e){}}}
  toast('Guardado ✅');cerrarModal();DEP.cargado=false;vDepositos()}

// Productos que salen de leudado por lata pero se venden por kilo: Madrugada los pesa al hornear.
// Si se compran hechos (ej. chipa), se descuentan de ese insumo del depósito.
async function pesoAbrir(){let cfg={reglas:[]};try{const c=await sbGet('config','clave=eq.productos_por_peso');cfg=((c||[])[0]||{}).valor||cfg}catch(e){}
  window._peso=(cfg.reglas||[]).slice();pesoPintar()}
function pesoPintar(){const R=window._peso;
  modal(`<h2>⚖️ Productos por kilo</h2>
  <p class="muted">Si el nombre del producto contiene la palabra, Madrugada no carga unidades: <b>pesa lo que salió</b> y lo manda al Salón en kilos. Si el producto se compra hecho, poné el insumo del depósito y se descuentan esos kilos al hornear.</p>
  <table><tr><th>Si el producto dice…</th><th>Se compra hecho (insumo del depósito)</th><th></th></tr>
  ${R.map((r,i)=>`<tr><td><input id="psP${i}" value="${esc(r.patron||'')}"></td><td><input id="psC${i}" value="${esc(r.comprado||'')}" placeholder="(se hace acá)"></td><td><button class="btn peq sec" onclick="pesoLeer();window._peso.splice(${i},1);pesoPintar()">✕</button></td></tr>`).join('')}</table>
  <div class="acciones" style="margin-top:8px"><button class="btn sec" onclick="pesoLeer();window._peso.push({patron:''});pesoPintar()">➕ Agregar</button><button class="btn" onclick="pesoGuardar()">💾 Guardar</button></div>`)}
function pesoLeer(){window._peso=window._peso.map((r,i)=>{const o={patron:(($('#psP'+i)||{}).value||'').trim()};const c=(($('#psC'+i)||{}).value||'').trim();if(c)o.comprado=c;return o})}
async function pesoGuardar(){pesoLeer();const reglas=window._peso.filter(r=>r.patron);
  for(const r of reglas.filter(r=>r.comprado)){try{const ya=await sb('insumos?select=id&nombre=eq.'+encodeURIComponent(r.comprado));if(!(ya||[]).length)await sbIns('insumos',[{nombre:r.comprado,unidad:'kg',categoria:'ALIMENTOS',stock:0}])}catch(e){}}
  await sbIns('config',[{clave:'productos_por_peso',valor:{reglas}}],true);toast('Guardado ✅');cerrarModal()}
function depCeroTab(){
  const t=DEP.tab,tb=DEP_TABLA[t];if(!tb)return;
  DEP[t].forEach(r=>{
    if(t==='freezer'){const def=Array.isArray(r.def)?r.def:[];if(def.length)def.forEach(s=>DEP.edit[depKey(tb,r.id,'sub:'+s.id)]=0);else DEP.edit[depKey(tb,r.id,'total')]=0}
    else if(t==='camara')DEP.edit[depKey(tb,r.id,'cantidad')]=0;
    else DEP_UBIC.forEach(([u])=>DEP.edit[depKey(tb,r.id,u)]=0);
  });
  vDepositos();toast('Quedó todo en 0 en pantalla. Revisá y tocá 💾 Guardar para confirmar.',5000);
}
async function depGuardar(){
  const cambios=depCambios();if(!cambios.length)return toast('No hay cambios para guardar');
  const usr=(window.POLY_USUARIO||{}).usuario||null;let ok=0;const errores=[];
  for(const c of cambios){
    try{await polyRPC('stock_terminado_fijar',{p_tabla:c.tabla,p_id:c.id,p_nombre:c.nombre,p_campo:c.campo,p_valor:c.despues,p_usuario:usr});ok++;delete DEP.edit[c.k]}
    catch(e){errores.push(c.nombre+': '+e.message)}
    if(cambios.length>8&&ok%8===0)toast('Guardando… '+ok+' de '+cambios.length);
  }
  DEP.cargado=false;await vDepositos();
  if(errores.length)toast('⚠️ No se guardaron '+errores.length+': '+errores[0].slice(0,120),8000);
  else toast('Depósitos actualizados ✅ ('+ok+' cambio'+(ok>1?'s':'')+')',4000);
}

// ================= CANALES DE VENTA =================
const CANALES=['Efectivo','Mercado Pago / QR','Débito','Crédito','Transferencia','Apps delivery','Otros'];
function canalDe(n){const x=norm(n);
  if(x.includes('efectivo'))return 'Efectivo';
  if(x.includes('mercado')||x.includes('modo')||x.includes('qr')||x==='mp'||x.includes('mercadopago'))return 'Mercado Pago / QR';
  if(x.includes('pedidos')||x.includes('rappi')||x.includes('delivery'))return 'Apps delivery';
  if(x.includes('transf')||x.includes('deposito'))return 'Transferencia';
  if(x.includes('electron')||x.includes('debito')||x.includes('maestro')||x==='tarjeta debito')return 'Débito';
  if(x.includes('visa')||x.includes('master')||x.includes('amex')||x.includes('american')||x.includes('cabal')||x.includes('credito')||x.includes('tarjeta'))return 'Crédito';
  return 'Otros';}
function porCanal(cierres){const o={};cierres.forEach(c=>{const fp=c.formas_pago&&typeof c.formas_pago==='object'&&!Array.isArray(c.formas_pago)?c.formas_pago:{};let s=0;
  Object.entries(fp).forEach(([k,v])=>{const n=+v||0;if(!n)return;const cn=canalDe(k);o[cn]=(o[cn]||0)+n;s+=n});
  const resto=(+c.total||0)-s;if(resto>1)o['Sin detallar']=(o['Sin detallar']||0)+resto});return o}
function comisiones(){return D.config.comisiones||{}}
function impCfg(){return Object.assign({iva:21,iibb:3,mp:30},(D.config&&D.config.impuestos)||{})}
function fijosMensuales(){return D.gastosFijos.filter(g=>g.activo!==false).reduce((s,g)=>{const n=Math.max(1,+g.intervalo||1);const m=+g.monto||0;return s+(g.frecuencia==='semana'?m*52/12/n:g.frecuencia==='dia'?m*30/n:g.frecuencia==='año'?m/12/n:m/n)},0)}
function comisionDe(canal,monto){return monto*((+comisiones()[canal]||0)/100)}

// ================= SOLICITUDES DE CUENTA MAYORISTA (web) =================
const SOLMAY={lista:[],vistos:null};
const esSolMay=c=>c&&c.tipo!=='mayorista'&&String(c.proxima_accion||'').startsWith('Pidió cuenta MAYORISTA');
async function solMayCargar(){try{
  const L=await sbGet('crm_clientes','tipo=neq.mayorista&proxima_accion=like.'+encodeURIComponent('Pidió cuenta MAYORISTA*')+'&order=created_at.desc');
  const nuevos=SOLMAY.vistos?L.filter(c=>!SOLMAY.vistos.has(c.id)):[];
  SOLMAY.lista=L;SOLMAY.vistos=new Set(L.map(c=>c.id));
  if(nuevos.length){toast('🏪 Nuevo pedido de cuenta mayorista: '+nuevos.map(c=>c.razon_social||c.nombre).join(', '),8000);solMaySonido()}
  solMayPintar()}catch(e){console.warn('solMay',e)}}
function solMaySonido(){try{const C=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=C.createOscillator(),g=C.createGain();o.frequency.value=880;g.gain.setValueAtTime(.3,C.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,C.currentTime+t+.3);o.connect(g);g.connect(C.destination);o.start(C.currentTime+t);o.stop(C.currentTime+t+.3)})}catch(e){}}
function solMayPintar(){const el=$('#solMay');if(!el)return;const L=SOLMAY.lista;
  el.innerHTML=L.length?`<div class="card" style="margin-bottom:12px;border:2px solid #1565C0;background:#eef4fc"><h3 style="margin-top:0">🏪 ${L.length} pedido${L.length>1?'s':''} de cuenta mayorista</h3>${L.map(c=>`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #d6e2f3"><div style="flex:1;min-width:200px"><b>${esc(c.razon_social||'(sin nombre de negocio)')}</b> · ${esc(c.nombre)}<div class="muted" style="font-size:12px">📱 ${esc(c.telefono||'sin teléfono')} · se registró ${fechaCorta(diaLocal(c.created_at))}</div></div>
    <button class="btn peq" onclick="solMayAprobar(${c.id})">✅ Aprobar mayorista</button>${crmWa(c.telefono)?`<a class="btn sec peq" target="_blank" href="https://wa.me/${crmWa(c.telefono)}">💬 WhatsApp</a>`:''}<button class="btn sec peq" onclick="solMayRechazar(${c.id})">✖ No es mayorista</button></div>`).join('')}</div>`:''}

  if(!confirm(`¿Habilitar a ${c.razon_social||c.nombre} como MAYORISTA? Va a ver precios mayoristas y sus pedidos van a cuenta corriente.`))return;

// Lee la foto o PDF: las fotos se achican a JPG (máx 1800 px) para que pesen poco
function mantLeerArchivo(file){return new Promise((ok,mal)=>{
  if(!file)return ok(null);const esPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name);
  if(!esPdf&&!/^image\//.test(file.type))return mal(new Error('Subí una foto o un PDF'));
  if(esPdf&&file.size>4e6)return mal(new Error("El PDF pesa más de 4 MB: sacale una foto mejor"));
  const rd=new FileReader();rd.onerror=()=>mal(new Error('No pude leer el archivo'));
  rd.onload=()=>{const url=rd.result;
    if(esPdf)return ok({nombre:file.name,tipo:'application/pdf',datos:url.split(',')[1],bytes:file.size});
    const img=new Image();img.onerror=()=>mal(new Error('No pude abrir la foto'));
    img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.8).split(',')[1];
      ok({nombre:(file.name||'factura').replace(/\.[^.]+$/,'')+'.jpg',tipo:'image/jpeg',datos:d,bytes:Math.round(d.length*.75)})};img.src=url};
  rd.readAsDataURL(file)})}

  const b=atob(a.datos),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:a.tipo||'application/octet-stream'}));if(w)w.location=url;else location.href=url}catch(e){if(w)w.close();toast('⚠️ '+e.message,5000)}}

  ((D.difCaja&&D.difCaja.turnos)||[]).filter(t=>diaLocal(t.cerrado_at)>=sumaDias(H,-7)&&Math.abs(difTurno(t))>tolCaja()).forEach(t=>{const d=difTurno(t);
    out.push({r:1,t:`Caja ${d<0?'con faltante':'con sobrante'} · ${fechaCorta(diaLocal(t.cerrado_at))} ${t.turno||''}`,d:`${esc(nomCajero(t.cerrado_por))}: ${d<0?'faltan':'sobran'} ${$$(Math.abs(d))}${t.notas?' · "'+esc(t.notas)+'"':''}`,a:'#finanzas',al:'Ver'})});
  criticos().forEach(i=>out.push({r:1,t:'Stock crítico · '+i.nombre,d:`Quedan ${fnum(i.stock)} ${i.unidad} (mínimo ${fnum(i.stock_minimo)}).`,a:'#compras',al:'Pedir'}));
  D.gastosFijos.filter(g=>g.activo!==false&&g.proximo_vencimiento).forEach(g=>{const dias=Math.round((new Date(g.proximo_vencimiento+'T12:00:00')-new Date(H+'T12:00:00'))/864e5);
    if(dias<=(+g.dias_aviso||3))out.push({r:dias<0,t:(dias<0?'Vencido: ':'Vence pronto: ')+g.nombre,d:`${$$(g.monto)} · ${dias<0?'venció hace '+(-dias)+' días':dias===0?'vence hoy':'vence en '+dias+' días'}`,a:'#finanzas',al:'Pagar'})});
  const pend=D.facturas.filter(f=>f.estado==='pendiente');if(pend.length)out.push({t:`${pend.length} facturas pendientes de pago`,d:'Total '+$$(pend.reduce((a,f)=>a+(+f.total||0),0)),a:'#facturas',al:'Ver'});
  const desde=sumaDias(H,-60),porProv={};let tot=0;D.facturas.filter(f=>f.fecha&&f.fecha>=desde&&f.categoria!=='MANTENIMIENTO').forEach(f=>{porProv[f.proveedor]=(porProv[f.proveedor]||0)+(+f.total||0);tot+=(+f.total||0)});
  Object.entries(porProv).forEach(([p,v])=>{if(tot>0&&v/tot>.5)out.push({t:'Dependencia alta de '+p,d:`${fnum(v/tot*100,0)}% de tus compras de los últimos 60 días. Pedí cotización a otro proveedor para comparar.`,a:'#compras',al:'Proveedores'})});

  if(caros.length)out.push({t:`${caros.length} productos con costo de mercadería alto (más del 40%)`,d:caros.slice(0,4).map(r=>r.nombre+' '+fnum(cmv(r),0)+'%').join(' · '),a:'#recetas',al:'Revisar'});

  return out;

function ventasPorDiaSemana(){
  const nom=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],s=Array(7).fill(0),n=Array(7).fill(0),desde=sumaDias(hoy(),-56);

  Object.entries(porDia).forEach(([d,v])=>{const w=new Date(d+'T12:00:00').getDay();s[w]+=v;n[w]++});
  const prom=s.map((v,i)=>n[i]?v/n[i]:0),mx=Math.max(1,...prom);

}

async function guardarReceta(id){

    if(n.startsWith('📋 ')&&rec)it.receta_id=rec.id;else if(ins){it.insumo_id=ins.id;it.nombre=ins.nombre;if(!it.unidad)it.unidad=ins.unidad}else if(rec)it.receta_id=rec.id;else{errores.push(n);const prev=id&&(recMap[id].ingredientes||[]).find(x=>norm(x.nombre)===norm(n));if(prev&&prev.costo_ref)it.costo_ref=prev.costo_ref}
    ingredientes.push(it)});
  if(errores.length&&!window._okErr){window._okErr=1;return toast('No encontré: '+errores.join(', ')+'. Elegilos de la lista o tocá Guardar otra vez para dejarlos sin vincular.',7000)}
  window._okErr=0;
  const sector=$('#rSec').value,ut=+$('#rUT').value||null;
  const row={nombre,seccion:$('#rS').value.trim()||null,precio_venta:+$('#rP').value||0,rendimiento:+$('#rR').value||1,tipo:$('#rT').value,ingredientes,pasos:$('#rPa').value.split('\n').map(s=>s.trim()).filter(Boolean),
    sector,unidades_tanda:ut,unidad_venta:$('#rUV').value,cuota_semanal:+$('#rCS').value||null,updated_at:new Date().toISOString()};
  let rid=id;
  if(id){const [x]=await sbUpd('recetas','id=eq.'+id,row);Object.assign(recMap[id],x)}else{const [x]=await sbIns('recetas',[row]);D.recetas.push(x);rid=x.id}

  D.recetas.sort((a,b)=>a.nombre.localeCompare(b.nombre));indexar();cerrarModal();toast('Receta guardada ✅');if(vistaActual==='recetas')vRecetas();
}

async function camaraFoto(alListo,alternativa){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){return alternativa()}
  let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1920}},audio:false})}
  catch(e){toast('No pude abrir la cámara acá: elegí la foto de la galería',4000);return alternativa()}
  const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#000;z-index:10000;display:flex;flex-direction:column';
  ov.innerHTML='<video autoplay playsinline muted style="flex:1;width:100%;object-fit:contain;background:#000"></video><div style="display:flex;gap:10px;padding:14px;background:#111"><button class="btn sec" style="flex:1;padding:16px" data-a="no">Cancelar</button><button class="btn" style="flex:2;padding:16px;font-size:18px" data-a="si">📸 Sacar foto</button></div>';
  document.body.appendChild(ov);const v=ov.querySelector('video');v.srcObject=st;
  const fin=()=>{st.getTracks().forEach(t=>t.stop());ov.remove()};
  ov.querySelector('[data-a=no]').onclick=fin;
  ov.querySelector('[data-a=si]').onclick=()=>{if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
    c.toBlob(b=>{fin();alListo(new File([b],'factura.jpg',{type:'image/jpeg'}))},'image/jpeg',0.92)};
}
function sugerirInsumo(desc){
  const eq=D.equiv.find(e=>e.texto===norm(desc));if(eq&&insMap[eq.insumo_id])return insMap[eq.insumo_id];
  if(insByName[norm(desc)])return insByName[norm(desc)];
  const tk=norm(desc).split(/[^a-z0-9]+/).filter(t=>t.length>2&&!/^\d+$/.test(t));let mejor=null,mp=0;
  D.insumos.forEach(i=>{const n=norm(i.nombre);const p=tk.filter(t=>n.includes(t)).length;if(p>mp){mp=p;mejor=i}});
  return mp>=2||(mp===1&&tk.length===1)?mejor:null;
}

async function guardarFactura(){

    if(!ins)continue;it.insumo_id=ins.id;
    if(it.descripcion&&norm(it.descripcion)!==norm(ins.nombre)){await sbIns('equivalencias',[{texto:norm(it.descripcion),insumo_id:ins.id,updated_at:new Date().toISOString()}],true);D.equiv=D.equiv.filter(e=>e.texto!==norm(it.descripcion));D.equiv.push({texto:norm(it.descripcion),insumo_id:ins.id})}
    if(actualizar&&it.cantidad_base>0){const pu=it.total/it.cantidad_base;if(+ins.costo_unitario>0&&pu>ins.costo_unitario*1.15)suba.push(ins.nombre+' '+pct((pu-ins.costo_unitario)/ins.costo_unitario*100));
      // reventa (bombones, chocolates, garrapiñada, manteca…): lo comprado entra directo al stock del Salón, no al depósito
      const aSalon=ins.reventa_codigo&&ins.reventa_destino==='salon';
      const patch={stock:aSalon?(+ins.stock||0):Math.round(((+ins.stock||0)+it.cantidad_base)*1000)/1000,proveedor:prov,updated_at:new Date().toISOString()};if(pu>0)patch.costo_unitario=Math.round(pu*100)/100;
      const [x]=await sbUpd('insumos','id=eq.'+ins.id,patch);Object.assign(ins,x);
      if(aSalon){try{await sb('rpc/reventa_ingresar',{method:'POST',body:{p_codigo:ins.reventa_codigo,p_cantidad:it.cantidad_base,p_ref:prov+' '+num}})}catch(e){console.error('reventa',e);toast('⚠️ No se pudo sumar '+ins.nombre+' al Salón: cargalo a mano',6000)}}}}

// ================= TABLA NUTRICIONAL =================
// Se calcula con los ingredientes de la receta (incluye sub-recetas) y los valores cada 100 g de cada insumo
// (tabla nutricion_insumo). Son valores ESTIMADOS: no reemplazan un análisis de laboratorio.
let NUT=null;
const NUT_CAMPOS=[['kcal','Valor energético','kcal'],['hc','Carbohidratos','g'],['azucares','  de los cuales azúcares','g'],['proteinas','Proteínas','g'],['grasas','Grasas totales','g'],['grasas_sat','Grasas saturadas','g'],['grasas_trans','Grasas trans','g'],['fibra','Fibra alimentaria','g'],['sodio_mg','Sodio','mg']];
const NUT_VD={kcal:2000,hc:300,proteinas:75,grasas:55,grasas_sat:22,fibra:25,sodio_mg:2400};
const ALERG_TXT={gluten:'gluten (TACC)',leche:'leche',huevo:'huevo',soja:'soja',mani:'maní',frutos_secos:'frutos secos',sesamo:'sésamo',pescado:'pescado',crustaceos:'crustáceos'};
async function cargarNut(){const rows=await sbGet('nutricion_insumo');NUT={};rows.forEach(n=>NUT[n.insumo_id]=n);return NUT}
function explotarNut(r,factor,prof,out){if(!r||prof>6)return out;const rend=+r.rendimiento||1;
  for(const i of (r.ingredientes||[])){const q=(+i.cantidad||0)*(1+(+i.merma||0)/100)*factor/rend;
    if(i.insumo_id)out.push({id:i.insumo_id,q,nombre:i.nombre});
    else if(i.receta_id&&recMap[i.receta_id])explotarNut(recMap[i.receta_id],q,prof+1,out);
    else out.push({id:null,q,nombre:i.nombre})}
  return out}
function calcNut(r){
  const partes=explotarNut(r,1,0,[]);const tot={};NUT_CAMPOS.forEach(([k])=>tot[k]=0);
  let gramos=0;const faltan={},alerg=new Set();
  for(const p of partes){
    if(!p.q)continue;
    const n=p.id?NUT[p.id]:null;
    if(!n){const k=p.id||('x:'+p.nombre);faltan[k]={id:p.id,nombre:p.id&&insMap[p.id]?insMap[p.id].nombre:p.nombre};continue}
    if(!n.es_alimento)continue;
    if(n.kcal==null||!n.g_por_unidad){faltan[p.id]={id:p.id,nombre:insMap[p.id]?.nombre||p.nombre};continue}
    const g=p.q*n.g_por_unidad;gramos+=g;
    NUT_CAMPOS.forEach(([k])=>tot[k]+=g/100*(+n[k]||0));
    (n.alergenos||[]).forEach(a=>alerg.add(a));
  }
  const pesoU=+r.peso_unidad_g||0;const base=pesoU||gramos;
  const c100={};NUT_CAMPOS.forEach(([k])=>c100[k]=base?tot[k]/base*100:0);
  const porG=+r.porcion_g||pesoU||0;
  const porc=porG?Object.fromEntries(NUT_CAMPOS.map(([k])=>[k,c100[k]*porG/100])):null;
  return {c100,porc,porG,pesoU,gramosCrudo:gramos,faltan:Object.values(faltan),alerg:[...alerg]};
}
function fmtNut(v,k){if(v==null)return '—';if(k==='kcal'||k==='sodio_mg')return Math.round(v).toLocaleString('es-AR');return (v<10?Math.round(v*10)/10:Math.round(v)).toLocaleString('es-AR')}
function vdNut(v,k){return NUT_VD[k]?Math.round(v/NUT_VD[k]*100)+'%':'—'}

async function verNutricion(id){
  const r=recMap[id];if(!r)return;
  if(!NUT){modal('<p class="cargando">Calculando…</p>');try{await cargarNut()}catch(e){return}}
  const n=calcNut(r);
  const desc=r.porcion_desc||'1 unidad';
  modal(`<h2>🏷️ Tabla nutricional · ${esc(r.nombre)}</h2>
  <p class="muted">Valores <b>estimados</b> a partir de la receta. ${n.pesoU?'':'<b style="color:var(--rojo)">Todavía no cargaste el peso de 1 unidad horneada:</b> mientras tanto, "cada 100 g" se calcula sobre la masa cruda y no se muestra la porción.'}</p>
  <div class="fila"><div><label>Peso de 1 unidad ya horneada (g)</label><input id="nuP" type="number" step="any" value="${r.peso_unidad_g??''}" placeholder="ej: 60"></div>

  ${NUT_CAMPOS.map(([k,l,u])=>`<tr><td>${l.trim()===l?esc(l):'&nbsp;&nbsp;'+esc(l.trim())}</td><td class="num">${n.porc?fmtNut(n.porc[k],k)+' '+u:'—'}</td><td class="num">${n.porc?vdNut(n.porc[k],k):'—'}</td><td class="num">${fmtNut(n.c100[k],k)} ${u}</td></tr>`).join('')}

  <h3 style="margin-top:14px">Etiqueta para WhatsApp</h3>
  <canvas id="nuCanvas" width="1080" height="1350" style="width:100%;max-width:420px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)"></canvas>

    const patch={peso_unidad_g:num('#nuP'),porcion_g:num('#nuPg'),porcion_desc:$('#nuPd').value.trim()||null};
    const [x]=await sbUpd('recetas','id=eq.'+id,patch);Object.assign(r,x||patch);toast('Guardado ✅');verNutricion(id)};
  await dibujarEtiqueta(r,n);

    <div class="scroll"><table><tr><th>Código del remito</th><th>Producto</th><th>En el remito viene en</th><th>Se cobra por</th><th class="num">Precio</th><th>Va al local como</th><th></th></tr>
    ${CH.items.map((it,i)=>`<tr><td><input id="chC${i}" value="${esc(it.codigo||'')}" placeholder="ej: CHR" style="max-width:90px;text-transform:uppercase"></td><td><input id="chN${i}" value="${esc(it.nombre)}"></td>

  ${semanas.map(k=>{const L=sem[k].sort((a,b)=>a.fecha.localeCompare(b.fecha)),tot=L.reduce((a,b)=>a+(+b.total||0),0),imp=L.filter(b=>!b.pago_id),timp=imp.reduce((a,b)=>a+(+b.total||0),0);

const IS_STOP=new Set(['de','del','con','y','x','la','el','los','las','por','a','en','g','gr','grs','kg','u','un','unidad','unidades']);
function isTokens(s){return norm(s).replace(/\bjyq\b/g,'jamon queso').replace(/\(.*?\)/g,' ').replace(/[^a-z0-9ñ ]/g,' ').split(/\s+/).filter(w=>w&&!IS_STOP.has(w)).map(w=>w.length>3?w.replace(/(es|s)$/,''):w)}
function isParecido(a,b){const A=new Set(isTokens(a)),B=new Set(isTokens(b));if(!A.size||!B.size)return 0;let c=0;A.forEach(w=>{if(B.has(w))c++});return c/Math.max(A.size,B.size)}
function isEquiv(){try{return JSON.parse(localStorage.getItem('inv_salon_equiv')||'{}')}catch(e){return {}}}
function isBuscar(nombre,id){
  if(id){const r=IS.rows.find(x=>x.id===String(id).trim());if(r)return [r,'id']}
  const n=norm(nombre).trim();if(!n)return [null,''];
  const eq=isEquiv()[n];if(eq){const r=IS.rows.find(x=>x.id===eq);if(r)return [r,'aprendido']}
  let r=IS.rows.find(x=>norm(x.nombre).trim()===n||norm(x.id).replace(/_/g,' ')===n);if(r)return [r,'exacto'];
  let best=null,bs=0;IS.rows.forEach(x=>{const s=isParecido(nombre,x.nombre);if(s>bs){bs=s;best=x}});
  return bs>=0.6?[best,'parecido']:[null,''];
}
let IS_IMP=null;
async function isLeerExcel(file){
  if(!file)return;if(!IS.cargado)await cargarIS();
  let hojas;try{hojas=await planillaAHojas(file)}catch(e){return toast('⚠️ '+e.message,6000)}
  const lineas=[];
  for(const h of hojas){if(!h.filas.length)continue;
    let hi=h.filas.findIndex(f=>{const n=f.map(x=>norm(String(x)).trim());return n.some(x=>/^(producto|articulo|nombre|descripcion|item)$/.test(x))&&n.some(x=>/^(cantidad|stock|existencia|conteo|cant|stock actual|unidades)$/.test(x))});
    let cN=1,cQ=-1,cId=-1;
    if(hi>=0){const H=h.filas[hi].map(x=>norm(String(x)).trim());cN=H.findIndex(x=>/^(producto|articulo|nombre|descripcion|item)$/.test(x));cQ=H.findIndex(x=>/^(cantidad|stock|existencia|conteo|cant|stock actual|unidades)$/.test(x));cId=H.indexOf('id')}
    else{hi=-1;cN=0;cQ=1}
    for(const f of h.filas.slice(hi+1)){const nombre=String(f[cN]??'').trim();const qv=f[cQ];
      if(!nombre&&!(cId>=0&&f[cId]))continue;if(qv===''||qv==null)continue;
      const q=numAR(qv);if(isNaN(q))continue;
      const [r,como]=isBuscar(nombre,cId>=0?f[cId]:null);lineas.push({nombre:nombre||String(f[cId]),cant:q,id:r?r.id:'',como})}
  }
  if(!lineas.length)return toast('⚠️ No encontré productos con cantidad en ese archivo. Necesita una columna con el nombre del producto y otra con la cantidad.',7000);
  IS_IMP={archivo:file.name,lineas};isPreview();
}

function estAgrupar(cierres){
  const P={};let conDetalle=0;
  cierres.forEach(c=>{const its=c.items||[];if(its.length)conDetalle++;
    its.forEach(i=>{const cod=i.codigo||estCodDe(i.producto);const k=cod?('c:'+cod):('n:'+norm(i.producto||''));if(k==='n:')return;
      const pv=cod&&PV.prods?pvPorCod(String(cod)):null;
      const x=P[k]||(P[k]={k,codigo:cod||null,nombre:pv?pv.nombre:(i.producto||'?'),unidad:i.unidad||'un',cant:0,plata:0,turnos:0});
      x.cant+=+i.cantidad||0;x.plata+=+i.total||0;x.turnos++;if(i.unidad==='kg')x.unidad='kg'})});
  return {P,conDetalle};
}

   CRM.camps=k||[];CRM.envs=e||[];

    CRM.compras=co||[];CRM.canjes=cj||[];CRM.contenidos=ct||[];

      (vs||[]).forEach(v=>CRM.peds.push({id:'v'+v.id,venta_id:v.id,numero:'Caja '+v.id,cliente_id:v.cliente_id,fecha_retiro:diaLocal(v.created_at),created_at:v.created_at,total:+v.total||0,
        estado:(v.pagos||[]).some(p=>p.medio==='Cuenta corriente')?'Caja · a cuenta':'Caja',remito_nro:v.remito_nro,

      CRM.peds.sort((a,b)=>String(b.fecha_retiro||b.created_at).localeCompare(String(a.fecha_retiro||a.created_at)));}catch(e){console.warn('CRM ventas caja',e)}
  }catch(e){console.warn('CRM',e)}

const diasEntre=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function crmCalcular(){
  const H=hoy(),[m1]=mesRango(0);
  CRM.clis.forEach(c=>{
    c.tipo=c.tipo||'mayorista';
    const ps=CRM.peds.filter(p=>p.cliente_id===c.id&&!/cancel/i.test(p.estado||'')&&p.estado!=='por_confirmar');
    const fechas=ps.map(p=>(p.fecha_retiro||diaLocal(p.created_at))).sort();
    c._peds=ps;c._n=ps.length;c._total=ps.reduce((a,p)=>a+(+p.total||0),0);
    c._mes=ps.filter(p=>(p.fecha_retiro||diaLocal(p.created_at))>=m1).reduce((a,p)=>a+(+p.total||0),0);
    c._ultima=fechas.length?fechas[fechas.length-1]:null;
    // frecuencia: la que cargaste, o el promedio entre pedidos (con 3 o más), o 7 días
    let fc=null;if(fechas.length>=3){const g=[];for(let k=1;k<fechas.length;k++)g.push(diasEntre(fechas[k-1],fechas[k]));fc=Math.max(1,Math.round(g.reduce((a,b)=>a+b,0)/g.length))}
    c._freqCalc=fc;c._freq=+c.frecuencia_dias||fc||7;
    c._dias=c._ultima?Math.max(0,diasEntre(c._ultima,H)):null;
    const ult=CRM.inter.find(i=>i.cliente_id===c.id);c._ultContacto=ult?diaLocal(ult.fecha):null;
    c._cumpleMes=!!(c.cumpleanos&&c.cumpleanos.slice(5,7)===H.slice(5,7));
    if(c.activo===false)c._estado='baja';
    else if(c.proxima_fecha&&c.proxima_fecha<=H)c._estado='tarea';
    else if(!c._ultima)c._estado='nuevo';
    else if(c.tipo==='mayorista')c._estado=c._dias>Math.max(30,c._freq*3)?'inactivo':c._dias>Math.max(c._freq*1.5,c._freq+2)?'contactar':'aldia';
    else c._estado=c._dias>60?'inactivo':'aldia';   // clientes particulares: inactivo a los 2 meses sin comprar
  });
}
function crmChip(e,M){const [t,col]=(M||CRM_EST)[e]||[e,'#999'];return `<span class="chip" style="background:${col}1a;color:${col};border:1px solid ${col}55">${t}</span>`}
// Teléfono argentino → 10 dígitos (característica + número, sin 0 ni 15). Igual que tel_norm() en la base.
function telNorm(t){let d=String(t||'').replace(/\D/g,'');if(!d)return null;
  if(d.startsWith('54')&&d.length>=12)d=d.slice(2);if(d.startsWith('9')&&d.length===11)d=d.slice(1);if(d.startsWith('0'))d=d.slice(1);
  if(d.length===12){if(d.startsWith('11')&&d.slice(2,4)==='15')d=d.slice(0,2)+d.slice(4);else if(d.slice(3,5)==='15')d=d.slice(0,3)+d.slice(5);else if(d.slice(4,6)==='15')d=d.slice(0,4)+d.slice(6)}
  if(d.length===10&&d.startsWith('15'))d='11'+d.slice(2);if(d.length===8)d='11'+d;return d.slice(-10)}
function crmWa(tel){const n=telNorm(tel);return n&&n.length===10?'549'+n:null}
function igNorm(x){return (String(x||'').replace(/[?#].*$/,'').replace(/^\s*@|\s|https?:\/\/(www\.)?instagram\.com\/|\/.*$/g,'').toLowerCase())||null}
function crmPrimerNombre(c){const base=c.tipo==='mayorista'?(c.contacto||''):(c.contacto||c.nombre||'');const w=base.trim().split(/\s+/)[0]||'';return w?w[0].toUpperCase()+w.slice(1).toLowerCase():''}
function crmPersonalizar(txt,c){const n=crmPrimerNombre(c);return String(txt||'').replace(/\s?\{nombre\}/g,n?' '+n:'').replace(/\{negocio\}/g,c.nombre||'')}
function crmTabs(on){return `<div class="tabs2" style="margin-bottom:10px">${[['mayoristas','👥 Clientes'],['cuentas','💳 Cuentas corrientes'],['comunidad','🎁 Club de beneficios'],['campanias','📣 Campañas'],['contenidos','📝 Contenidos'],['instagram','📸 Instagram'+(IG.noLeidos?' ('+IG.noLeidos+')':'')]].map(([k,n])=>`<button class="${on===k?'on':''}" onclick="location.hash='#${k}'">${n}</button>`).join('')}</div>`}

// Reparte los pagos sobre las compras más viejas primero → qué boleta sigue debiendo y cuándo vence
function ccAnalizar(mov){const H=hoy();const cs=mov.filter(m=>m.tipo==='venta').map(m=>({m,pend:+m.monto||0})).sort((a,b)=>String(a.m.fecha).localeCompare(String(b.m.fecha)));
  let pag=mov.filter(m=>m.tipo!=='venta').reduce((a,m)=>a-(+m.monto||0),0);
  cs.forEach(x=>{const u=Math.min(Math.max(pag,0),x.pend);x.pend=Math.round((x.pend-u)*100)/100;pag-=u;
    const v=x.m.vencimiento;x.dias=v?diasEntre(H,v):null;x.est=x.pend<=0.009?'pagada':v==null?'sinplazo':x.dias<0?'vencida':x.dias<=7?'pronto':'aldia'});
  const pend=cs.filter(x=>x.pend>0.009);
  return {compras:cs,porId:Object.fromEntries(cs.map(x=>[x.m.id,x])),vencido:pend.filter(x=>x.est==='vencida').reduce((a,x)=>a+x.pend,0),
    vencidas:pend.filter(x=>x.est==='vencida'),pronto:pend.filter(x=>x.est==='pronto'),prox:pend.filter(x=>x.m.vencimiento).map(x=>x.m.vencimiento).sort()[0]||null,
    cheques:mov.filter(m=>m.tipo==='pago'&&m.cobro_fecha&&m.cobro_fecha>=H).sort((a,b)=>a.cobro_fecha.localeCompare(b.cobro_fecha))}}

  const f=fechaCorta(x.m.vencimiento);return x.est==='vencida'?`<span class="chip mal">Vencida hace ${-x.dias} d</span><div class="muted" style="font-size:11px">venció ${f}${x.pend<+x.m.monto-0.009?' · falta '+$$(x.pend):''}</div>`

async function crmImportar(file){if(!file)return;if(!CRM.cargado)await cargarCRM();
  let hojas;try{hojas=await planillaAHojas(file)}catch(e){return toast('⚠️ '+e.message,6000)}
  const MAP={nombre:/^(nombre|cliente|negocio|comercio|razon social|denominacion|nombre fantasia|nombre y apellido)$/,telefono:/^(telefono|tel|celular|cel|whatsapp|movil)$/,instagram:/^(instagram|ig|usuario instagram|@)$/,direccion:/^(direccion|domicilio)$/,cuit:/^(cuit|cuil|dni|cuit cuil)$/,email:/^(email|mail|e mail|correo)$/,zona:/^(zona|barrio|localidad)$/,contacto:/^(contacto|encargado|responsable)$/,rubro:/^(rubro|tipo|categoria)$/,condicion_pago:/^(condicion|condicion de pago|pago)$/,cumpleanos:/^(cumpleanos|cumple|fecha de nacimiento|nacimiento)$/};
  const nuevos=[];let dup=0;
  for(const h of hojas){const hi=h.filas.findIndex(f=>f.some(x=>MAP.nombre.test(norm(String(x)).trim())));if(hi<0)continue;
    const H=h.filas[hi].map(x=>norm(String(x)).trim());const col={};Object.entries(MAP).forEach(([k,re])=>{const i=H.findIndex(x=>re.test(x));if(i>=0)col[k]=i});
    for(const f of h.filas.slice(hi+1)){const nombre=String(f[col.nombre]??'').trim();if(!nombre)continue;
      const r={nombre};Object.keys(col).forEach(k=>{if(k!=='nombre'){const v=String(f[col[k]]??'').trim();if(v)r[k]=v}});
      if(r.instagram)r.instagram=igNorm(r.instagram);
      if(r.cumpleanos){const m=/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/.exec(r.cumpleanos);const iso=/^\d{4}-\d{2}-\d{2}/.test(r.cumpleanos)?r.cumpleanos.slice(0,10):m?`${m[3]?(m[3].length===2?'19'+m[3]:m[3]):'2000'}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;r.cumpleanos=iso}
      const tn=telNorm(r.telefono);
      if(CRM.clis.concat(nuevos).some(x=>(tn&&telNorm(x.telefono)===tn)||(r.instagram&&x.instagram===r.instagram)||(!tn&&!r.instagram&&norm(x.nombre)===norm(nombre)))){dup++;continue}
      nuevos.push(r)}}
  if(!nuevos.length)return toast(dup?'Todos los clientes del archivo ya estaban cargados':'⚠️ No encontré una columna con el nombre del cliente (Nombre, Cliente o Negocio)',7000);

  <div class="fila"><div><label>Cargarlos como</label><select id="crmImpT">${Object.entries(CRM_TCLI).map(([k,[t]])=>`<option value="${k}" ${(CRM.tipo||'mayorista')===k?'selected':''}>${t}</option>`).join('')}</select></div></div>

function crmVentasDesde(cliId,desde,dias=30){if(!desde)return {n:0,v:0};const d0=new Date(desde).getTime(),d1=d0+dias*864e5;

async function placaDibujar(){const cv=$('#plCv');if(!cv)return;
  try{await Promise.all([document.fonts.load('700 60px "Playfair Display"'),document.fonts.load('400 30px Lato'),document.fonts.load('700 30px Lato')])}catch(e){}
  const W=1080,H=PLACA.formato==='historia'?1920:PLACA.formato==='cuadrado'?1080:1350;cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const V='#0C461F',V2='#186B34',CR='#F5F0E9',OR='#C9A84C';
  c.fillStyle=CR;c.fillRect(0,0,W,H);
  let yTxt;
  if(PLACA.foto){const fh=Math.round(H*0.58),img=PLACA.foto,k=Math.max(W/img.width,fh/img.height),w=img.width*k,h=img.height*k;
    c.save();c.beginPath();c.rect(0,0,W,fh);c.clip();c.drawImage(img,(W-w)/2,(fh-h)/2,w,h);c.restore();
    const g=c.createLinearGradient(0,fh-260,0,fh);g.addColorStop(0,'rgba(12,70,31,0)');g.addColorStop(1,'rgba(12,70,31,.85)');c.fillStyle=g;c.fillRect(0,fh-260,W,260);
    c.fillStyle=OR;c.fillRect(0,fh,W,10);yTxt=fh+110;
    c.textAlign='left';c.fillStyle=CR;c.font='700 46px "Playfair Display", serif';c.fillText('Poly',50,fh-40);c.fillStyle=OR;c.font='italic 700 46px "Playfair Display", serif';c.fillText('Artesanal',160,fh-40);
  }else{c.fillStyle=V;c.fillRect(0,0,W,210);c.fillStyle=OR;c.fillRect(0,210,W,10);c.textAlign='center';
    c.fillStyle=CR;c.font='700 74px "Playfair Display", serif';c.fillText('Poly',W/2-155,128);c.fillStyle=OR;c.font='italic 700 74px "Playfair Display", serif';c.fillText('Artesanal',W/2+110,128);
    c.fillStyle=CR;c.font='400 26px Lato, sans-serif';c.fillText('PANADERÍA DE AUTOR',W/2,180);
    yTxt=PLACA.formato==='historia'?560:PLACA.formato==='cuadrado'?360:420;
    c.fillStyle=OR;c.font='700 64px serif';c.fillText('✦',W/2,yTxt-110)}
  c.textAlign='center';c.fillStyle=V;
  let fs=PLACA.formato==='cuadrado'?74:84;c.font=`700 ${fs}px "Playfair Display", serif`;
  let L=partirTexto(c,PLACA.titulo||'Título',W-140);while(L.length>3&&fs>50){fs-=6;c.font=`700 ${fs}px "Playfair Display", serif`;L=partirTexto(c,PLACA.titulo,W-140)}
  L.forEach(l=>{c.fillText(l,W/2,yTxt);yTxt+=fs*1.15});
  yTxt+=20;c.fillStyle=OR;c.fillRect(W/2-60,yTxt-30,120,6);yTxt+=40;
  c.fillStyle='#333';c.font='400 40px Lato, sans-serif';
  String(PLACA.subtitulo||'').split(/\n|·/).map(x=>x.trim()).filter(Boolean).forEach(par=>{partirTexto(c,par,W-160).forEach(l=>{if(yTxt<H-170){c.fillText(l,W/2,yTxt);yTxt+=54}});yTxt+=14});
  if(PLACA.pie){c.fillStyle=V2;c.font='700 34px Lato, sans-serif';partirTexto(c,PLACA.pie,W-160).slice(0,2).forEach((l,i)=>c.fillText(l,W/2,H-150+i*42))}
  c.fillStyle=V;c.fillRect(0,H-70,W,70);c.fillStyle=CR;c.font='700 28px Lato, sans-serif';c.fillText('@polyartesanal  ·  Galván 3512, Villa Urquiza  ·  24 hs',W/2,H-25);
}

function contExtraerJSON(txt){const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<0)throw new Error('La IA no devolvió el calendario. Probá de nuevo.');return JSON.parse(txt.slice(a,b+1))}
async function contGenerar(puntual){
  const key=apiKey();if(!key){abrirAjustes();return toast('Cargá la API key de Anthropic en Ajustes',5000)}
  const pedido=puntual?$('#ctUno').value.trim():'';if(puntual&&!pedido)return toast('Escribí qué necesitás');
  const dias=+$('#ctP').value||14,desde=sumaDias(hoy(),1),hasta=sumaDias(hoy(),dias);
  const obj=[...document.querySelectorAll('.ctO')].filter(e=>e.checked).map(e=>e.value);
  const cfg=comCfg(),prods=(await contProductos()).slice(0,120);
  const yaHay=CRM.contenidos.filter(x=>x.fecha>=hoy()).map(x=>x.fecha+' '+x.canal+': '+x.titulo).slice(0,40);
  const prompt=`Sos la community manager de Poly Artesanal, una panadería de autor en Galván 3512, Villa Urquiza (CABA, Argentina), abierta las 24 horas. Instagram: @polyartesanal. Hacen panes de fermentación natural con harina orgánica, facturas, budines, tortas, cookies (también sin TACC, keto y veganas), empanadas, sándwiches de miga y más. Tienen un programa de fidelidad: la "${cfg.nombre}" (cada ${cfg.cada} compras: ${cfg.beneficio}; en el cumpleaños: ${cfg.cumple}), al que la gente se suma con este link: ${comLink()}.
Hoy es ${hoy()} (${new Date(hoy()+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long'})}).
Productos que venden: ${prods.join(', ')||'(sin lista)'}.
${puntual?`Necesito esto puntual: "${pedido}". Devolvé entre 1 y 3 contenidos para eso, con fechas entre ${desde} y ${hasta}.`:
`Armá el calendario de contenidos desde ${desde} hasta ${hasta}: por semana ${+$('#ctPo').value||0} publicaciones (post), ${+$('#ctRe').value||0} reels, ${+$('#ctHi').value||0} historias y ${+$('#ctWa').value||0} mensajes de WhatsApp para clientes.
Objetivos: ${obj.join('; ')||'mostrar la panadería'}.
Productos a destacar: ${$('#ctPr').value.trim()||'los que te parezcan mejores para la época'}.
Novedades o promos a incluir: ${$('#ctNo').value.trim()||'ninguna en particular'}.`}
${yaHay.length?'Ya está programado (no repitas): '+yaHay.join(' | ')+'.':''}
Tono: ${$('#ctTo').value}. Escribí en español rioplatense (voseo), natural, sin exagerar con los emojis.
Reglas:
- No inventes precios, descuentos, horarios ni promociones que no te di: si hace falta un dato, dejalo entre [corchetes] para completar.
- Fechas especiales: incluí solo las que sepas con certeza para Argentina en ese rango (Día de la Madre, Navidad, feriados, etc.). Si no estás segura de una fecha, no la uses.
- "post" y "reel": texto con un gancho en la primera línea, cuerpo corto, llamado a la acción y 5 a 10 hashtags al final (#panaderia #villaurquiza #masamadre, etc.).
- "historia": texto muy corto para poner sobre la imagen y una idea de sticker (encuesta, pregunta, link).
- "whatsapp": mensaje corto y personal que empiece con "Hola{nombre}!" (así, pegado) y termine con "Si no querés recibir más mensajes, respondé BAJA."
- "visual": qué foto o video sacar con el celular, concreto: qué producto, encuadre, luz, fondo, manos, detalles. Que sea fácil de hacer en la panadería.
- "guion" solo para reels: escenas numeradas con segundos, qué se ve, texto en pantalla y tipo de audio (sin nombres de canciones). 15 a 30 segundos.
- "placa": para post e historia, si conviene una imagen con texto de la marca: {"titulo": máx 6 palabras, "subtitulo": máx 20 palabras, "pie": opcional}. Si no conviene, null.
- Repartí bien los días y los horarios de la semana. Variá productos y formatos.
Devolvé SOLO un JSON así: {"items":[{"fecha":"YYYY-MM-DD","canal":"post|reel|historia|whatsapp","titulo":"título corto interno","texto":"...","visual":"...","guion":"... o null","placa":{"titulo":"...","subtitulo":"...","pie":"..."} o null}]}`;
  CONT.gen=true;vContenidos();
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODELO_IA,max_tokens:16000,messages:[{role:'user',content:prompt}]})});
    const j=await r.json();if(j.error)throw new Error(j.error.message);
    const out=contExtraerJSON(j.content.map(c=>c.text||'').join(''));
    const items=(out.items||[]).filter(x=>x&&x.texto&&CONT_CANAL[x.canal]).map(x=>({fecha:/^\d{4}-\d{2}-\d{2}$/.test(x.fecha||'')?x.fecha:desde,canal:x.canal,titulo:String(x.titulo||'').slice(0,120),texto:x.texto,visual:x.visual||null,guion:x.canal==='reel'?(x.guion||null):null,placa:x.placa&&x.placa.titulo?x.placa:null}));
    if(!items.length)throw new Error('La IA no devolvió contenidos. Probá de nuevo.');
    const rows=await sbIns('crm_contenidos',items);CRM.contenidos.push(...(rows||[]));
    CONT.gen=false;CONT.f='pend';vContenidos();toast('Listo: '+items.length+' contenido'+(items.length>1?'s':'')+' en el calendario ✅',4000);
  }catch(e){CONT.gen=false;vContenidos();toast('⚠️ '+e.message,7000)}
}

// vínculo entre el nombre con que llega cada producto de los sectores y el producto de venta.
// El Salón usa esta lista para el Control diario.
const normV=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let PV={prods:[],alias:[],llegadas:[],cargado:false},tabPV='vinc',fPV='';
async function cargarPV(){
  const [p,a,r,m]=await Promise.all([sbGet('productos_venta','order=nombre'),sbGet('productos_venta_alias','order=alias'),
    sb('salon_recepciones?select=producto_nombre,sector_origen,created_at&created_at=gte.'+sumaDias(hoy(),-120)+'&order=created_at.desc&limit=3000'),
    sbGet('produccion_mapeo','order=sector,producto')]);
  const ll={};
  (r||[]).forEach(x=>{const k=normV(x.producto_nombre);if(!k)return;if(!ll[k])ll[k]={k,nombre:x.producto_nombre,sectores:new Set(),veces:0,ultima:x.created_at};ll[k].veces++;ll[k].sectores.add(x.sector_origen||'')});
  (m||[]).forEach(x=>{const k=normV(x.producto);if(!k)return;if(!ll[k])ll[k]={k,nombre:x.producto,sectores:new Set(),veces:0,ultima:null};ll[k].sectores.add(x.sector)});
  PV={prods:p||[],alias:a||[],llegadas:Object.values(ll),cargado:true};
}
function pvPorCod(c){return PV.prods.find(p=>p.codigo===c)}
function pvAliasDe(k){return PV.alias.find(a=>a.alias===k)}
function pvRecIdDe(k){const r=(D&&D.recetas||[]).find(x=>normV(x.nombre)===k);return r?r.id:null}
function pvOpciones(){return `<datalist id="dlPV">${PV.prods.filter(p=>p.activo).map(p=>`<option value="${esc(p.codigo+' · '+p.nombre)}">`).join('')}</datalist>`}
function pvLeer(v){v=(v||'').trim();if(!v)return null;const c=v.split('·')[0].trim();return pvPorCod(c)||PV.prods.find(p=>norm(p.nombre)===norm(v))||null}

    <div class="acciones" style="margin-top:10px"><button class="btn" onclick="pvVincularNuevo()">Vincular</button></div></div>`;

  }
  if(t==='prods'){
    const q=norm(fPV);const lista=PV.prods.filter(p=>!q||norm(p.nombre).includes(q)||p.codigo===fPV.trim());
    html+=`<div class="acciones" style="margin-bottom:10px"><input placeholder="Buscar por nombre o código…" value="${esc(fPV)}" oninput="fPV=this.value;clearTimeout(window._tpv);window._tpv=setTimeout(()=>{vVenta();const i=document.querySelector('#app input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)" style="max-width:320px"><button class="btn" onclick="pvEditar(null)">➕ Nuevo producto</button></div>
    <div class="card scroll"><table><tr><th>Código</th><th>Producto</th><th>Tipo</th><th class="num">Mayorista</th><th class="num">Local (LPU)</th><th class="num">PedidosYa</th><th>IVA</th><th class="num">Recetas / nombres vinculados</th><th>Estado</th></tr>
    ${lista.map(p=>{const n=PV.alias.filter(a=>a.codigo===p.codigo).length;return `<tr class="click" onclick="pvEditar('${esc(p.codigo)}')" style="${p.activo?'':'opacity:.5'}"><td>${esc(p.codigo)}</td><td>${p.foto_url?`<img src="${esc(p.foto_url)}" loading="lazy" style="width:36px;height:27px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:6px">`:''}<b>${esc(p.nombre)}</b>${(p.variantes||[]).length?` <span class="muted" style="font-size:12px">· ${(p.variantes||[]).length} variedades${(p.variantes||[]).some(v=>v.v)?' ('+(p.variantes||[]).filter(v=>v.v).length+' 🌱)':''}${(p.variantes||[]).some(v=>v.st)?' ('+(p.variantes||[]).filter(v=>v.st).length+' 🌰)':''}</span>`:''} <span title="${p.vegano?'Vegano: tocá para quitar':'Tocá para marcarlo vegano'}" onclick="event.stopPropagation();pvVegano('${esc(p.codigo)}')" style="cursor:pointer;${p.vegano?'':'opacity:.25;filter:grayscale(1)'}">🌱</span> <span title="${p.sin_trigo?'Sin trigo: tocá para quitar':'Tocá para marcarlo sin trigo (harina de almendras)'}" onclick="event.stopPropagation();pvSinTrigo('${esc(p.codigo)}')" style="cursor:pointer;${p.sin_trigo?'':'opacity:.25;filter:grayscale(1)'}">🌰</span>${[['integral','🌾','Integral'],['sin_azucar','🍃','Sin azúcar'],['keto','🥑','Keto']].map(([c,e,t])=>` <span title="${p[c]?t+': tocá para quitar':'Tocá para marcarlo '+t.toLowerCase()}" onclick="event.stopPropagation();pvFlag('${esc(p.codigo)}','${c}','${t}')" style="cursor:pointer;${p[c]?'':'opacity:.25;filter:grayscale(1)'}">${e}</span>`).join('')}</td><td>${esc(p.tipo||'')}</td>
