  if (pagina === 'gestion.html' || pagina === 'central.html') requerido = 'admin';

  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function borrar() { try { localStorage.removeItem('poly_sesion'); localStorage.removeItem('poly_usuario'); } catch (e) {} }
  function irA(p) { location.replace(p); }
  function mostrar() { document.documentElement.style.visibility = ''; }

  window.polyRPC = function (fn, body) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message || 'Error'); return j; }); });
  };
  window.polyToken = function () { return leer('poly_sesion'); };
  window.polySalir = function () {
    var t = leer('poly_sesion'); borrar();
    var fin = function () { location.href = 'index.html'; };
    if (t) window.polyRPC('cerrar_sesion', { p_token: t }).then(fin, fin); else fin();
  };

  function permitido(u) { return u.rol === 'admin' || (requerido && requerido !== 'admin' && u.modulo === requerido); }
  function destino(u) { return u.rol === 'admin' ? 'index.html' : (ARCHIVO[u.modulo] || 'index.html'); }

  function barra(u) {
    var b = document.createElement('div');
    b.id = 'poly-sesion';

  });
})();

<script>
// ================= CONFIG =================
const SB_URL='https://sinoeoaktirnscdpbvdc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg';
const MODELO_IA='claude-sonnet-5-5';
const TZ='America/Argentina/Buenos_Aires';

// ================= HELPERS =================
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const $$=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Math.round(+n||0));
const fnum=(n,d=2)=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:d}).format(+n||0);
const pct=n=>(isFinite(n)?(n>0?'+':'')+fnum(n,1)+'%':'—');
const diaLocal=d=>new Date(d).toLocaleDateString('sv-SE',{timeZone:TZ});
const hoy=()=>diaLocal(new Date());
const sumaDias=(ymd,n)=>{const d=new Date(ymd+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fechaCorta=ymd=>ymd?new Date(ymd.slice(0,10)+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}):'—';
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function modal(html){$('#modalc').innerHTML=html;$('#modal').style.display='flex';$('#modal').scrollTop=0}
function cerrarModal(){$('#modal').style.display='none';$('#modalc').innerHTML=''}
function confirmar(texto,accion){modal(`<h3>${esc(texto)}</h3><div class="acciones" style="margin-top:16px"><button class="btn rojo" id="okConf">Sí, confirmar</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`);$('#okConf').onclick=async()=>{cerrarModal();await accion()}}

async function sb(path,{method='GET',body,prefer}={}){
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(prefer)h.Prefer=prefer;
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.text();console.error('Supabase',path,r.status,t);toast('⚠️ Error guardando: '+t.slice(0,120),6000);throw new Error(t)}
  const t=await r.text();return t?JSON.parse(t):null;
}
const sbGet=(t,q='')=>sb(t+'?select=*'+(q?'&'+q:''));
const sbIns=(t,rows,upsert)=>sb(t,{method:'POST',body:rows,prefer:'return=representation'+(upsert?',resolution=merge-duplicates':'')});
const sbUpd=(t,filtro,patch)=>sb(t+'?'+filtro,{method:'PATCH',body:patch,prefer:'return=representation'});
const sbDel=(t,filtro)=>sb(t+'?'+filtro,{method:'DELETE'});

// ================= ESTADO =================
const D={insumos:[],recetas:[],proveedores:[],facturas:[],cierres:[],gastos:[],gastosFijos:[],pedidos:[],empleados:[],fichajes:[],turnos:[],tareas:[],alias:[],equiv:[],produccion:[],mapeo:[],config:{}};
let insMap={},recMap={},recByName={},insByName={};
function indexar(){
  insMap={};insByName={};D.insumos.forEach(i=>{insMap[i.id]=i;insByName[norm(i.nombre)]=i});
  recMap={};recByName={};D.recetas.forEach(r=>{recMap[r.id]=r;recByName[norm(r.nombre)]=r});
}
async function cargarTodo(){
  const desde=sumaDias(hoy(),-400);
  const [ins,rec,prov,fac,cie,gas,gf,ped,emp,fic,tur,tar,ali,eq,pro,map,cfg]=await Promise.all([
    sbGet('insumos','order=nombre'),sbGet('recetas','order=nombre'),sbGet('proveedores','order=nombre'),
    sbGet('facturas','order=fecha.desc.nullslast'),sbGet('cierres_caja','fecha=gte.'+desde+'&order=fecha.desc'),
    sbGet('gastos','order=fecha.desc'),sbGet('gastos_fijos','order=proximo_vencimiento.nullslast'),
    sbGet('compras_pedidos','order=created_at.desc'),sbGet('empleados','order=nombre'),
    sbGet('fichajes','momento=gte.'+sumaDias(hoy(),-35)+'&order=momento'),sbGet('turnos_plan','fecha=gte.'+sumaDias(hoy(),-14)),
    sbGet('tareas','fecha=gte.'+sumaDias(hoy(),-7)+'&order=created_at'),sbGet('alias_pos'),sbGet('equivalencias'),
    sbGet('produccion','fecha=gte.'+sumaDias(hoy(),-60)+'&order=fecha.desc'),sbGet('produccion_mapeo','order=sector,producto'),sbGet('config')]);
  Object.assign(D,{insumos:ins,recetas:rec,proveedores:prov,facturas:fac,cierres:cie,gastos:gas,gastosFijos:gf,pedidos:ped,empleados:emp,fichajes:fic,turnos:tur,tareas:tar,alias:ali,equiv:eq,produccion:pro,mapeo:map,config:Object.fromEntries(cfg.map(c=>[c.clave,c.valor]))});
  indexar();
}

// ================= COSTEO DE RECETAS =================
function costoIngrediente(i,prof=0){
  const q=(+i.cantidad||0)*(1+(+i.merma||0)/100);
  if(i.insumo_id&&insMap[i.insumo_id])return q*(+insMap[i.insumo_id].costo_unitario||0);
  if(i.receta_id&&recMap[i.receta_id]&&prof<6){const s=recMap[i.receta_id];return q*costoReceta(s,prof+1)/(+s.rendimiento||1)}
  return q*(+i.costo_ref||0);
}
function costoReceta(r,prof=0){return (r.ingredientes||[]).reduce((a,i)=>a+costoIngrediente(i,prof),0)}
function costoUnit(r){return costoReceta(r)/(+r.rendimiento||1)}
function cmv(r){const p=+r.precio_venta||0;return p>0?costoUnit(r)/p*100:null}
function chipCMV(c){if(c==null)return '<span class="chip neu">sin precio</span>';const cl=c<=30?'ok':c<=40?'med':'mal';return `<span class="chip ${cl}">${fnum(c,1)}%</span>`}

// Explota una receta en insumos (para descontar stock)
function explotar(receta,unidades,acc={},prof=0){
  if(prof>6)return acc;const rend=+receta.rendimiento||1;
  (receta.ingredientes||[]).forEach(i=>{const q=(+i.cantidad||0)*(1+(+i.merma||0)/100)*unidades/rend;
    if(i.insumo_id)acc[i.insumo_id]=(acc[i.insumo_id]||0)+q;
    else if(i.receta_id&&recMap[i.receta_id])explotar(recMap[i.receta_id],q,acc,prof+1);});
  return acc;
}
function recetaDeVenta(nombre){
  const a=D.alias.find(x=>norm(x.alias)===norm(nombre));
  if(a&&a.receta_id&&recMap[a.receta_id])return {receta:recMap[a.receta_id],peso:+a.peso_por_unidad_kg||0};
  const r=recByName[norm(nombre)];return r?{receta:r,peso:0}:null;
}
async function descontarStock(items){
  const acc={},sinReceta=[];
  items.forEach(it=>{const m=recetaDeVenta(it.producto);if(!m){sinReceta.push(it.producto);return}
    let u=+it.cantidad||0;if(it.unidad==='kg'&&m.peso>0)u=u/m.peso;explotar(m.receta,u,acc)});
  for(const [id,q] of Object.entries(acc)){const x=insMap[id];if(!x)continue;
    const nuevo=Math.round(((+x.stock||0)-q)*1000)/1000;await sbUpd('insumos','id=eq.'+id,{stock:nuevo,updated_at:new Date().toISOString()});x.stock=nuevo}
  return {insumos:Object.keys(acc).length,sinReceta};
}

// ================= IA (lectura de facturas y tickets) =================
function apiKey(){try{return localStorage.getItem('anthropic_api_key')||''}catch(e){return ''}}

  modal(`<h3>⚙️ Ajustes</h3>

  <input id="ak" type="password" placeholder="sk-ant-..." value="${esc(apiKey())}">

  <div class="acciones"><button class="btn" onclick="try{localStorage.setItem('anthropic_api_key',$('#ak').value.trim())}catch(e){};cerrarModal();toast('Guardado ✅')">Guardar</button></div>`);
}
async function archivoABase64(file){
  if(file.type==='application/pdf'){return {tipo:'pdf',media:'application/pdf',data:await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=err;r.readAsDataURL(file)})}}
  const img=await createImageBitmap(file);const max=1800;const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {tipo:'img',media:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]};
}
async function leerConIA(file,prompt){
  const key=apiKey();if(!key){abrirAjustes();throw new Error('Falta la API key')}
  const f=await archivoABase64(file);
  const doc=f.tipo==='pdf'?{type:'document',source:{type:'base64',media_type:f.media,data:f.data}}:{type:'image',source:{type:'base64',media_type:f.media,data:f.data}};
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:MODELO_IA,max_tokens:6000,messages:[{role:'user',content:[doc,{type:'text',text:prompt}]}]})});
  const j=await r.json();if(j.error)throw new Error(j.error.message);
  const txt=j.content.map(c=>c.text||'').join('');const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  return JSON.parse(txt.slice(a,b+1));
}
const PROMPT_FACTURA=`Sos un asistente de una panadería argentina. Leé esta factura de proveedor y devolvé SOLO un JSON con esta forma:
{"proveedor":"razón social","cuit":"","numero":"punto de venta y número","tipo":"A|B|C|X|remito","fecha":"YYYY-MM-DD","condicion_pago":"Contado|Cuenta corriente|...","subtotal":0,"impuestos":0,"total":0,
"items":[{"descripcion":"texto tal cual figura","bultos":0,"contenido_por_bulto":0,"unidad_base":"kg|litros|unidades","total_linea":0}]}
Reglas:

- "total_linea" es el importe final de la línea con IVA incluido si la factura lo discrimina por línea; si no, el importe de la línea.

const CANALES=['Efectivo','Mercado Pago / QR','Débito','Crédito','Transferencia','Apps delivery','Otros'];
function canalDe(n){const x=norm(n);
  if(x.includes('efectivo'))return 'Efectivo';
  if(x.includes('mercado')||x.includes('modo')||x.includes('qr')||x==='mp'||x.includes('mercadopago'))return 'Mercado Pago / QR';
  if(x.includes('pedidos')||x.includes('rappi')||x.includes('delivery'))return 'Apps delivery';
  if(x.includes('transf')||x.includes('deposito'))return 'Transferencia';
  if(x.includes('electron')||x.includes('debito')||x.includes('maestro')||x==='tarjeta debito')return 'Débito';
  if(x.includes('visa')||x.includes('master')||x.includes('amex')||x.includes('american')||x.includes('cabal')||x.includes('credito')||x.includes('tarjeta'))return 'Crédito';
  return 'Otros';}
function porCanal(cierres){const o={};cierres.forEach(c=>{const fp=c.formas_pago&&typeof c.formas_pago==='object'&&!Array.isArray(c.formas_pago)?c.formas_pago:{};let s=0;
  Object.entries(fp).forEach(([k,v])=>{const n=+v||0;if(!n)return;const cn=canalDe(k);o[cn]=(o[cn]||0)+n;s+=n});
  const resto=(+c.total||0)-s;if(resto>1)o['Sin detallar']=(o['Sin detallar']||0)+resto});return o}
function comisiones(){return D.config.comisiones||{}}
function comisionDe(canal,monto){return monto*((+comisiones()[canal]||0)/100)}

function ventasDia(ymd){return D.cierres.filter(c=>diaLocal(c.fecha)===ymd).reduce((a,c)=>a+(+c.total||0),0)}
function ventasRango(a,b){return D.cierres.filter(c=>{const d=diaLocal(c.fecha);return d>=a&&d<=b}).reduce((s,c)=>s+(+c.total||0),0)}
function mesRango(off=0){const h=new Date(hoy()+'T12:00:00');const d=new Date(h.getFullYear(),h.getMonth()+off,1);const f=new Date(d.getFullYear(),d.getMonth()+1,0);
  const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return [iso(d),iso(f)]}
function criticos(){return D.insumos.filter(i=>i.activo!==false&&(+i.stock_minimo||0)>0&&(+i.stock||0)<=(+i.stock_minimo||0))}
function insights(){
  const out=[];const H=hoy();
  criticos().forEach(i=>out.push({r:1,t:'Stock crítico · '+i.nombre,d:`Quedan ${fnum(i.stock)} ${i.unidad} (mínimo ${fnum(i.stock_minimo)}).`,a:'#compras',al:'Pedir'}));
  D.gastosFijos.filter(g=>g.activo!==false&&g.proximo_vencimiento).forEach(g=>{const dias=Math.round((new Date(g.proximo_vencimiento+'T12:00:00')-new Date(H+'T12:00:00'))/864e5);
    if(dias<=(+g.dias_aviso||3))out.push({r:dias<0,t:(dias<0?'Vencido: ':'Vence pronto: ')+g.nombre,d:`${$$(g.monto)} · ${dias<0?'venció hace '+(-dias)+' días':dias===0?'vence hoy':'vence en '+dias+' días'}`,a:'#finanzas',al:'Pagar'})});
  const pend=D.facturas.filter(f=>f.estado==='pendiente');if(pend.length)out.push({t:`${pend.length} facturas pendientes de pago`,d:'Total '+$$(pend.reduce((a,f)=>a+(+f.total||0),0)),a:'#facturas',al:'Ver'});
  const desde=sumaDias(H,-60),porProv={};let tot=0;D.facturas.filter(f=>f.fecha&&f.fecha>=desde).forEach(f=>{porProv[f.proveedor]=(porProv[f.proveedor]||0)+(+f.total||0);tot+=(+f.total||0)});
  Object.entries(porProv).forEach(([p,v])=>{if(tot>0&&v/tot>.5)out.push({t:'Dependencia alta de '+p,d:`${fnum(v/tot*100,0)}% de tus compras de los últimos 60 días. Pedí cotización a otro proveedor para comparar.`,a:'#compras',al:'Proveedores'})});
  const caros=D.recetas.filter(r=>{const c=cmv(r);return c!=null&&c>40}).sort((a,b)=>cmv(b)-cmv(a));
  if(caros.length)out.push({t:`${caros.length} productos con costo de mercadería alto (más del 40%)`,d:caros.slice(0,4).map(r=>r.nombre+' '+fnum(cmv(r),0)+'%').join(' · '),a:'#recetas',al:'Revisar'});
  const v7=ventasDia(H),v7a=ventasDia(sumaDias(H,-7));if(v7a>0&&new Date().getHours()>=20&&v7<v7a*.8)out.push({t:'Ventas de hoy por debajo del mismo día de la semana pasada',d:`${$$(v7)} vs ${$$(v7a)}`});
  return out;
}

function ventasPorDiaSemana(){
  const nom=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],s=Array(7).fill(0),n=Array(7).fill(0),desde=sumaDias(hoy(),-56);

  Object.entries(porDia).forEach(([d,v])=>{const w=new Date(d+'T12:00:00').getDay();s[w]+=v;n[w]++});
  const prom=s.map((v,i)=>n[i]?v/n[i]:0),mx=Math.max(1,...prom);

async function guardarReceta(id){

    if(n.startsWith('📋 ')&&rec)it.receta_id=rec.id;else if(ins){it.insumo_id=ins.id;it.nombre=ins.nombre;if(!it.unidad)it.unidad=ins.unidad}else if(rec)it.receta_id=rec.id;else{errores.push(n);const prev=id&&(recMap[id].ingredientes||[]).find(x=>norm(x.nombre)===norm(n));if(prev&&prev.costo_ref)it.costo_ref=prev.costo_ref}
    ingredientes.push(it)});

  window._okErr=0;
  const sector=$('#rSec').value,ut=+$('#rUT').value||null;

    sector,unidades_tanda:ut,unidad_venta:$('#rUV').value,cuota_semanal:+$('#rCS').value||null,updated_at:new Date().toISOString()};
  let rid=id;
  if(id){const [x]=await sbUpd('recetas','id=eq.'+id,row);Object.assign(recMap[id],x)}else{const [x]=await sbIns('recetas',[row]);D.recetas.push(x);rid=x.id}

  D.recetas.sort((a,b)=>a.nombre.localeCompare(b.nombre));indexar();cerrarModal();toast('Receta guardada ✅');if(vistaActual==='recetas')vRecetas();
}

function sugerirInsumo(desc){
  const eq=D.equiv.find(e=>e.texto===norm(desc));if(eq&&insMap[eq.insumo_id])return insMap[eq.insumo_id];
  if(insByName[norm(desc)])return insByName[norm(desc)];
  const tk=norm(desc).split(/[^a-z0-9]+/).filter(t=>t.length>2&&!/^\d+$/.test(t));let mejor=null,mp=0;
  D.insumos.forEach(i=>{const n=norm(i.nombre);const p=tk.filter(t=>n.includes(t)).length;if(p>mp){mp=p;mejor=i}});
  return mp>=2||(mp===1&&tk.length===1)?mejor:null;
}

function filaFI(it){const s=it.sug;return `<tr><td style="min-width:160px"><input class="fiD" value="${esc(it.descripcion||'')}"></td><td style="min-width:180px"><input class="fiI" list="dlIns" value="${esc(s?s.nombre:(it.descripcion||''))}" style="${s?'':'border-color:var(--naranja)'}" oninput="calcFI(this.closest('tr'))"></td>
  <td><input class="fiB mini" type="number" step="any" value="${it.bultos??''}" oninput="calcFI(this.closest('tr'))"></td><td><input class="fiK mini" type="number" step="any" value="${it.contenido_por_bulto??1}" oninput="calcFI(this.closest('tr'))"></td>
  <td><select class="fiU" style="width:100px"><option>kg</option><option ${it.unidad_base==='litros'?'selected':''}>litros</option><option ${it.unidad_base==='unidades'?'selected':''}>unidades</option></select></td>
  <td><input class="fiT mini" type="number" step="any" value="${it.total_linea??''}" oninput="calcFI(this.closest('tr'));chequeoTotal()"></td><td class="fiPU num muted"></td><td><button class="btn sec peq" onclick="this.closest('tr').remove();chequeoTotal()">×</button></td></tr>`}
function calcFI(tr){const q=(+tr.querySelector('.fiB').value||0)*(+tr.querySelector('.fiK').value||0),t=+tr.querySelector('.fiT').value||0;const pu=q?t/q:0;
  const ins=insByName[norm(tr.querySelector('.fiI').value)];let extra='';
  if(ins){tr.querySelector('.fiI').style.borderColor='';if(+ins.costo_unitario>0&&pu>0){const d=(pu-ins.costo_unitario)/ins.costo_unitario*100;if(Math.abs(d)>=15)extra=`<br><span class="chip ${d>0?'mal':'ok'}">${pct(d)}</span>`}}
  else{tr.querySelector('.fiI').style.borderColor='var(--naranja)';if(tr.querySelector('.fiI').value.trim())extra='<br><span class="chip med">insumo nuevo</span>'}
  tr.querySelector('.fiPU').innerHTML=pu?$$(pu)+extra:'';}
function chequeoTotal(){const s=[...document.querySelectorAll('#tFI .fiT')].reduce((a,e)=>a+(+e.value||0),0);const t=+($('#fTot')||{}).value||0;
  if($('#fChk'))$('#fChk').innerHTML=t?`Suma de ítems: ${$$(s)} · Total factura: ${$$(t)} ${Math.abs(s-t)>Math.max(50,t*.02)?'<span class="chip med">no coinciden, revisá</span>':'<span class="chip ok">ok</span>'}`:''}
async function guardarFactura(){
  const prov=$('#fP').value.trim(),num=$('#fN').value.trim();if(!prov)return toast('Falta el proveedor');
  if(num&&D.facturas.some(f=>norm(f.proveedor)===norm(prov)&&norm(f.numero)===norm(num)))return toast('⚠️ Esa factura ya está cargada ('+prov+' '+num+')',6000);
  $('#bGF').disabled=true;
  try{
  const items=[];
  for(const [k,tr] of [...document.querySelectorAll('#tFI tr')].entries()){if(!k)continue;
    const desc=tr.querySelector('.fiD').value.trim(),insN=tr.querySelector('.fiI').value.trim();const b=+tr.querySelector('.fiB').value||0,kk=+tr.querySelector('.fiK').value||0,tot=+tr.querySelector('.fiT').value||0,u=tr.querySelector('.fiU').value;
    if(!desc&&!insN)continue;items.push({descripcion:desc||insN,insN,bultos:b,contenido:kk,cantidad_base:b*kk,unidad:u,total:tot})}
  const actualizar=$('#fStock').checked;
  if(!D.proveedores.some(p=>norm(p.nombre)===norm(prov))){const [p]=await sbIns('proveedores',[{nombre:prov}]);D.proveedores.push(p)}
  let suba=[];
  for(const it of items){let ins=insByName[norm(it.insN)];
    if(!ins&&it.insN&&actualizar){[ins]=await sbIns('insumos',[{nombre:it.insN,unidad:it.unidad,categoria:$('#fCat').value,proveedor:prov,stock:0,costo_unitario:0}]);D.insumos.push(ins);indexar()}
    if(!ins)continue;it.insumo_id=ins.id;
    if(it.descripcion&&norm(it.descripcion)!==norm(ins.nombre)){await sbIns('equivalencias',[{texto:norm(it.descripcion),insumo_id:ins.id,updated_at:new Date().toISOString()}],true);D.equiv=D.equiv.filter(e=>e.texto!==norm(it.descripcion));D.equiv.push({texto:norm(it.descripcion),insumo_id:ins.id})}
    if(actualizar&&it.cantidad_base>0){const pu=it.total/it.cantidad_base;if(+ins.costo_unitario>0&&pu>ins.costo_unitario*1.15)suba.push(ins.nombre+' '+pct((pu-ins.costo_unitario)/ins.costo_unitario*100));
      const patch={stock:Math.round(((+ins.stock||0)+it.cantidad_base)*1000)/1000,proveedor:prov,updated_at:new Date().toISOString()};if(pu>0)patch.costo_unitario=Math.round(pu*100)/100;
      const [x]=await sbUpd('insumos','id=eq.'+ins.id,patch);Object.assign(ins,x)}}
  const row={proveedor:prov,numero:num,tipo:$('#fT').value.trim(),fecha:$('#fF').value||null,subtotal:+$('#fSub').value||null,impuestos:+$('#fImp').value||0,total:+$('#fTot').value||items.reduce((a,i)=>a+i.total,0),
    condicion_pago:$('#fC').value,categoria:$('#fCat').value,estado:$('#fC').value==='Contado'?'pagada':'pendiente',impacta_stock:actualizar,
    items:items.map(i=>({nombre:i.descripcion,insumo_id:i.insumo_id||null,bultos:i.bultos,contenido_por_empaque:i.contenido,cantidad_base:i.cantidad_base,unidad:i.unidad,total:i.total}))};
  const [f]=await sbIns('facturas',[row]);D.facturas.unshift(f);indexar();cerrarModal();
  toast(suba.length?'Factura guardada. ⚠️ Subieron: '+suba.join(', '):'Factura guardada ✅ '+(actualizar?'Stock y costos actualizados.':''),suba.length?9000:3000);
  if(vistaActual==='facturas')vFacturas();
  }catch(e){console.error(e);$('#bGF').disabled=false}
}

    ${D.mapeo.map((m,k)=>{const r=m.receta_id&&recMap[m.receta_id];const ct=r&&+m.unidades_por_tanda?costoUnit(r)*m.unidades_por_tanda:null;return `<tr><td>${esc(m.sector)}</td><td><b>${esc(m.producto)}</b></td><td><input id="mr${k}" list="dlRecs" value="${r?'📋 '+esc(r.nombre):''}" style="${r?'':'border-color:var(--rojo)'}"></td><td><input id="mu${k}" class="mini" type="number" step="any" value="${m.unidades_por_tanda??''}"></td><td class="num">${ct!=null?$$(ct):'—'}</td><td><button class="btn peq" onclick="guardarMapeo(${k})">Guardar</button></td></tr>`}).join('')}</table></div>`}
  if(t==='manual'){html+=`<div class="card" style="max-width:560px"><h3>Registrar producción a mano</h3><p class="muted">Para lo que no se carga desde un sector. Descuenta los insumos de la receta.</p>${opcionesIngredientes().replace('id="dlIng"','id="dlRecs2"').replace(/<option value="(?!📋)[^"]*">[^<]*<\/option>/g,'')}
    <label>Receta</label><input id="pmR" list="dlRecs2"><div class="fila"><div><label>Unidades producidas</label><input id="pmU" type="number" step="any"></div><div><label>Sector</label><select id="pmS"><option>panaderia</option><option>pasteleria</option><option>cocina</option><option>otro</option></select></div></div>

}
function verProduccion(id){const p=D.produccion.find(x=>x.id===id);
  modal(`<h3>${esc(p.producto)} <span class="muted">· ${esc(p.sector)}</span></h3><p class="muted">${new Date(p.fecha).toLocaleString('es-AR')} · ${fnum(p.tandas)} tanda(s) · ${p.unidades!=null?fnum(p.unidades)+' unidades':''} ${p.receta_id&&recMap[p.receta_id]?'· receta '+esc(recMap[p.receta_id].nombre):''}</p>
  <table><tr><th>Insumo</th><th class="num">Descontado</th><th class="num">Stock actual</th></tr>${(p.detalle||[]).map(d=>{const i=insMap[d.insumo_id];return `<tr><td>${i?esc(i.nombre):'?'}</td><td class="num">${fnum(d.cantidad,3)} ${i?esc(i.unidad):''}</td><td class="num ${i&&+i.stock<0?'down':''}">${i?fnum(i.stock):''}</td></tr>`}).join('')}</table>
  <p><b>Costo: ${$$(p.costo)}</b></p>`)}
async function guardarMapeo(k){const m=D.mapeo[k];const n=$('#mr'+k).value.replace(/^📋 /,'').trim();const r=n?recByName[norm(n)]:null;if(n&&!r)return toast('No encontré esa receta. Elegila de la lista.');
  const u=$('#mu'+k).value===''?null:+$('#mu'+k).value;
  await sb('produccion_mapeo?sector=eq.'+encodeURIComponent(m.sector)+'&producto=eq.'+encodeURIComponent(m.producto),{method:'PATCH',body:{receta_id:r?r.id:null,unidades_por_tanda:u},prefer:'return=minimal'});
  m.receta_id=r?r.id:null;m.unidades_por_tanda=u;toast('Vinculado ✅');vProduccion()}
async function aplicarPendientes(){const pend=D.produccion.filter(p=>p.estado==='sin_receta');let ok=0,no=0;
  for(const p of pend){const mp=D.mapeo.find(m=>m.sector===p.sector&&norm(m.producto)===norm(p.producto));if(!(mp&&mp.receta_id)&&!recByName[norm(p.producto)]){no++;continue}
    const x=await rpcProduccion(p.sector,p.producto,+p.tandas||1,p.unidades!=null?+p.unidades:null,null);
    if(x&&x.ok){ok++;await sbDel('produccion','id=eq.'+p.id)}else{no++;if(x&&x.id)await sbDel('produccion','id=eq.'+x.id)}}
  await recargarProduccion();toast(`Aplicadas ${ok}. ${no?no+' siguen sin receta.':''}`,5000);vProduccion()}

// ================= PRODUCTOS DE VENTA =================
// Lista de productos que se venden en el local (mismos códigos que la caja) y
// vínculo entre el nombre con que llega cada producto de los sectores y el producto de venta.
// El Salón usa esta lista para el Control diario.
const normV=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let PV={prods:[],alias:[],llegadas:[],cargado:false},tabPV='vinc',fPV='';
async function cargarPV(){
  const [p,a,r,m]=await Promise.all([sbGet('productos_venta','order=nombre'),sbGet('productos_venta_alias','order=alias'),
    sb('salon_recepciones?select=producto_nombre,sector_origen,created_at&created_at=gte.'+sumaDias(hoy(),-120)+'&order=created_at.desc&limit=3000'),
    sbGet('produccion_mapeo','order=sector,producto')]);
  const ll={};
  (r||[]).forEach(x=>{const k=normV(x.producto_nombre);if(!k)return;if(!ll[k])ll[k]={k,nombre:x.producto_nombre,sectores:new Set(),veces:0,ultima:x.created_at};ll[k].veces++;ll[k].sectores.add(x.sector_origen||'')});
  (m||[]).forEach(x=>{const k=normV(x.producto);if(!k)return;if(!ll[k])ll[k]={k,nombre:x.producto,sectores:new Set(),veces:0,ultima:null};ll[k].sectores.add(x.sector)});
  PV={prods:p||[],alias:a||[],llegadas:Object.values(ll),cargado:true};
}
function pvPorCod(c){return PV.prods.find(p=>p.codigo===c)}
function pvAliasDe(k){return PV.alias.find(a=>a.alias===k)}
function pvOpciones(){return `<datalist id="dlPV">${PV.prods.filter(p=>p.activo).map(p=>`<option value="${esc(p.codigo+' · '+p.nombre)}">`).join('')}</datalist>`}
function pvLeer(v){v=(v||'').trim();if(!v)return null;const c=v.split('·')[0].trim();return pvPorCod(c)||PV.prods.find(p=>norm(p.nombre)===norm(v))||null}

async function vVenta(){
  if(!PV.cargado){$('#app').innerHTML='<div class="cargando">Cargando productos de venta…</div>';try{await cargarPV()}catch(e){$('#app').innerHTML='<div class="card">No se pudo cargar: '+esc(e.message)+'</div>';return}}
  const pvSinV=l=>!pvAliasDe(l.k)&&!PV.prods.some(p=>normV(p.nombre)===l.k);
  const sinV=PV.llegadas.filter(l=>l.veces>0&&pvSinV(l));
  const t=tabPV;
  let html=`<h2>🏷️ Productos de venta</h2><p class="muted">La lista de lo que se vende en el local, con los mismos códigos y precios que la caja. Acá vinculás el nombre con que cada sector manda un producto al Salón con el producto de venta, así el Control diario del Salón suma solo los ingresos.</p>
  <div class="grid g4" style="margin-bottom:12px"><div class="card kpi"><div class="lbl">Productos de venta</div><div class="val">${PV.prods.filter(p=>p.activo).length}</div></div>
  <div class="card kpi"><div class="lbl">Nombres vinculados</div><div class="val">${PV.alias.length}</div></div>
  <div class="card kpi"><div class="lbl">Llegan al Salón sin vincular</div><div class="val" style="color:${sinV.length?'var(--rojo)':'var(--verde)'}">${sinV.length}</div><div class="sub muted">no suman en el Control</div></div></div>
  <div class="tabs2">${[['vinc','Vincular'+(sinV.length?' ('+sinV.length+')':'')],['prods','Lista de productos']].map(([k,n])=>`<button class="${t===k?'on':''}" onclick="tabPV='${k}';vVenta()">${n}</button>`).join('')}</div>`;
  if(t==='vinc'){
    const rk=l=>l.veces>0?(pvSinV(l)?0:1):2;
    const filas=[...PV.llegadas].sort((a,b)=>(rk(a)-rk(b))||(b.veces-a.veces)||a.nombre.localeCompare(b.nombre));
    html+=`${pvOpciones()}<p class="muted">Estos son los nombres con que los sectores mandaron productos al Salón (últimos 4 meses) y los productos que registran en producción. Elegí a qué producto de venta corresponde cada uno. Si un nombre agrupa varios productos (ej. "Vigilantes + Medialuna grasa"), elegí el que se cobra en la caja.</p>
    <div class="card scroll"><table><tr><th>Nombre que llega</th><th>Sector</th><th class="num">Veces</th><th>Producto de venta</th><th></th></tr>
    ${filas.map((l,k)=>{const sep=(l.veces===0&&(k===0||filas[k-1].veces>0))?`<tr><td colspan="5" style="background:#f6f6f6;font-weight:700">Productos de los sectores que todavía no llegaron al Salón (opcional vincularlos ya)</td></tr>`:'';const a=pvAliasDe(l.k);const dir=!a&&PV.prods.find(p=>normV(p.nombre)===l.k);const p=a?pvPorCod(a.codigo):dir;
      return sep+`<tr><td><b>${esc(l.nombre)}</b></td><td>${esc([...l.sectores].filter(Boolean).join(', '))}</td><td class="num">${l.veces||'—'}</td>
      <td><input id="pva${k}" list="dlPV" value="${p?esc(p.codigo+' · '+p.nombre):''}" placeholder="Elegí el producto…" style="min-width:240px;${p||!l.veces?'':'border-color:var(--rojo)'}">${dir?'<div class="muted" style="font-size:11px">coincide por nombre</div>':''}</td>
      <td style="white-space:nowrap"><button class="btn peq" onclick="pvGuardarVinc(${k})">Guardar</button>${a?` <button class="btn peq sec" onclick="pvQuitarVinc('${esc(a.alias)}')">Quitar</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Todavía no llegó nada al Salón.</td></tr>'}
    </table></div>
    <div class="card" style="max-width:640px;margin-top:12px"><h3>Vincular otro nombre</h3><p class="muted">Para un producto que todavía no se mandó nunca.</p>
    <div class="fila"><div><label>Nombre como lo manda el sector</label><input id="pvNn" placeholder="Ej: Medialunas de manteca"></div><div><label>Producto de venta</label><input id="pvNp" list="dlPV"></div></div>
    <div class="acciones" style="margin-top:10px"><button class="btn" onclick="pvVincularNuevo()">Vincular</button></div></div>`;
    PV._filas=filas;
  }
  if(t==='prods'){
    const q=norm(fPV);const lista=PV.prods.filter(p=>!q||norm(p.nombre).includes(q)||p.codigo===fPV.trim());
    html+=`<div class="acciones" style="margin-bottom:10px"><input placeholder="Buscar por nombre o código…" value="${esc(fPV)}" oninput="fPV=this.value;clearTimeout(window._tpv);window._tpv=setTimeout(()=>{vVenta();const i=document.querySelector('#app input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)" style="max-width:320px"><button class="btn" onclick="pvEditar(null)">➕ Nuevo producto</button></div>
    <div class="card scroll"><table><tr><th>Código</th><th>Producto</th><th>Tipo</th><th class="num">Mayorista</th><th class="num">Local (LPU)</th><th class="num">PedidosYa</th><th class="num">Nombres vinculados</th><th>Estado</th></tr>
    ${lista.map(p=>{const n=PV.alias.filter(a=>a.codigo===p.codigo).length;return `<tr class="click" onclick="pvEditar('${esc(p.codigo)}')" style="${p.activo?'':'opacity:.5'}"><td>${esc(p.codigo)}</td><td><b>${esc(p.nombre)}</b></td><td>${esc(p.tipo||'')}</td>
      <td class="num">${p.precio_may!=null?$$(p.precio_may):'—'}</td><td class="num">${p.precio_lpu!=null?$$(p.precio_lpu):'—'}</td><td class="num">${p.precio_pey!=null?$$(p.precio_pey):'—'}</td><td class="num">${n||'—'}</td><td>${p.activo?'<span class="chip ok">activo</span>':'<span class="chip neu">de baja</span>'}</td></tr>`}).join('')}
    </table></div>`;
  }
  $('#app').innerHTML=html;
}
async function pvGuardarVinc(k){const l=PV._filas[k];const v=$('#pva'+k).value;const p=pvLeer(v);
  if(v.trim()&&!p)return toast('No encontré ese producto. Elegilo de la lista.');
  if(!p){const a=pvAliasDe(l.k);if(a)return pvQuitarVinc(a.alias);return toast('Elegí un producto de venta');}
  const [x]=await sbIns('productos_venta_alias?on_conflict=alias',[{alias:l.k,codigo:p.codigo}],true);
  PV.alias=PV.alias.filter(a=>a.alias!==l.k).concat([x]);toast('Vinculado ✅ '+l.nombre+' → '+p.nombre);vVenta()}
async function pvQuitarVinc(alias){await sbDel('productos_venta_alias','alias=eq.'+encodeURIComponent(alias));PV.alias=PV.alias.filter(a=>a.alias!==alias);toast('Vínculo quitado');vVenta()}
async function pvVincularNuevo(){const n=normV($('#pvNn').value);const p=pvLeer($('#pvNp').value);if(!n)return toast('Escribí el nombre');if(!p)return toast('Elegí el producto de venta de la lista');
  const [x]=await sbIns('productos_venta_alias?on_conflict=alias',[{alias:n,codigo:p.codigo}],true);PV.alias=PV.alias.filter(a=>a.alias!==n).concat([x]);
  if(!PV.llegadas.find(l=>l.k===n))PV.llegadas.push({k:n,nombre:$('#pvNn').value.trim(),sectores:new Set(),veces:0});toast('Vinculado ✅');vVenta()}
function pvEditar(cod){const p=cod?pvPorCod(cod):{codigo:'',nombre:'',tipo:'Artículo',precio_may:null,precio_lpu:null,precio_pey:null,activo:true};
  const al=cod?PV.alias.filter(a=>a.codigo===cod):[];
  const nv=v=>v==null?'':v;
  modal(`<h3>${cod?'Editar producto de venta':'Nuevo producto de venta'}</h3>
  <div class="fila"><div><label>Código (el de la caja)</label><input id="pvC" value="${esc(p.codigo)}" ${cod?'disabled':''}></div><div><label>Tipo</label><select id="pvT">${['Artículo','Combo'].map(x=>`<option ${x===p.tipo?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <label>Nombre</label><input id="pvN" value="${esc(p.nombre)}">
  <div class="fila"><div><label>Precio mayorista</label><input id="pvM" type="number" step="any" value="${nv(p.precio_may)}"></div><div><label>Precio local (LPU)</label><input id="pvL" type="number" step="any" value="${nv(p.precio_lpu)}"></div><div><label>Precio PedidosYa</label><input id="pvP" type="number" step="any" value="${nv(p.precio_pey)}"></div></div>
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="pvA" ${p.activo?'checked':''} style="width:auto"> Activo (se vende y aparece en el Control del Salón)</label>
  ${cod?`<h4 style="margin-top:14px">Nombres vinculados</h4>${al.length?al.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #eee"><span>${esc(a.alias)}</span><button class="btn peq sec" onclick="pvQuitarVinc('${esc(a.alias)}').then(()=>pvEditar('${esc(cod)}'))">Quitar</button></div>`).join(''):'<p class="muted">Ninguno todavía. Se vinculan desde la pestaña "Vincular".</p>'}`:''}
  <div class="acciones" style="margin-top:14px"><button class="btn" id="bPV">💾 Guardar</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`);
  $('#bPV').onclick=async()=>{const num=id=>$(id).value===''?null:+$(id).value;
    const row={codigo:cod||$('#pvC').value.trim(),nombre:$('#pvN').value.trim(),tipo:$('#pvT').value,precio_may:num('#pvM'),precio_lpu:num('#pvL'),precio_pey:num('#pvP'),activo:$('#pvA').checked,updated_at:new Date().toISOString()};
    if(!row.codigo||!row.nombre)return toast('Completá código y nombre');
    if(!cod&&pvPorCod(row.codigo))return toast('Ya existe un producto con el código '+row.codigo);
    const [x]=cod?await sbUpd('productos_venta','codigo=eq.'+encodeURIComponent(cod),row):await sbIns('productos_venta',[row]);
    PV.prods=PV.prods.filter(q=>q.codigo!==x.codigo).concat([x]).sort((a,b)=>a.nombre.localeCompare(b.nombre));cerrarModal();toast('Guardado ✅');vVenta()};
}

}
async function ajusteInsumo(id,campo,v){const [x]=await sbUpd('insumos','id=eq.'+id,{[campo]:+v||0,updated_at:new Date().toISOString()});Object.assign(insMap[id],x);toast('Guardado ✅',1200)}
function editarInsumo(id){
  const i=id?insMap[id]:{nombre:'',unidad:'kg',categoria:'ALIMENTOS',stock:0,stock_minimo:0,stock_optimo:0,costo_unitario:0};
  modal(`<h2>${id?'Editar':'Nuevo'} insumo</h2><datalist id="dlProv">${D.proveedores.map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist>
  <div class="fila"><div><label>Nombre</label><input id="iN" value="${esc(i.nombre)}"></div><div><label>Unidad</label><select id="iU">${['kg','litros','unidades'].map(u=>`<option ${norm(i.unidad).startsWith(u.slice(0,3))?'selected':''}>${u}</option>`).join('')}</select></div></div>

// ================= COMPRAS =================
let tabCompras='sug';
function sugerencias(){
  const g={};criticos().forEach(i=>{const obj=Math.max(+i.stock_optimo||0,(+i.stock_minimo||0)*2);const q=Math.max(0,Math.ceil((obj-(+i.stock||0))*100)/100);if(!q)return;
    const p=i.proveedor||'Sin proveedor';(g[p]=g[p]||[]).push({insumo_id:i.id,nombre:i.nombre,unidad:i.unidad,cantidad:q,costo:+i.costo_unitario||0})});return g;}
function vCompras(){
  const t=tabCompras;
  let html=`<h2>🛒 Compras</h2><div class="tabs2">${[['sug','Pedidos sugeridos'],['ped','Pedidos'],['prov','Proveedores']].map(([k,n])=>`<button class="${t===k?'on':''}" onclick="tabCompras='${k}';vCompras()">${n}</button>`).join('')}</div>`;
  if(t==='sug'){const g=sugerencias();const ks=Object.keys(g);
    html+=`<p class="muted">Se sugiere pedir lo que está por debajo del mínimo, hasta llegar al óptimo (o al doble del mínimo). Configurá los mínimos en Inventario.</p>
    <div class="acciones"><button class="btn sec" onclick="nuevoPedido()">✍️ Pedido manual</button></div>
    ${ks.length?`<div class="grid g2">${ks.map(p=>{const it=g[p],tot=it.reduce((a,x)=>a+x.cantidad*x.costo,0);return `<div class="card"><h3>${esc(p)}</h3><table>${it.map(x=>`<tr><td>${esc(x.nombre)}</td><td class="num">${fnum(x.cantidad)} ${esc(x.unidad)}</td><td class="num">${$$(x.cantidad*x.costo)}</td></tr>`).join('')}<tr><td colspan="2"><b>Total estimado</b></td><td class="num"><b>${$$(tot)}</b></td></tr></table>
    <div class="acciones" style="margin-top:10px"><button class="btn" onclick='crearPedido(${JSON.stringify(p)},${JSON.stringify(it).replace(/'/g,"&#39;")})'>Crear pedido</button></div></div>`}).join('')}</div>`:'<div class="card"><p class="muted">No hay nada para pedir ahora 👌</p></div>'}`}
  if(t==='ped'){html+=`<div class="acciones"><button class="btn" onclick="nuevoPedido()">➕ Nuevo pedido</button></div><div class="card scroll"><table><tr><th>Fecha</th><th>Proveedor</th><th class="num">Ítems</th><th class="num">Total est.</th><th>Estado</th><th></th></tr>
    ${D.pedidos.map(p=>`<tr><td>${fechaCorta(p.created_at)}</td><td>${esc(p.proveedor)}</td><td class="num">${(p.items||[]).length}</td><td class="num">${$$(p.total)}</td><td><span class="chip ${p.estado==='recibido'?'ok':p.estado==='enviado'?'med':'neu'}">${esc(p.estado)}</span></td>
    <td style="white-space:nowrap"><button class="btn sec peq" onclick="textoPedido('${p.id}')">📋 Texto</button> ${p.estado==='borrador'?`<button class="btn sec peq" onclick="estadoPedido('${p.id}','enviado')">Enviado</button>`:''} ${p.estado!=='recibido'?`<button class="btn peq" onclick="recibirPedido('${p.id}')">Recibido</button> <button class="btn sec peq" onclick="confirmar('¿Borrar el pedido?',async()=>{await sbDel('compras_pedidos','id=eq.${p.id}');D.pedidos=D.pedidos.filter(x=>x.id!=='${p.id}');vCompras()})">×</button>`:''}</td></tr>`).join('')}</table>${D.pedidos.length?'':'<p class="muted">Todavía no hay pedidos.</p>'}</div>`}
  if(t==='prov'){const gasto={};const d=sumaDias(hoy(),-90);D.facturas.filter(f=>f.fecha&&f.fecha>=d).forEach(f=>gasto[norm(f.proveedor)]=(gasto[norm(f.proveedor)]||0)+(+f.total||0));
    html+=`<div class="acciones"><button class="btn" onclick="editarProveedor()">➕ Nuevo proveedor</button></div><div class="card scroll"><table><tr><th>Proveedor</th><th>Contacto</th><th>Teléfono</th><th>Condición</th><th class="num">Compras 90 días</th></tr>
    ${D.proveedores.filter(p=>p.activo!==false).sort((a,b)=>(gasto[norm(b.nombre)]||0)-(gasto[norm(a.nombre)]||0)).map(p=>`<tr class="click" onclick="editarProveedor('${p.id}')"><td><b>${esc(p.nombre)}</b></td><td>${esc(p.contacto||'')}</td><td>${esc(p.telefono||'')}</td><td>${esc(p.condicion_pago||'')}</td><td class="num">${$$(gasto[norm(p.nombre)]||0)}</td></tr>`).join('')}</table></div>`}
  $('#app').innerHTML=html;
}
async function crearPedido(prov,items){const tot=items.reduce((a,x)=>a+x.cantidad*x.costo,0);const [p]=await sbIns('compras_pedidos',[{proveedor:prov,items,total:Math.round(tot)}]);D.pedidos.unshift(p);tabCompras='ped';vCompras();textoPedido(p.id)}
function textoPedido(id){const p=D.pedidos.find(x=>x.id===id);const txt=`Hola! Te paso el pedido de Poly Artesanal (Galván 3512):\n`+(p.items||[]).map(i=>`• ${i.nombre}: ${fnum(i.cantidad)} ${i.unidad}`).join('\n')+`\nGracias!`;
  const prov=D.proveedores.find(x=>norm(x.nombre)===norm(p.proveedor));const tel=prov&&prov.telefono?prov.telefono.replace(/\D/g,''):'';
  modal(`<h3>Texto para mandar a ${esc(p.proveedor)}</h3><textarea id="txP" rows="10">${esc(txt)}</textarea><div class="acciones" style="margin-top:10px"><button class="btn" onclick="navigator.clipboard.writeText($('#txP').value).then(()=>toast('Copiado ✅'))">📋 Copiar</button>${tel?`<a class="btn oro" style="text-decoration:none" target="_blank" href="https://wa.me/${tel}?text=${encodeURIComponent(txt)}">WhatsApp</a>`:''}</div>`)}
async function estadoPedido(id,e){await sbUpd('compras_pedidos','id=eq.'+id,{estado:e});D.pedidos.find(p=>p.id===id).estado=e;vCompras()}
function recibirPedido(id){const p=D.pedidos.find(x=>x.id===id);
  modal(`<h3>Recibir pedido de ${esc(p.proveedor)}</h3><p class="muted">Corregí lo que llegó realmente. Se suma al stock. (Si después cargás la factura, destildá "Sumar al stock" para no sumarlo dos veces.)</p>
  <table>${(p.items||[]).map((i,k)=>`<tr><td>${esc(i.nombre)}</td><td><input class="mini rcv" data-k="${k}" type="number" step="any" value="${i.cantidad}"> ${esc(i.unidad)}</td></tr>`).join('')}</table>
  <div class="acciones" style="margin-top:10px"><button class="btn" id="bRc">✅ Confirmar recepción</button></div>`);
  $('#bRc').onclick=async()=>{for(const e of document.querySelectorAll('.rcv')){const it=p.items[+e.dataset.k];const ins=insMap[it.insumo_id]||insByName[norm(it.nombre)];const q=+e.value||0;it.recibido=q;
    if(ins&&q){const [x]=await sbUpd('insumos','id=eq.'+ins.id,{stock:Math.round(((+ins.stock||0)+q)*1000)/1000,updated_at:new Date().toISOString()});Object.assign(ins,x)}}
    await sbUpd('compras_pedidos','id=eq.'+id,{estado:'recibido',items:p.items});p.estado='recibido';cerrarModal();toast('Stock actualizado ✅');vCompras()};}
function nuevoPedido(){
  modal(`<h3>Nuevo pedido</h3><datalist id="dlProv">${D.proveedores.map(p=>`<option value="${esc(p.nombre)}">`).join('')}</datalist><datalist id="dlIns">${D.insumos.map(i=>`<option value="${esc(i.nombre)}">`).join('')}</datalist>
  <label>Proveedor</label><input id="npP" list="dlProv"><table id="tNP" style="margin-top:8px"><tr><th>Insumo</th><th>Cantidad</th></tr>${'<tr><td><input class="npI" list="dlIns"></td><td><input class="npC mini" type="number" step="any"></td></tr>'.repeat(4)}</table>
  <button class="btn sec peq" onclick="document.querySelector('#tNP tbody').insertAdjacentHTML('beforeend','<tr><td><input class=npI list=dlIns></td><td><input class=\\'npC mini\\' type=number step=any></td></tr>')">+ fila</button>

function editarProveedor(id){const p=id?D.proveedores.find(x=>x.id===id):{};

// ================= FINANZAS =================
let perFin=0;
function costoVentaItem(i){const m=recetaDeVenta(i.producto);if(!m)return null;let u=+i.cantidad||0;if(i.unidad==='kg'&&m.peso>0)u=u/m.peso;return {costo:u*costoUnit(m.receta),seccion:m.receta.seccion||'OTROS'}}
function vFinanzas(){
  const [a,b]=mesRango(perFin);const nombreMes=new Date(a+'T12:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const cier=D.cierres.filter(c=>{const d=diaLocal(c.fecha);return d>=a&&d<=b});
  const fac=D.facturas.filter(f=>f.fecha&&f.fecha>=a&&f.fecha<=b);const gas=D.gastos.filter(g=>g.fecha>=a&&g.fecha<=b);
  const ing=cier.reduce((s,c)=>s+(+c.total||0),0),gF=fac.reduce((s,f)=>s+(+f.total||0),0),gM=gas.reduce((s,g)=>s+(+g.monto||0),0);
  const pc=porCanal(cier);const totCom=Object.entries(pc).reduce((s,[k,v])=>s+comisionDe(k,v),0);
  const egr=gF+gM+totCom,util=ing-egr;const ef=pc['Efectivo']||0,on=ing-ef;
  const dias=new Set(cier.map(c=>diaLocal(c.fecha))).size;
  // contribución por sección (según productos cargados)
  const sec={};let conItems=0,sinRec=0;cier.forEach(c=>(c.items||[]).forEach(i=>{conItems+=+i.total||0;const x=costoVentaItem(i);const k=x?x.seccion:'Sin receta';sec[k]=sec[k]||{v:0,c:0,n:0};sec[k].v+=+i.total||0;if(x)sec[k].c+=x.costo;else sinRec+=+i.total||0}));
  // semanas
  const l0=lunes(hoy()),sem=[];for(let k=7;k>=0;k--){const d0=sumaDias(l0,-7*k),d1=sumaDias(d0,6);const cs=D.cierres.filter(c=>{const d=diaLocal(c.fecha);return d>=d0&&d<=d1});const p=porCanal(cs);const t=cs.reduce((s,c)=>s+(+c.total||0),0);sem.push({d0,t,ef:p['Efectivo']||0})}
  const mxS=Math.max(1,...sem.map(x=>x.t));
  const mov=[...cier.map(c=>({f:diaLocal(c.fecha),d:'Venta '+(c.turno||''),m:+c.total,t:'i'})),...fac.map(f=>({f:f.fecha,d:'Factura '+f.proveedor,m:-f.total,t:'f'})),...gas.map(g=>({f:g.fecha,d:g.concepto+(g.categoria?' ('+g.categoria+')':''),m:-g.monto,t:'g',id:g.id}))].sort((x,y)=>y.f.localeCompare(x.f));
  window._movFin=mov;
  const ultimos=[];for(let i=0;i<14;i++){const d=sumaDias(hoy(),-i);const cs=D.cierres.filter(c=>diaLocal(c.fecha)===d);if(!cs.length&&i>0)continue;const p=porCanal(cs);ultimos.push({d,p,t:cs.reduce((s,c)=>s+(+c.total||0),0)})}
  const canalesUsados=CANALES.concat(['Sin detallar']).filter(c=>pc[c]);
  $('#app').innerHTML=`<h2>💰 Finanzas</h2>
  <div class="acciones"><button class="btn" onclick="nuevoCierre()">💵 Cargar venta del día</button><button class="btn sec" onclick="nuevoGasto()">➖ Registrar gasto</button><button class="btn sec" onclick="editarComisiones()">⚙️ Comisiones</button><button class="btn sec" onclick="exportarCSV()">⬇️ Exportar (CSV)</button>
  <select style="max-width:200px" onchange="perFin=+this.value;vFinanzas()">${[0,-1,-2,-3,-4,-5].map(o=>{const [x]=mesRango(o);return `<option value="${o}" ${o===perFin?'selected':''}>${new Date(x+'T12:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</option>`}).join('')}</select></div>
  <div class="grid g4"><div class="card kpi"><div class="lbl">Ventas · ${nombreMes}</div><div class="val">${$$(ing)}</div><div class="sub muted">${dias} días cargados · promedio ${$$(dias?ing/dias:0)}/día</div></div>
  <div class="card kpi"><div class="lbl">💵 Efectivo</div><div class="val">${$$(ef)}</div><div class="sub muted">${ing?fnum(ef/ing*100,1)+'% de la venta':''}</div></div>
  <div class="card kpi"><div class="lbl">📱 Online / digital</div><div class="val">${$$(on)}</div><div class="sub muted">${ing?fnum(on/ing*100,1)+'% de la venta':''}${totCom?' · comisiones −'+$$(totCom):''}</div></div>
  <div class="card kpi"><div class="lbl">Resultado del mes</div><div class="val" style="color:${util>=0?'var(--verde)':'var(--rojo)'}">${$$(util)}</div><div class="sub muted">${ing?'margen '+fnum(util/ing*100,1)+'%':''}</div></div></div>
  <div class="card" style="margin-top:12px"><h3>🧮 Cómo se arma el resultado</h3><table>
   <tr><td>Ventas</td><td class="num">${$$(ing)}</td><td class="num muted">100%</td></tr>
   <tr><td>− Comisiones de cobro (estimadas)</td><td class="num down">${$$(-totCom)}</td><td class="num muted">${ing?fnum(totCom/ing*100,1)+'%':''}</td></tr>
   <tr><td>− Compras a proveedores (facturas del mes)</td><td class="num down">${$$(-gF)}</td><td class="num muted">${ing?fnum(gF/ing*100,1)+'%':''}</td></tr>
   <tr><td>− Otros gastos (sueldos, servicios, fijos pagados)</td><td class="num down">${$$(-gM)}</td><td class="num muted">${ing?fnum(gM/ing*100,1)+'%':''}</td></tr>
   <tr><td><b>= Resultado</b></td><td class="num"><b>${$$(util)}</b></td><td class="num"><b>${ing?fnum(util/ing*100,1)+'%':''}</b></td></tr></table>
   <p class="muted">Ojo: las facturas cuentan el mes en que se compró, aunque la mercadería se use después. Si no cargás sueldos y gastos fijos, el resultado va a aparecer más alto de lo real.</p></div>
  <div class="grid g2" style="margin-top:12px">
  <div class="card"><h3>📊 Venta por canal de cobro</h3>${canalesUsados.length?`<table><tr><th>Canal</th><th class="num">Bruto</th><th class="num">%</th><th class="num">Comisión</th><th class="num">Te queda</th></tr>
    ${canalesUsados.sort((x,y)=>pc[y]-pc[x]).map(k=>{const cm=comisionDe(k,pc[k]);return `<tr><td>${k==='Efectivo'?'💵':'📱'} ${esc(k)}</td><td class="num">${$$(pc[k])}</td><td class="num"><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end"><div style="background:${k==='Efectivo'?'var(--oro)':'var(--verde2)'};height:10px;border-radius:3px;width:${pc[k]/ing*80}px"></div>${fnum(pc[k]/ing*100,1)}%</div></td><td class="num ${cm?'down':'muted'}">${cm?'−'+$$(cm):(+comisiones()[k]?'':'—')}</td><td class="num">${$$(pc[k]-cm)}</td></tr>`}).join('')}</table>
    ${totCom?'':'<p class="muted">Configurá en ⚙️ Comisiones cuánto te cobra cada medio de pago para ver lo que realmente te queda.</p>'}`:'<p class="muted">No hay ventas cargadas en este mes.</p>'}</div>
  <div class="card"><h3>📈 Efectivo vs online por semana</h3>
    <table>${sem.map(x=>`<tr><td style="width:60px" class="muted">${fechaCorta(x.d0)}</td><td><div style="display:flex;height:16px;width:${x.t/mxS*100}%;min-width:2px"><div style="background:var(--oro);width:${x.t?x.ef/x.t*100:0}%"></div><div style="background:var(--verde2);flex:1"></div></div></td><td class="num">${$$(x.t)}</td><td class="num muted" style="width:60px">${x.t?fnum(x.ef/x.t*100,0)+'% ef.':''}</td></tr>`).join('')}</table>
    <p class="muted"><span style="color:var(--oro)">■</span> efectivo &nbsp; <span style="color:var(--verde2)">■</span> online</p></div></div>
  <div class="grid g2" style="margin-top:12px">
  <div class="card scroll"><h3>🥐 Qué deja cada sección</h3>${Object.keys(sec).length?`<table><tr><th>Sección</th><th class="num">Venta</th><th class="num">Costo mercadería</th><th class="num">Margen bruto</th><th class="num">% del margen total</th></tr>
    ${(()=>{const mt=Object.entries(sec).filter(([k])=>k!=='Sin receta').reduce((s,[,v])=>s+v.v-v.c,0);return Object.entries(sec).sort((x,y)=>(y[1].v-y[1].c)-(x[1].v-x[1].c)).map(([k,v])=>k==='Sin receta'?`<tr><td class="muted">Sin receta vinculada</td><td class="num">${$$(v.v)}</td><td colspan="3" class="muted">no se puede calcular</td></tr>`:`<tr><td>${esc(k)}</td><td class="num">${$$(v.v)}</td><td class="num">${$$(v.c)}</td><td class="num"><b>${$$(v.v-v.c)}</b> <span class="muted">${v.v?fnum((v.v-v.c)/v.v*100,0)+'%':''}</span></td><td class="num">${mt?fnum((v.v-v.c)/mt*100,1)+'%':''}</td></tr>`).join('')})()}</table>
    <p class="muted">Calculado sobre ${$$(conItems)} de ventas con detalle de productos (${ing?fnum(conItems/ing*100,0):0}% del total del mes). El costo sale de las recetas.</p>`:'<p class="muted">Para ver qué deja cada sección, cargá los productos vendidos en "Venta del día" (o subí la foto del cierre del sistema de caja).</p>'}</div>
  <div class="card scroll"><h3>🗓️ Últimos días</h3><table><tr><th>Día</th><th class="num">💵 Efectivo</th><th class="num">📱 Online</th><th class="num">Total</th></tr>

function fichajesDe(id,ymd){return D.fichajes.filter(f=>f.empleado_id===id&&diaLocal(f.momento)===ymd).sort((a,b)=>a.momento.localeCompare(b.momento))}
function horasDia(id,ymd){let h=0,ent=null;fichajesDe(id,ymd).forEach(f=>{if(f.tipo==='entrada')ent=new Date(f.momento);else if(ent){h+=(new Date(f.momento)-ent)/36e5;ent=null}});if(ent&&ymd===hoy())h+=(new Date()-ent)/36e5;return h}
function estaAdentro(id){const f=D.fichajes.filter(x=>x.empleado_id===id).sort((a,b)=>b.momento.localeCompare(a.momento))[0];return f&&f.tipo==='entrada'&&diaLocal(f.momento)>=sumaDias(hoy(),-1)?f:null}

    if(id){const [x]=await sbUpd('empleados','id=eq.'+id,row);Object.assign(e,x)}else{const [x]=await sbIns('empleados',[row]);D.empleados.push(x)}cerrarModal();vRRHH()}}

// ================= USUARIOS =================
const MODULOS={cocina:'🍳 Cocina',panaderia:'🍞 Panadería',pasteleria:'🍰 Pastelería',madrugada:'🌅 Madrugada',salon:'🏪 Salón',deposito:'📦 Depósito'};
async function resetStock(){try{const r=await polyRPC('admin_reset_stock',{p_token:polyToken()});D.insumos.forEach(i=>i.stock=0);toast('Stock en 0 ✅ (respaldo #'+r.respaldo+')',5000);vInventario()}catch(e){toast('⚠️ '+e.message,6000)}}
async function vUsuarios(){
  $('#app').innerHTML='<div class="cargando">Cargando usuarios…</div>';
  let us=[];try{us=await polyRPC('admin_usuarios',{p_token:polyToken()})}catch(e){$('#app').innerHTML='<div class="card">'+esc(e.message)+'</div>';return}
  window._us=us;
  $('#app').innerHTML=`<h2>🔐 Usuarios y claves</h2>
  <p class="muted">Vos (administradora) entrás a todo. Cada sector entra solo a su módulo con su usuario y clave. Si cambiás una clave o das de baja a alguien, se le cierra la sesión en todos los dispositivos.</p>
  <div class="acciones"><button class="btn" onclick="editarUsuario()">➕ Nuevo usuario</button></div>
  <div class="card scroll"><table><tr><th>Usuario</th><th>Nombre</th><th>Acceso</th><th>Último ingreso</th><th>Estado</th><th></th></tr>
  ${us.map((u,k)=>`<tr><td><b>${esc(u.usuario)}</b></td><td>${esc(u.nombre||'')}</td><td>${u.rol==='admin'?'<span class="chip ok">Todo (admin)</span>':esc(MODULOS[u.modulo]||u.modulo)}</td><td class="muted">${u.ultimo_ingreso?new Date(u.ultimo_ingreso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'nunca'}</td><td><span class="chip ${u.activo?'ok':'neu'}">${u.activo?'activo':'de baja'}</span></td><td><button class="btn sec peq" onclick="editarUsuario(${k})">Editar / cambiar clave</button></td></tr>`).join('')}</table></div>`;
}
function editarUsuario(k){const u=k!=null?window._us[k]:{usuario:'',nombre:'',rol:'sector',modulo:'cocina',activo:true};const nuevo=k==null;
  const yo=window.POLY_USUARIO&&window.POLY_USUARIO.usuario===u.usuario;
  modal(`<h3>${nuevo?'Nuevo usuario':'Editar '+esc(u.usuario)}</h3>
  <div class="fila"><div><label>Usuario (para entrar)</label><input id="uU" value="${esc(u.usuario)}" ${nuevo?'':'disabled'} autocapitalize="none" placeholder="ej: cocina2"></div><div><label>Nombre</label><input id="uN" value="${esc(u.nombre||'')}"></div></div>
  <div class="fila"><div><label>Acceso</label><select id="uR" ${yo?'disabled':''} onchange="$('#uMw').style.display=this.value==='admin'?'none':''"><option value="sector">Un módulo</option><option value="admin" ${u.rol==='admin'?'selected':''}>Todo (administrador)</option></select></div>
  <div id="uMw" style="${u.rol==='admin'?'display:none':''}"><label>Módulo</label><select id="uM">${Object.entries(MODULOS).map(([m,n])=>`<option value="${m}" ${u.modulo===m?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <label>${nuevo?'Clave':'Clave nueva (dejala vacía para no cambiarla)'}</label><input id="uC" type="text" autocomplete="new-password" placeholder="mínimo 6 caracteres">
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="uA" ${u.activo?'checked':''} ${yo?'disabled':''} style="width:auto"> Activo (si lo desmarcás, no puede entrar más)</label>
  <div class="acciones" style="margin-top:12px"><button class="btn" id="bGU">💾 Guardar</button></div>`);
  $('#bGU').onclick=async()=>{const rol=$('#uR').value;const clave=$('#uC').value.trim()||null;
    try{await polyRPC('admin_guardar_usuario',{p_token:polyToken(),p_usuario:$('#uU').value,p_nombre:$('#uN').value.trim(),p_rol:rol,p_modulo:rol==='admin'?null:$('#uM').value,p_activo:$('#uA').checked,p_clave:clave});
      cerrarModal();toast(clave?'Guardado ✅ Anotá la clave: '+clave:'Guardado ✅',clave?9000:2500);vUsuarios()}catch(e){toast('⚠️ '+e.message,6000)}};
}

// ================= ARRANQUE =================
cargarTodo().then(ir).catch(e=>{$('#app').innerHTML='<div class="card"><h3>No pude conectar con la base de datos</h3><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal()});
</script>
