(function () {

  var pagina = (location.pathname.split('/').pop() || 'index.html').toLowerCase();

  Object.keys(ARCHIVO).forEach(function (m) { if (ARCHIVO[m] === pagina) requerido = m; });
  if (pagina === 'gestion.html' || pagina === 'central.html') requerido = 'admin';

  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function borrar() { try { localStorage.removeItem('poly_sesion'); localStorage.removeItem('poly_usuario'); } catch (e) {} }
  function irA(p) { location.replace(p); }
  function mostrar() { document.documentElement.style.visibility = ''; }

  window.polyRPC = function (fn, body) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message || 'Error'); return j; }); });
  };
  window.polyToken = function () { return leer('poly_sesion'); };
  window.polySalir = function () {
    var t = leer('poly_sesion'); borrar();
    var fin = function () { location.href = 'index.html'; };
    if (t) window.polyRPC('cerrar_sesion', { p_token: t }).then(fin, fin); else fin();
  };

  function permitido(u) { return u.rol === 'admin' || (requerido && requerido !== 'admin' && u.modulo === requerido); }
  function destino(u) { return u.rol === 'admin' ? 'index.html' : (ARCHIVO[u.modulo] || 'index.html'); }

  function barra(u) {
    var b = document.createElement('div');
    b.id = 'poly-sesion';
    b.style.cssText = 'position:fixed;top:4px;left:4px;z-index:99999;font:11px system-ui,sans-serif;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:3px 4px 3px 9px;display:flex;gap:6px;align-items:center;';

  document.documentElement.style.visibility = 'hidden';

    window.POLY_USUARIO = u;
    var listo = function () { barra(u); mostrar(); };

<script>
// ================= CONFIG =================
const SB_URL='https://sinoeoaktirnscdpbvdc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpbm9lb2FrdGlybnNjZHBidmRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTUyNDQsImV4cCI6MjA5NTc3MTI0NH0.4EekjV0KUzr2I_YfikOGZwuvsP_fxlxcg9z2_pU0dvg';
const MODELO_IA='claude-sonnet-5-5';
const TZ='America/Argentina/Buenos_Aires';

// ================= HELPERS =================
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const $$=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Math.round(+n||0));
const fnum=(n,d=2)=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:d}).format(+n||0);
const pct=n=>(isFinite(n)?(n>0?'+':'')+fnum(n,1)+'%':'—');
const diaLocal=d=>new Date(d).toLocaleDateString('sv-SE',{timeZone:TZ});
const hoy=()=>diaLocal(new Date());
const sumaDias=(ymd,n)=>{const d=new Date(ymd+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fechaCorta=ymd=>ymd?new Date(ymd.slice(0,10)+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}):'—';
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function modal(html){$('#modalc').innerHTML=html;$('#modal').style.display='flex';$('#modal').scrollTop=0}
function cerrarModal(){$('#modal').style.display='none';$('#modalc').innerHTML=''}
function confirmar(texto,accion){modal(`<h3>${esc(texto)}</h3><div class="acciones" style="margin-top:16px"><button class="btn rojo" id="okConf">Sí, confirmar</button><button class="btn sec" onclick="cerrarModal()">Cancelar</button></div>`);$('#okConf').onclick=async()=>{cerrarModal();await accion()}}

async function sb(path,{method='GET',body,prefer}={}){
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(prefer)h.Prefer=prefer;
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.text();console.error('Supabase',path,r.status,t);toast('⚠️ Error guardando: '+t.slice(0,120),6000);throw new Error(t)}
  const t=await r.text();return t?JSON.parse(t):null;
}
const sbGet=(t,q='')=>sb(t+'?select=*'+(q?'&'+q:''));
const sbIns=(t,rows,upsert)=>sb(t,{method:'POST',body:rows,prefer:'return=representation'+(upsert?',resolution=merge-duplicates':'')});
const sbUpd=(t,filtro,patch)=>sb(t+'?'+filtro,{method:'PATCH',body:patch,prefer:'return=representation'});
const sbDel=(t,filtro)=>sb(t+'?'+filtro,{method:'DELETE'});

// ================= ESTADO =================
const D={insumos:[],recetas:[],proveedores:[],facturas:[],cierres:[],gastos:[],gastosFijos:[],pedidos:[],empleados:[],fichajes:[],turnos:[],tareas:[],alias:[],equiv:[],produccion:[],mapeo:[],config:{}};
let insMap={},recMap={},recByName={},insByName={};
function indexar(){
  insMap={};insByName={};D.insumos.forEach(i=>{insMap[i.id]=i;insByName[norm(i.nombre)]=i});
  recMap={};recByName={};D.recetas.forEach(r=>{recMap[r.id]=r;recByName[norm(r.nombre)]=r});
}
async function cargarTodo(){
  const desde=sumaDias(hoy(),-400);
  const [ins,rec,prov,fac,cie,gas,gf,ped,emp,fic,tur,tar,ali,eq,pro,map,cfg]=await Promise.all([
    sbGet('insumos','order=nombre'),sbGet('recetas','order=nombre'),sbGet('proveedores','order=nombre'),
    sbGet('facturas','order=fecha.desc.nullslast'),sbGet('cierres_caja','fecha=gte.'+desde+'&order=fecha.desc'),
    sbGet('gastos','order=fecha.desc'),sbGet('gastos_fijos','order=proximo_vencimiento.nullslast'),
    sbGet('compras_pedidos','order=created_at.desc'),sbGet('empleados','order=nombre'),
    sbGet('fichajes','momento=gte.'+sumaDias(hoy(),-35)+'&order=momento'),sbGet('turnos_plan','fecha=gte.'+sumaDias(hoy(),-14)),
    sbGet('tareas','fecha=gte.'+sumaDias(hoy(),-7)+'&order=created_at'),sbGet('alias_pos'),sbGet('equivalencias'),
    sbGet('produccion','fecha=gte.'+sumaDias(hoy(),-60)+'&order=fecha.desc'),sbGet('produccion_mapeo','order=sector,producto'),sbGet('config')]);
  Object.assign(D,{insumos:ins,recetas:rec,proveedores:prov,facturas:fac,cierres:cie,gastos:gas,gastosFijos:gf,pedidos:ped,empleados:emp,fichajes:fic,turnos:tur,tareas:tar,alias:ali,equiv:eq,produccion:pro,mapeo:map,config:Object.fromEntries(cfg.map(c=>[c.clave,c.valor]))});
  indexar();
}

// ================= COSTEO DE RECETAS =================
function costoIngrediente(i,prof=0){
  const q=(+i.cantidad||0)*(1+(+i.merma||0)/100);
  if(i.insumo_id&&insMap[i.insumo_id])return q*(+insMap[i.insumo_id].costo_unitario||0);
  if(i.receta_id&&recMap[i.receta_id]&&prof<6){const s=recMap[i.receta_id];return q*costoReceta(s,prof+1)/(+s.rendimiento||1)}
  return q*(+i.costo_ref||0);
}
function costoReceta(r,prof=0){return (r.ingredientes||[]).reduce((a,i)=>a+costoIngrediente(i,prof),0)}
function costoUnit(r){return costoReceta(r)/(+r.rendimiento||1)}
function cmv(r){const p=+r.precio_venta||0;return p>0?costoUnit(r)/p*100:null}
function chipCMV(c){if(c==null)return '<span class="chip neu">sin precio</span>';const cl=c<=30?'ok':c<=40?'med':'mal';return `<span class="chip ${cl}">${fnum(c,1)}%</span>`}

// Explota una receta en insumos (para descontar stock)
function explotar(receta,unidades,acc={},prof=0){
  if(prof>6)return acc;const rend=+receta.rendimiento||1;
  (receta.ingredientes||[]).forEach(i=>{const q=(+i.cantidad||0)*(1+(+i.merma||0)/100)*unidades/rend;
    if(i.insumo_id)acc[i.insumo_id]=(acc[i.insumo_id]||0)+q;
    else if(i.receta_id&&recMap[i.receta_id])explotar(recMap[i.receta_id],q,acc,prof+1);});
  return acc;
}
function recetaDeVenta(nombre){
  const a=D.alias.find(x=>norm(x.alias)===norm(nombre));
  if(a&&a.receta_id&&recMap[a.receta_id])return {receta:recMap[a.receta_id],peso:+a.peso_por_unidad_kg||0};
  const r=recByName[norm(nombre)];return r?{receta:r,peso:0}:null;
}
async function descontarStock(items){
  const acc={},sinReceta=[];
  items.forEach(it=>{const m=recetaDeVenta(it.producto);if(!m){sinReceta.push(it.producto);return}
    let u=+it.cantidad||0;if(it.unidad==='kg'&&m.peso>0)u=u/m.peso;explotar(m.receta,u,acc)});
  for(const [id,q] of Object.entries(acc)){const x=insMap[id];if(!x)continue;
    const nuevo=Math.round(((+x.stock||0)-q)*1000)/1000;await sbUpd('insumos','id=eq.'+id,{stock:nuevo,updated_at:new Date().toISOString()});x.stock=nuevo}
  return {insumos:Object.keys(acc).length,sinReceta};
}

// ================= IA (lectura de facturas y tickets) =================
function apiKey(){try{return localStorage.getItem('anthropic_api_key')||''}catch(e){return ''}}
function abrirAjustes(){
  modal(`<h3>⚙️ Ajustes</h3>
  <label>API key de Anthropic (para leer facturas y tickets con IA)</label>
  <input id="ak" type="password" placeholder="sk-ant-..." value="${esc(apiKey())}">
  <p class="muted">Se guarda solo en este navegador. La sacás de console.anthropic.com → API Keys.</p>
  <div class="acciones"><button class="btn" onclick="try{localStorage.setItem('anthropic_api_key',$('#ak').value.trim())}catch(e){};cerrarModal();toast('Guardado ✅')">Guardar</button></div>`);
}
async function archivoABase64(file){
  if(file.type==='application/pdf'){return {tipo:'pdf',media:'application/pdf',data:await new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=err;r.readAsDataURL(file)})}}
  const img=await createImageBitmap(file);const max=1800;const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {tipo:'img',media:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]};
}
// ================= LECTURA DE EXCEL / CSV =================
// .xlsx se lee acá mismo (es un zip con XML). .xls viejo se lee con SheetJS, que se descarga solo si hace falta.
const esPlanilla=f=>/\.(xlsx|xlsm|xls|csv|txt)$/i.test(f.name)||/sheet|excel|csv/i.test(f.type);
async function abrirZip(buf){
  const dv=new DataView(buf),td=new TextDecoder();let e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('El archivo no es un Excel .xlsx válido');
  const n=dv.getUint16(e+10,true);let q=dv.getUint32(e+16,true);const idx={};
  for(let i=0;i<n;i++){const met=dv.getUint16(q+10,true),csz=dv.getUint32(q+20,true),nl=dv.getUint16(q+28,true),xl=dv.getUint16(q+30,true),cl=dv.getUint16(q+32,true),off=dv.getUint32(q+42,true);
    idx[td.decode(new Uint8Array(buf,q+46,nl))]={met,csz,off};q+=46+nl+xl+cl}
  return {nombres:Object.keys(idx),async leer(nombre){const f=idx[nombre];if(!f)return null;
    const data=new Uint8Array(buf,f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),f.csz);
    if(f.met===0)return td.decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}};
}
// Devuelve las hojas como [{nombre, filas:[[celda,...],...]}]. Los números quedan como número.

// Devuelve null si el archivo no tiene ese formato.
async function leerAyresArticulos(file){
  const hojas=await planillaAHojas(file);
  for(const h of hojas){
    const hi=h.filas.findIndex(f=>{const n=f.map(x=>norm(String(x)));return n.includes('codigo')&&n.includes('cantidad')&&n.some(x=>x==='subtotal'||x==='importe'||x==='total')});
    if(hi<0)continue;
    const H=h.filas[hi].map(x=>norm(String(x)));const col=(...ks)=>H.findIndex(x=>ks.includes(x));
    const cE=col('e','estado'),cH=col('hora','fecha','fecha y hora'),cCod=col('codigo'),cArt=col('articulo','producto','descripcion'),cCant=col('cantidad'),cSub=col('subtotal','importe','total');
    const cTipo=H.findIndex((x,i)=>i!==cArt&&i>cCod&&h.filas.slice(hi+1,hi+30).some(f=>/^(articulo|combo|descuento|recargo|cupon|ajuste|adelanto|observacion)$/.test(norm(String(f[i]||'')))));
    const prods={},horas=new Set();let total=0,anuladas=0,desde=null,hasta=null,descuentos=0;
    for(const f of h.filas.slice(hi+1)){
      const est=cE>=0?norm(String(f[cE]||'')):'cobrada';
      if(!est&&!f[cCod]&&!f[cSub])continue;
      if(/anulad|proceso/.test(est)){anuladas++;continue}
      const sub=numAR(f[cSub]),cant=numAR(f[cCant]);const tipo=cTipo>=0?norm(String(f[cTipo]||'')):'articulo';
      total+=sub;
      const fh=cH>=0?fechaExcel(f[cH]):null;if(fh){horas.add(fh.getTime());if(!desde||fh<desde)desde=fh;if(!hasta||fh>hasta)hasta=fh}
      const cod=String(f[cCod]??'').trim();
      if(!cod||!/articulo|combo/.test(tipo)){if(sub<0)descuentos+=sub;continue}
      const k=cod;const nom=String(f[cArt]||'').trim();
      const x=prods[k]||(prods[k]={codigo:cod,producto:nom,cantidad:0,total:0,fracc:false});
      x.cantidad+=cant;x.total+=sub;if(Math.abs(cant-Math.round(cant))>1e-6)x.fracc=true}
    const items=Object.values(prods).sort((a,b)=>b.total-a.total).map(x=>({codigo:x.codigo,producto:x.producto,unidad:x.fracc?'kg':'un',cantidad:Math.round(x.cantidad*1000)/1000,total:Math.round(x.total*100)/100}));
    if(!items.length)continue;
    return {items,total:Math.round(total*100)/100,tickets:horas.size||null,desde,hasta,anuladas,descuentos};
  }
  return null;
}

function ventasPorDiaSemana(){
  const nom=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],s=Array(7).fill(0),n=Array(7).fill(0),desde=sumaDias(hoy(),-56);
  const porDia={};D.cierres.filter(c=>diaLocal(c.fecha)>=desde).forEach(c=>{const d=diaLocal(c.fecha);porDia[d]=(porDia[d]||0)+(+c.total||0)});
  Object.entries(porDia).forEach(([d,v])=>{const w=new Date(d+'T12:00:00').getDay();s[w]+=v;n[w]++});
  const prom=s.map((v,i)=>n[i]?v/n[i]:0),mx=Math.max(1,...prom);
  return `<table>${[1,2,3,4,5,6,0].map(i=>`<tr><td style="width:50px">${nom[i]}</td><td><div style="background:var(--verde2);height:14px;border-radius:4px;width:${prom[i]/mx*100}%"></div></td><td class="num">${$$(prom[i])}</td></tr>`).join('')}</table><p class="muted">Promedio por día.</p>`;
}

async function guardarReceta(id){
  const nombre=$('#rN').value.trim();if(!nombre)return toast('Poné un nombre');

    if(n.startsWith('📋 ')&&rec)it.receta_id=rec.id;else if(ins){it.insumo_id=ins.id;it.nombre=ins.nombre;if(!it.unidad)it.unidad=ins.unidad}else if(rec)it.receta_id=rec.id;else{errores.push(n);const prev=id&&(recMap[id].ingredientes||[]).find(x=>norm(x.nombre)===norm(n));if(prev&&prev.costo_ref)it.costo_ref=prev.costo_ref}
    ingredientes.push(it)});
  if(errores.length&&!window._okErr){window._okErr=1;return toast('No encontré: '+errores.join(', ')+'. Elegilos de la lista o tocá Guardar otra vez para dejarlos sin vincular.',7000)}

  const sector=$('#rSec').value,ut=+$('#rUT').value||null;
  const row={nombre,seccion:$('#rS').value.trim()||null,precio_venta:+$('#rP').value||0,rendimiento:+$('#rR').value||1,tipo:$('#rT').value,ingredientes,pasos:$('#rPa').value.split('\n').map(s=>s.trim()).filter(Boolean),
    sector,unidades_tanda:ut,unidad_venta:$('#rUV').value,cuota_semanal:+$('#rCS').value||null,updated_at:new Date().toISOString()};
  let rid=id;
  if(id){const [x]=await sbUpd('recetas','id=eq.'+id,row);Object.assign(recMap[id],x)}else{const [x]=await sbIns('recetas',[row]);D.recetas.push(x);rid=x.id}
  // vincula la receta con la producción del sector (descuento de insumos al registrar tandas)

  D.recetas.sort((a,b)=>a.nombre.localeCompare(b.nombre));indexar();cerrarModal();toast('Receta guardada ✅');if(vistaActual==='recetas')vRecetas();
}

  const go=async file=>{if(!file)return;$('#fEst').textContent='🤖 Leyendo la factura… (tarda unos segundos)';

function sugerirInsumo(desc){
  const eq=D.equiv.find(e=>e.texto===norm(desc));if(eq&&insMap[eq.insumo_id])return insMap[eq.insumo_id];
  if(insByName[norm(desc)])return insByName[norm(desc)];
  const tk=norm(desc).split(/[^a-z0-9]+/).filter(t=>t.length>2&&!/^\d+$/.test(t));let mejor=null,mp=0;
  D.insumos.forEach(i=>{const n=norm(i.nombre);const p=tk.filter(t=>n.includes(t)).length;if(p>mp){mp=p;mejor=i}});
  return mp>=2||(mp===1&&tk.length===1)?mejor:null;
}

function filaFI(it){const s=it.sug;return `<tr><td style="min-width:160px"><input class="fiD" value="${esc(it.descripcion||'')}"></td><td style="min-width:180px"><input class="fiI" list="dlIns" value="${esc(s?s.nombre:(it.descripcion||''))}" style="${s?'':'border-color:var(--naranja)'}" oninput="calcFI(this.closest('tr'))"></td>

// ================= TABLA NUTRICIONAL =================
// Se calcula con los ingredientes de la receta (incluye sub-recetas) y los valores cada 100 g de cada insumo
// (tabla nutricion_insumo). Son valores ESTIMADOS: no reemplazan un análisis de laboratorio.
let NUT=null;
const NUT_CAMPOS=[['kcal','Valor energético','kcal'],['hc','Carbohidratos','g'],['azucares','  de los cuales azúcares','g'],['proteinas','Proteínas','g'],['grasas','Grasas totales','g'],['grasas_sat','Grasas saturadas','g'],['grasas_trans','Grasas trans','g'],['fibra','Fibra alimentaria','g'],['sodio_mg','Sodio','mg']];
const NUT_VD={kcal:2000,hc:300,proteinas:75,grasas:55,grasas_sat:22,fibra:25,sodio_mg:2400};
const ALERG_TXT={gluten:'gluten (TACC)',leche:'leche',huevo:'huevo',soja:'soja',mani:'maní',frutos_secos:'frutos secos',sesamo:'sésamo',pescado:'pescado',crustaceos:'crustáceos'};
async function cargarNut(){const rows=await sbGet('nutricion_insumo');NUT={};rows.forEach(n=>NUT[n.insumo_id]=n);return NUT}
function explotarNut(r,factor,prof,out){if(!r||prof>6)return out;const rend=+r.rendimiento||1;
  for(const i of (r.ingredientes||[])){const q=(+i.cantidad||0)*(1+(+i.merma||0)/100)*factor/rend;
    if(i.insumo_id)out.push({id:i.insumo_id,q,nombre:i.nombre});
    else if(i.receta_id&&recMap[i.receta_id])explotarNut(recMap[i.receta_id],q,prof+1,out);
    else out.push({id:null,q,nombre:i.nombre})}
  return out}
function calcNut(r){
  const partes=explotarNut(r,1,0,[]);const tot={};NUT_CAMPOS.forEach(([k])=>tot[k]=0);
  let gramos=0;const faltan={},alerg=new Set();
  for(const p of partes){
    if(!p.q)continue;
    const n=p.id?NUT[p.id]:null;
    if(!n){const k=p.id||('x:'+p.nombre);faltan[k]={id:p.id,nombre:p.id&&insMap[p.id]?insMap[p.id].nombre:p.nombre};continue}
    if(!n.es_alimento)continue;
    if(n.kcal==null||!n.g_por_unidad){faltan[p.id]={id:p.id,nombre:insMap[p.id]?.nombre||p.nombre};continue}
    const g=p.q*n.g_por_unidad;gramos+=g;
    NUT_CAMPOS.forEach(([k])=>tot[k]+=g/100*(+n[k]||0));
    (n.alergenos||[]).forEach(a=>alerg.add(a));
  }
  const pesoU=+r.peso_unidad_g||0;const base=pesoU||gramos;
  const c100={};NUT_CAMPOS.forEach(([k])=>c100[k]=base?tot[k]/base*100:0);
  const porG=+r.porcion_g||pesoU||0;
  const porc=porG?Object.fromEntries(NUT_CAMPOS.map(([k])=>[k,c100[k]*porG/100])):null;
  return {c100,porc,porG,pesoU,gramosCrudo:gramos,faltan:Object.values(faltan),alerg:[...alerg]};
}
function fmtNut(v,k){if(v==null)return '—';if(k==='kcal'||k==='sodio_mg')return Math.round(v).toLocaleString('es-AR');return (v<10?Math.round(v*10)/10:Math.round(v)).toLocaleString('es-AR')}
function vdNut(v,k){return NUT_VD[k]?Math.round(v/NUT_VD[k]*100)+'%':'—'}

async function verNutricion(id){
  const r=recMap[id];if(!r)return;
  if(!NUT){modal('<p class="cargando">Calculando…</p>');try{await cargarNut()}catch(e){return}}
  const n=calcNut(r);
  const desc=r.porcion_desc||'1 unidad';
  modal(`<h2>🏷️ Tabla nutricional · ${esc(r.nombre)}</h2>
  <p class="muted">Valores <b>estimados</b> a partir de la receta. ${n.pesoU?'':'<b style="color:var(--rojo)">Todavía no cargaste el peso de 1 unidad horneada:</b> mientras tanto, "cada 100 g" se calcula sobre la masa cruda y no se muestra la porción.'}</p>
  <div class="fila"><div><label>Peso de 1 unidad ya horneada (g)</label><input id="nuP" type="number" step="any" value="${r.peso_unidad_g??''}" placeholder="ej: 60"></div>
  <div><label>Porción para la etiqueta (g, opcional)</label><input id="nuPg" type="number" step="any" value="${r.porcion_g??''}" placeholder="igual a 1 unidad"></div>
  <div><label>Cómo se llama la porción</label><input id="nuPd" value="${esc(r.porcion_desc||'')}" placeholder="ej: 1 medialuna, 1 porción"></div></div>

  PV.alias=PV.alias.filter(a=>a.alias!==l.k).concat([x]);toast('Vinculado ✅ '+l.nombre+' → '+p.nombre);vVenta()}

let tabCompras='sug';
function sugerencias(){
  const g={};criticos().forEach(i=>{const obj=Math.max(+i.stock_optimo||0,(+i.stock_minimo||0)*2);const q=Math.max(0,Math.ceil((obj-(+i.stock||0))*100)/100);if(!q)return;
    const p=i.proveedor||'Sin proveedor';(g[p]=g[p]||[]).push({insumo_id:i.id,nombre:i.nombre,unidad:i.unidad,cantidad:q,costo:+i.costo_unitario||0})});return g;}

    html+=`<p class="muted">Se sugiere pedir lo que está por debajo del mínimo, hasta llegar al óptimo (o al doble del mínimo). Configurá los mínimos en Inventario.</p>

    <td style="white-space:nowrap"><button class="btn sec peq" onclick="textoPedido('${p.id}')">📋 Texto</button> ${p.estado==='borrador'?`<button class="btn sec peq" onclick="estadoPedido('${p.id}','enviado')">Enviado</button>`:''} ${p.estado!=='recibido'?`<button class="btn peq" onclick="recibirPedido('${p.id}')">Recibido</button> <button class="btn sec peq" onclick="confirmar('¿Borrar el pedido?',async()=>{await sbDel('compras_pedidos','id=eq.${p.id}');D.pedidos=D.pedidos.filter(x=>x.id!=='${p.id}');vCompras()})">×</button>`:''}</td></tr>`).join('')}</table>${D.pedidos.length?'':'<p class="muted">Todavía no hay pedidos.</p>'}</div>`}
  if(t==='prov'){const gasto={};const d=sumaDias(hoy(),-90);D.facturas.filter(f=>f.fecha&&f.fecha>=d).forEach(f=>gasto[norm(f.proveedor)]=(gasto[norm(f.proveedor)]||0)+(+f.total||0));

let perFin=0;

  const ing=cier.reduce((s,c)=>s+(+c.total||0),0),gF=fac.reduce((s,f)=>s+(+f.total||0),0),gM=gas.reduce((s,g)=>s+(+g.monto||0),0);

  const dias=new Set(cier.map(c=>diaLocal(c.fecha))).size;
  // contribución por sección (según productos cargados)
  const sec={};let conItems=0,sinRec=0;cier.forEach(c=>(c.items||[]).forEach(i=>{conItems+=+i.total||0;const x=costoVentaItem(i);const k=x?x.seccion:'Sin receta';sec[k]=sec[k]||{v:0,c:0,n:0};sec[k].v+=+i.total||0;if(x)sec[k].c+=x.costo;else sinRec+=+i.total||0}));
  // semanas
  const l0=lunes(hoy()),sem=[];for(let k=7;k>=0;k--){const d0=sumaDias(l0,-7*k),d1=sumaDias(d0,6);const cs=D.cierres.filter(c=>{const d=diaLocal(c.fecha);return d>=d0&&d<=d1});const p=porCanal(cs);const t=cs.reduce((s,c)=>s+(+c.total||0),0);sem.push({d0,t,ef:p['Efectivo']||0})}
  const mxS=Math.max(1,...sem.map(x=>x.t));
  const mov=[...cier.map(c=>({f:diaLocal(c.fecha),d:'Venta '+(c.turno||''),m:+c.total,t:'i'})),...fac.map(f=>({f:f.fecha,d:'Factura '+f.proveedor,m:-f.total,t:'f'})),...gas.map(g=>({f:g.fecha,d:g.concepto+(g.categoria?' ('+g.categoria+')':''),m:-g.monto,t:'g',id:g.id}))].sort((x,y)=>y.f.localeCompare(x.f));
  window._movFin=mov;
  const ultimos=[];for(let i=0;i<14;i++){const d=sumaDias(hoy(),-i);const cs=D.cierres.filter(c=>diaLocal(c.fecha)===d);if(!cs.length&&i>0)continue;const p=porCanal(cs);ultimos.push({d,p,t:cs.reduce((s,c)=>s+(+c.total||0),0)})}
  const canalesUsados=CANALES.concat(['Sin detallar']).filter(c=>pc[c]);
  $('#app').innerHTML=`<h2>💰 Finanzas</h2>
  <div class="acciones"><button class="btn" onclick="nuevoCierre()">💵 Cargar venta del día</button><button class="btn sec" onclick="nuevoGasto()">➖ Registrar gasto</button><button class="btn sec" onclick="editarComisiones()">⚙️ Comisiones</button><button class="btn sec" onclick="exportarCSV()">⬇️ Exportar (CSV)</button>
  <select style="max-width:200px" onchange="perFin=+this.value;vFinanzas()">${[0,-1,-2,-3,-4,-5].map(o=>{const [x]=mesRango(o);return `<option value="${o}" ${o===perFin?'selected':''}>${new Date(x+'T12:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</option>`}).join('')}</select></div>
  <div class="grid g4"><div class="card kpi"><div class="lbl">Ventas · ${nombreMes}</div><div class="val">${$$(ing)}</div><div class="sub muted">${dias} días cargados · promedio ${$$(dias?ing/dias:0)}/día</div></div>
  <div class="card kpi"><div class="lbl">💵 Efectivo</div><div class="val">${$$(ef)}</div><div class="sub muted">${ing?fnum(ef/ing*100,1)+'% de la venta':''}</div></div>
  <div class="card kpi"><div class="lbl">📱 Online / digital</div><div class="val">${$$(on)}</div><div class="sub muted">${ing?fnum(on/ing*100,1)+'% de la venta':''}${totCom?' · comisiones −'+$$(totCom):''}</div></div>
  <div class="card kpi"><div class="lbl">Resultado del mes</div><div class="val" style="color:${util>=0?'var(--verde)':'var(--rojo)'}">${$$(util)}</div><div class="sub muted">${ing?'margen '+fnum(util/ing*100,1)+'%':''}</div></div></div>
  ${(()=>{const cc=D.cierres.filter(c=>c.total_articulos!=null).slice(0,20);const malos=cc.filter(c=>Math.abs(difCaja(c))>tolCaja()).length;
    return `<div class="card" style="margin-top:12px"><h3>🔎 Control de caja <span class="muted">· lo cobrado vs lo vendido en Ayres, por turno</span></h3>
    <div class="acciones" style="margin-bottom:6px"><span class="muted">Avisar desde una diferencia de</span> <input type="number" class="mini" value="${tolCaja()}" onchange="guardarTolCaja(this.value)" style="width:110px"> <span class="muted">por turno</span></div>
    ${cc.length?`<div class="scroll"><table><tr><th>Fecha</th><th>Turno</th><th>Responsable</th><th class="num">Cobrado</th><th class="num">Vendido en Ayres</th><th class="num">Diferencia</th></tr>
    ${cc.map(c=>{const d=difCaja(c),ad=Math.abs(d);const col=ad<=1?'var(--verde)':ad<=tolCaja()?'#a07000':'var(--rojo)';return `<tr style="${ad>tolCaja()?'background:#fff0f0':''}"><td>${fechaCorta(diaLocal(c.fecha))}</td><td>${esc(c.turno||'')}</td><td>${esc(c.responsable||'—')}</td><td class="num">${$$(c.total)}</td><td class="num">${$$(c.total_articulos)}</td><td class="num" style="color:${col};font-weight:700">${ad<=1?'✅ cierra':(d<0?'falta ':'sobra ')+$$(ad)}</td></tr>`}).join('')}</table></div>

    :'<p class="muted">Todavía no hay turnos cargados con los dos archivos de Ayres (artículos + cierre de caja). Cuando cargues la venta del día con el Excel de artículos, acá vas a ver si la caja cierra.</p>'}</div>`})()}
  <div class="card" style="margin-top:12px"><h3>🧮 Cómo se arma el resultado</h3><table>
   <tr><td>Ventas</td><td class="num">${$$(ing)}</td><td class="num muted">100%</td></tr>
   <tr><td>− Comisiones de cobro (estimadas)</td><td class="num down">${$$(-totCom)}</td><td class="num muted">${ing?fnum(totCom/ing*100,1)+'%':''}</td></tr>
   <tr><td>− Compras a proveedores (facturas del mes)</td><td class="num down">${$$(-gF)}</td><td class="num muted">${ing?fnum(gF/ing*100,1)+'%':''}</td></tr>
   <tr><td>− Otros gastos (sueldos, servicios, fijos pagados)</td><td class="num down">${$$(-gM)}</td><td class="num muted">${ing?fnum(gM/ing*100,1)+'%':''}</td></tr>
   <tr><td><b>= Resultado</b></td><td class="num"><b>${$$(util)}</b></td><td class="num"><b>${ing?fnum(util/ing*100,1)+'%':''}</b></td></tr></table>
   <p class="muted">Ojo: las facturas cuentan el mes en que se compró, aunque la mercadería se use después. Si no cargás sueldos y gastos fijos, el resultado va a aparecer más alto de lo real.</p></div>
  <div class="grid g2" style="margin-top:12px">
  <div class="card"><h3>📊 Venta por canal de cobro</h3>${canalesUsados.length?`<table><tr><th>Canal</th><th class="num">Bruto</th><th class="num">%</th><th class="num">Comisión</th><th class="num">Te queda</th></tr>
    ${canalesUsados.sort((x,y)=>pc[y]-pc[x]).map(k=>{const cm=comisionDe(k,pc[k]);return `<tr><td>${k==='Efectivo'?'💵':'📱'} ${esc(k)}</td><td class="num">${$$(pc[k])}</td><td class="num"><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end"><div style="background:${k==='Efectivo'?'var(--oro)':'var(--verde2)'};height:10px;border-radius:3px;width:${pc[k]/ing*80}px"></div>${fnum(pc[k]/ing*100,1)}%</div></td><td class="num ${cm?'down':'muted'}">${cm?'−'+$$(cm):(+comisiones()[k]?'':'—')}</td><td class="num">${$$(pc[k]-cm)}</td></tr>`}).join('')}</table>
    ${totCom?'':'<p class="muted">Configurá en ⚙️ Comisiones cuánto te cobra cada medio de pago para ver lo que realmente te queda.</p>'}`:'<p class="muted">No hay ventas cargadas en este mes.</p>'}</div>
  <div class="card"><h3>📈 Efectivo vs online por semana</h3>
    <table>${sem.map(x=>`<tr><td style="width:60px" class="muted">${fechaCorta(x.d0)}</td><td><div style="display:flex;height:16px;width:${x.t/mxS*100}%;min-width:2px"><div style="background:var(--oro);width:${x.t?x.ef/x.t*100:0}%"></div><div style="background:var(--verde2);flex:1"></div></div></td><td class="num">${$$(x.t)}</td><td class="num muted" style="width:60px">${x.t?fnum(x.ef/x.t*100,0)+'% ef.':''}</td></tr>`).join('')}</table>
    <p class="muted"><span style="color:var(--oro)">■</span> efectivo &nbsp; <span style="color:var(--verde2)">■</span> online</p></div></div>
  <div class="grid g2" style="margin-top:12px">
  <div class="card scroll"><h3>🥐 Qué deja cada sección</h3>${Object.keys(sec).length?`<table><tr><th>Sección</th><th class="num">Venta</th><th class="num">Costo mercadería</th><th class="num">Margen bruto</th><th class="num">% del margen total</th></tr>
    ${(()=>{const mt=Object.entries(sec).filter(([k])=>k!=='Sin receta').reduce((s,[,v])=>s+v.v-v.c,0);return Object.entries(sec).sort((x,y)=>(y[1].v-y[1].c)-(x[1].v-x[1].c)).map(([k,v])=>k==='Sin receta'?`<tr><td class="muted">Sin receta vinculada</td><td class="num">${$$(v.v)}</td><td colspan="3" class="muted">no se puede calcular</td></tr>`:`<tr><td>${esc(k)}</td><td class="num">${$$(v.v)}</td><td class="num">${$$(v.c)}</td><td class="num"><b>${$$(v.v-v.c)}</b> <span class="muted">${v.v?fnum((v.v-v.c)/v.v*100,0)+'%':''}</span></td><td class="num">${mt?fnum((v.v-v.c)/mt*100,1)+'%':''}</td></tr>`).join('')})()}</table>

  <div class="card scroll"><h3>🗓️ Últimos días</h3><table><tr><th>Día</th><th class="num">💵 Efectivo</th><th class="num">📱 Online</th><th class="num">Total</th></tr>
    ${ultimos.map(x=>{const e=x.p['Efectivo']||0;return `<tr><td>${new Date(x.d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'})}</td><td class="num">${$$(e)}</td><td class="num">${$$(x.t-e)}</td><td class="num"><b>${x.t?$$(x.t):'<span class="chip med">sin cargar</span>'}</b></td></tr>`}).join('')}</table></div></div>

    return `<tr><td>${esc(g.nombre)}<br><span class="muted">${esc(g.categoria||'')} · cada ${g.intervalo>1?g.intervalo+' ':''}${esc(g.frecuencia||'mes')}</span></td><td class="num">${$$(g.monto)}</td><td>${g.proximo_vencimiento?`<span class="chip ${dd<0?'mal':dd<=(g.dias_aviso||3)?'med':'neu'}">${fechaCorta(g.proximo_vencimiento)}</span>`:''}</td><td><button class="btn peq" onclick="pagarFijo('${g.id}')">Pagar</button></td></tr>`}).join('')}</table>
    <button class="btn sec peq" style="margin-top:8px" onclick="nuevoFijo()">+ gasto fijo</button></div>
  <div class="card scroll"><h3>📋 Movimientos</h3><table>${mov.slice(0,80).map(m=>`<tr><td>${fechaCorta(m.f)}</td><td>${esc(m.d)}</td><td class="num ${m.m>=0?'up':'down'}">${$$(m.m)}</td><td>${m.t==='g'?`<button class="btn sec peq" onclick="confirmar('¿Borrar este gasto?',async()=>{await sbDel('gastos','id=eq.${m.id}');D.gastos=D.gastos.filter(x=>x.id!=='${m.id}');vFinanzas()})">×</button>`:''}</td></tr>`).join('')}</table></div></div>`;
}

let VD_ART=null;

function nuevoCierre(){

      const j=await leerConIA(f,PROMPT_TICKET);if(j.fecha&&!VD_ART)$('#cF').value=j.fecha;
      document.querySelectorAll('.fpg').forEach(el=>el.value='');
      const acc={};Object.entries(j.formas_pago||{}).forEach(([k,v])=>{if(+v){const c=canalDe(k);acc[c]=(acc[c]||0)+(+v)}});
      Object.entries(acc).forEach(([c,v])=>{const el=document.querySelector(`.fpg[data-k="${c}"]`);if(el)el.value=Math.round(v)});
      if(+j.tickets&&!$('#cTk').value)$('#cTk').value=+j.tickets;
      if(!VD_ART&&(j.items||[]).length)ponerItems(j.items);
      sumaCanales();$('#cEst').textContent='✅ Leído. Revisá antes de guardar.'}
    catch(err){$('#cEst').textContent='⚠️ '+err.message}};
  $('#bGC').onclick=async()=>{$('#bGC').disabled=true;try{
    const fp={};let s=0;document.querySelectorAll('.fpg').forEach(e=>{if(+e.value){fp[e.dataset.k]=+e.value;s+=+e.value}});
    if(!s)return toast('Cargá al menos un importe');
    if(VD_ART&&Math.abs(s-VD_ART.total)>tolCaja()&&!confirm('⚠️ No cierra la caja.\nCobrado (medios de pago): '+$$(s)+'\nVendido según Ayres: '+$$(VD_ART.total)+'\n'+(s<VD_ART.total?'Falta ':'Sobra ')+$$(Math.abs(s-VD_ART.total))+'.\n\n¿Guardar igual? Va a quedar marcado como diferencia de caja.'))return;
    const items=[];document.querySelectorAll('#tV tr').forEach((tr,k)=>{if(!k)return;const p=tr.querySelector('.vP').value.trim(),c=+tr.querySelector('.vC').value;if(!p||!c)return;const it={producto:p,unidad:tr.querySelector('.vU').value,cantidad:c,total:+tr.querySelector('.vT').value||0};const cod=tr.dataset.cod;if(cod)it.codigo=cod;items.push(it)});
    const t=$('#cT').value,hora=t==='Mañana'?'14:00':t==='Tarde'?'20:00':'23:00';
    const [c]=await sbIns('cierres_caja',[{fecha:new Date($('#cF').value+'T'+hora+':00-03:00').toISOString(),turno:t,total:s,formas_pago:fp,items,tickets:+$('#cTk').value||null,total_articulos:VD_ART?VD_ART.total:null,responsable:$('#cR').value||null,estado:'cerrado'}]);D.cierres.unshift(c);
    cerrarModal();toast('Venta guardada ✅ '+$$(s));VISTAS[vistaActual]();
  }finally{const b=$('#bGC');if(b)b.disabled=false}};
}
function sumaCanales(){let ef=0,on=0;document.querySelectorAll('.fpg').forEach(e=>{const v=+e.value||0;if(e.dataset.k==='Efectivo')ef+=v;else on+=v});const t=ef+on;
  const com=[...document.querySelectorAll('.fpg')].reduce((a,e)=>a+comisionDe(e.dataset.k,+e.value||0),0);
  $('#cResumen').innerHTML=`<div class="fila" style="align-items:center"><div><div class="muted">Total del día</div><div style="font-size:26px;font-weight:700;color:var(--verde)">${$$(t)}</div></div>
  <div><div class="muted">💵 Efectivo</div><b>${$$(ef)}</b> ${t?`<span class="muted">(${fnum(ef/t*100,0)}%)</span>`:''}</div><div><div class="muted">📱 Online</div><b>${$$(on)}</b> ${t?`<span class="muted">(${fnum(on/t*100,0)}%)</span>`:''}</div>
  ${com?`<div><div class="muted">Comisiones estimadas</div><b class="down">−${$$(com)}</b></div>`:''}</div>
  ${VD_ART?(()=>{const d=t-VD_ART.total,ad=Math.abs(d);return ad<=1?`<div style="margin-top:8px;color:var(--verde);font-weight:700">✅ Cierra: lo cobrado y lo vendido en Ayres suman lo mismo (${$$(t)})</div>`:ad<=tolCaja()?`<div style="margin-top:8px;color:#a07000;font-weight:700">🟡 Diferencia chica: ${d<0?'falta':'sobra'} ${$$(ad)} (cobrado ${$$(t)} · Ayres ${$$(VD_ART.total)}). Está dentro de la tolerancia de ${$$(tolCaja())}.</div>`:`<div style="margin-top:8px;color:var(--rojo);font-weight:700">🔴 No cierra: ${d<0?'falta':'sobra'} ${$$(ad)} · cobrado ${$$(t)} · vendido en Ayres ${$$(VD_ART.total)}</div>`})():''}
  ${+($('#cTk')||{}).value&&t?`<div class="muted" style="margin-top:4px">Ticket promedio: ${$$(t/+$('#cTk').value)}</div>`:''}`}
function nuevoGasto(){modal(`<h3>➖ Registrar gasto</h3><p class="muted">Para compras a proveedores usá "Cargar factura" (así actualiza stock y costos). Esto es para otros gastos: sueldos, servicios, arreglos, etc.</p>
  <div class="fila"><div><label>Fecha</label><input id="gF" type="date" value="${hoy()}"></div><div><label>Monto</label><input id="gM" type="number" step="any"></div></div>
  <div class="fila"><div><label>Concepto</label><input id="gC"></div><div><label>Categoría</label><select id="gCa"><option>Sueldos</option><option>Servicios</option><option>Alquiler</option><option>Impuestos</option><option>Mantenimiento</option><option>Otros</option></select></div></div>
  <div class="acciones" style="margin-top:10px"><button class="btn" id="bGG">💾 Guardar</button></div>`);
  $('#bGG').onclick=async()=>{if(!$('#gC').value.trim()||!+$('#gM').value)return toast('Completá concepto y monto');const [g]=await sbIns('gastos',[{fecha:$('#gF').value,concepto:$('#gC').value.trim(),categoria:$('#gCa').value,monto:+$('#gM').value}]);D.gastos.unshift(g);cerrarModal();vFinanzas()}}
function siguienteVenc(ymd,frec,n){const d=new Date((ymd||hoy())+'T12:00:00');const f=norm(frec);n=+n||1;
  if(f.startsWith('sem')||f.startsWith('week'))d.setDate(d.getDate()+7*n);else if(f.startsWith('dia')||f.startsWith('day'))d.setDate(d.getDate()+n);else if(f.startsWith('an')||f.startsWith('year'))d.setFullYear(d.getFullYear()+n);else d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)}
function pagarFijo(id){const g=D.gastosFijos.find(x=>x.id===id);
  modal(`<h3>Pagar: ${esc(g.nombre)}</h3><div class="fila"><div><label>Monto pagado</label><input id="pfM" type="number" step="any" value="${+g.monto}"></div><div><label>Fecha</label><input id="pfF" type="date" value="${hoy()}"></div></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pfAct" checked style="width:auto"> Guardar este monto como el nuevo valor del gasto fijo</label>
  <div class="acciones" style="margin-top:10px"><button class="btn" id="bPF">✅ Registrar pago</button><button class="btn rojo" onclick="confirmar('¿Desactivar este gasto fijo?',async()=>{await sbUpd('gastos_fijos','id=eq.${id}',{activo:false});D.gastosFijos.find(x=>x.id==='${id}').activo=false;vFinanzas()})">Desactivar</button></div>`);
  $('#bPF').onclick=async()=>{const m=+$('#pfM').value;const [ga]=await sbIns('gastos',[{fecha:$('#pfF').value,concepto:g.nombre,categoria:g.categoria||'Gasto fijo',monto:m}]);D.gastos.unshift(ga);
    const patch={ultimo_pago:$('#pfF').value,proximo_vencimiento:siguienteVenc(g.proximo_vencimiento||$('#pfF').value,g.frecuencia,g.intervalo)};if($('#pfAct').checked)patch.monto=m;
    const [x]=await sbUpd('gastos_fijos','id=eq.'+id,patch);Object.assign(g,x);cerrarModal();toast('Pago registrado ✅');vFinanzas()}}
function nuevoFijo(){modal(`<h3>Nuevo gasto fijo</h3><div class="fila"><div><label>Nombre</label><input id="nfN" placeholder="Ej: Alquiler, Luz, Sueldo Juan"></div><div><label>Categoría</label><input id="nfC"></div></div>
  <div class="fila"><div><label>Monto</label><input id="nfM" type="number" step="any"></div><div><label>Se paga cada</label><select id="nfF"><option value="mes">mes</option><option value="semana">semana</option><option value="año">año</option></select></div><div><label>Próximo vencimiento</label><input id="nfV" type="date"></div><div><label>Avisar días antes</label><input id="nfA" type="number" value="3"></div></div>
  <div class="acciones" style="margin-top:10px"><button class="btn" id="bNF">💾 Guardar</button></div>`);
  $('#bNF').onclick=async()=>{if(!$('#nfN').value.trim())return;const [g]=await sbIns('gastos_fijos',[{nombre:$('#nfN').value.trim(),categoria:$('#nfC').value.trim(),monto:+$('#nfM').value||0,frecuencia:$('#nfF').value,intervalo:1,proximo_vencimiento:$('#nfV').value||null,dias_aviso:+$('#nfA').value||3}]);D.gastosFijos.push(g);cerrarModal();vFinanzas()}}
function exportarCSV(){const rows=[['Fecha','Concepto','Monto']].concat((window._movFin||[]).map(m=>[m.f,m.d,Math.round(m.m)]));
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='finanzas_poly.csv';a.click()}

// ================= RRHH =================
let tabRH='fichar';
function fichajesDe(id,ymd){return D.fichajes.filter(f=>f.empleado_id===id&&diaLocal(f.momento)===ymd).sort((a,b)=>a.momento.localeCompare(b.momento))}
function horasDia(id,ymd){let h=0,ent=null;fichajesDe(id,ymd).forEach(f=>{if(f.tipo==='entrada')ent=new Date(f.momento);else if(ent){h+=(new Date(f.momento)-ent)/36e5;ent=null}});if(ent&&ymd===hoy())h+=(new Date()-ent)/36e5;return h}
function estaAdentro(id){const f=D.fichajes.filter(x=>x.empleado_id===id).sort((a,b)=>b.momento.localeCompare(a.momento))[0];return f&&f.tipo==='entrada'&&diaLocal(f.momento)>=sumaDias(hoy(),-1)?f:null}
function lunes(ymd){const d=new Date(ymd+'T12:00:00');const w=(d.getDay()+6)%7;return sumaDias(ymd,-w)}
function vRRHH(){
  const act=D.empleados.filter(e=>e.activo!==false),t=tabRH;
  let html=`<h2>👥 Personal</h2><div class="tabs2">${[['fichar','Fichar'],['horas','Horas'],['turnos','Turnos de la semana'],['leg','Empleados']].map(([k,n])=>`<button class="${t===k?'on':''}" onclick="tabRH='${k}';vRRHH()">${n}</button>`).join('')}</div>`;
  if(t==='fichar'){const adentro=act.filter(e=>estaAdentro(e.id));
    html+=`<div class="grid g2"><div class="card"><h3>⏱️ Registrar entrada / salida</h3><label>¿Quién sos?</label><select id="fe"><option value=""></option>${act.map(e=>`<option value="${e.id}">${esc(e.nombre)} ${esc(e.apellido||'')}</option>`).join('')}</select>
    <label>PIN (si tenés)</label><input id="fpin" type="password" inputmode="numeric" maxlength="6">
    <div class="acciones" style="margin-top:12px"><button class="btn" style="flex:1;padding:16px" onclick="fichar('entrada')">🟢 ENTRADA</button><button class="btn rojo" style="flex:1;padding:16px" onclick="fichar('salida')">🔴 SALIDA</button></div></div>
    <div class="card"><h3>🟢 Trabajando ahora (${adentro.length})</h3>${adentro.length?adentro.map(e=>`<div style="padding:6px 0;border-bottom:1px solid #eee"><b>${esc(e.nombre)}</b> <span class="muted">desde ${new Date(estaAdentro(e.id).momento).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<p class="muted">Nadie fichado.</p>'}
    <h3 style="margin-top:14px">Hoy</h3><table>${act.map(e=>{const fs=fichajesDe(e.id,hoy());return fs.length?`<tr><td>${esc(e.nombre)}</td><td class="muted">${fs.map(f=>(f.tipo==='entrada'?'↘ ':'↗ ')+new Date(f.momento).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})).join(' · ')}</td><td class="num">${fnum(horasDia(e.id,hoy()),1)} h</td></tr>`:''}).join('')}</table></div></div>`}
  if(t==='horas'){const l=lunes(hoy());const sem=[0,-7,-14,-21].map(o=>sumaDias(l,o));
    html+=`<div class="card scroll"><table><tr><th>Empleado</th>${sem.map(s=>`<th class="num">Semana ${fechaCorta(s)}</th>`).join('')}</tr>${act.map(e=>`<tr><td>${esc(e.nombre)} ${esc(e.apellido||'')}</td>${sem.map(s=>{let h=0;for(let i=0;i<7;i++)h+=horasDia(e.id,sumaDias(s,i));return `<td class="num">${h?fnum(h,1)+' h':'—'}</td>`}).join('')}</tr>`).join('')}</table>
    <p class="muted">Si alguien se olvidó de fichar la salida, esas horas no se cuentan (salvo hoy, que se cuentan hasta ahora).</p></div>`}
  if(t==='turnos'){const l=lunes(hoy());const ds=[0,1,2,3,4,5,6].map(i=>sumaDias(l,i)),nd=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    html+=`<p class="muted">Escribí el horario (ej: 6-14) y se guarda solo. Dejalo vacío si no trabaja.</p><div class="card scroll"><table class="semana"><tr><th>Empleado</th>${ds.map((d,i)=>`<th>${nd[i]} ${fechaCorta(d)}</th>`).join('')}</tr>
    ${act.map(e=>`<tr><td>${esc(e.nombre)}</td>${ds.map(d=>{const tu=D.turnos.find(x=>x.empleado_id===e.id&&x.fecha===d);return `<td><input value="${esc(tu?tu.hora_inicio:'')}" onchange="guardarTurno('${e.id}','${d}',this.value)"></td>`}).join('')}</tr>`).join('')}</table></div>`}
  if(t==='leg'){html+=`<div class="acciones"><button class="btn" onclick="editarEmpleado()">➕ Nuevo empleado</button></div><div class="card scroll"><table><tr><th>Nombre</th><th>Rol</th><th>Sector</th><th>Ingreso</th><th>PIN</th><th>Estado</th></tr>
    ${D.empleados.map(e=>`<tr class="click" onclick="editarEmpleado('${e.id}')"><td><b>${esc(e.nombre)} ${esc(e.apellido||'')}</b></td><td>${esc(e.rol||'')}</td><td>${esc(e.sector||'')}</td><td>${e.fecha_ingreso?fechaCorta(e.fecha_ingreso)+'/'+e.fecha_ingreso.slice(2,4):''}</td><td>${e.pin?'✅':'<span class="muted">sin PIN</span>'}</td><td><span class="chip ${e.activo!==false?'ok':'neu'}">${e.activo!==false?'activo':'baja'}</span></td></tr>`).join('')}</table></div>`}
  $('#app').innerHTML=html;
}
async function fichar(tipo){const id=$('#fe').value;if(!id)return toast('Elegí tu nombre');const e=D.empleados.find(x=>x.id===id);
  if(e.pin&&$('#fpin').value!==e.pin)return toast('❌ PIN incorrecto');
  const dentro=estaAdentro(id);if(tipo==='entrada'&&dentro)return toast(e.nombre+' ya tiene la entrada marcada');if(tipo==='salida'&&!dentro)return toast(e.nombre+' no tiene entrada marcada');
  const [f]=await sbIns('fichajes',[{empleado_id:id,tipo}]);D.fichajes.push(f);toast((tipo==='entrada'?'🟢 Entrada ':'🔴 Salida ')+e.nombre+' · '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),4000);vRRHH()}
async function guardarTurno(eid,fecha,v){const prev=D.turnos.find(x=>x.empleado_id===eid&&x.fecha===fecha);
  if(prev){await sbDel('turnos_plan','id=eq.'+prev.id);D.turnos=D.turnos.filter(x=>x!==prev)}
  if(v.trim()){const [t]=await sbIns('turnos_plan',[{empleado_id:eid,fecha,hora_inicio:v.trim()}]);D.turnos.push(t)}toast('Guardado ✅',1000)}
function editarEmpleado(id){const e=id?D.empleados.find(x=>x.id===id):{activo:true};
  modal(`<h3>${id?'Editar':'Nuevo'} empleado</h3><div class="fila"><div><label>Nombre</label><input id="eN" value="${esc(e.nombre||'')}"></div><div><label>Apellido</label><input id="eA" value="${esc(e.apellido||'')}"></div></div>
  <div class="fila"><div><label>Rol</label><input id="eR" value="${esc(e.rol||'')}" placeholder="Panadero, vendedora…"></div><div><label>Sector</label><select id="eS">${['','Panadería','Pastelería','Cocina','Salón','Depósito'].map(s=>`<option ${s===e.sector?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <div class="fila"><div><label>Fecha de ingreso</label><input id="eF" type="date" value="${esc(e.fecha_ingreso||'')}"></div><div><label>PIN para fichar (4 a 6 números)</label><input id="eP" inputmode="numeric" maxlength="6" value="${esc(e.pin||'')}"></div><div><label>Estado</label><select id="eE"><option value="1">Activo</option><option value="0" ${e.activo===false?'selected':''}>De baja</option></select></div></div>
  <div class="acciones" style="margin-top:10px"><button class="btn" id="bGE">💾 Guardar</button></div>`);
  $('#bGE').onclick=async()=>{const row={nombre:$('#eN').value.trim(),apellido:$('#eA').value.trim(),rol:$('#eR').value.trim(),sector:$('#eS').value||null,fecha_ingreso:$('#eF').value||null,pin:$('#eP').value.trim()||null,activo:$('#eE').value==='1'};if(!row.nombre)return;
    if(id){const [x]=await sbUpd('empleados','id=eq.'+id,row);Object.assign(e,x)}else{const [x]=await sbIns('empleados',[row]);D.empleados.push(x)}cerrarModal();vRRHH()}}

// ================= USUARIOS =================
const MODULOS={cocina:'🍳 Cocina',panaderia:'🍞 Panadería',pasteleria:'🍰 Pastelería',madrugada:'🌅 Madrugada',salon:'🏪 Salón',deposito:'📦 Depósito'};
async function resetStock(){try{const r=await polyRPC('admin_reset_stock',{p_token:polyToken()});D.insumos.forEach(i=>i.stock=0);toast('Stock en 0 ✅ (respaldo #'+r.respaldo+')',5000);vInventario()}catch(e){toast('⚠️ '+e.message,6000)}}
async function vUsuarios(){
  $('#app').innerHTML='<div class="cargando">Cargando usuarios…</div>';
  let us=[];try{us=await polyRPC('admin_usuarios',{p_token:polyToken()})}catch(e){$('#app').innerHTML='<div class="card">'+esc(e.message)+'</div>';return}
  window._us=us;
  $('#app').innerHTML=`<h2>🔐 Usuarios y claves</h2>
  <p class="muted">Vos (administradora) entrás a todo. Cada sector entra solo a su módulo con su usuario y clave. Si cambiás una clave o das de baja a alguien, se le cierra la sesión en todos los dispositivos.</p>
  <div class="acciones"><button class="btn" onclick="editarUsuario()">➕ Nuevo usuario</button></div>
  <div class="card scroll"><table><tr><th>Usuario</th><th>Nombre</th><th>Acceso</th><th>Último ingreso</th><th>Estado</th><th></th></tr>
  ${us.map((u,k)=>`<tr><td><b>${esc(u.usuario)}</b></td><td>${esc(u.nombre||'')}</td><td>${u.rol==='admin'?'<span class="chip ok">Todo (admin)</span>':esc(MODULOS[u.modulo]||u.modulo)}</td><td class="muted">${u.ultimo_ingreso?new Date(u.ultimo_ingreso).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'nunca'}</td><td><span class="chip ${u.activo?'ok':'neu'}">${u.activo?'activo':'de baja'}</span></td><td><button class="btn sec peq" onclick="editarUsuario(${k})">Editar / cambiar clave</button></td></tr>`).join('')}</table></div>`;
}
function editarUsuario(k){const u=k!=null?window._us[k]:{usuario:'',nombre:'',rol:'sector',modulo:'cocina',activo:true};const nuevo=k==null;
  const yo=window.POLY_USUARIO&&window.POLY_USUARIO.usuario===u.usuario;
  modal(`<h3>${nuevo?'Nuevo usuario':'Editar '+esc(u.usuario)}</h3>
  <div class="fila"><div><label>Usuario (para entrar)</label><input id="uU" value="${esc(u.usuario)}" ${nuevo?'':'disabled'} autocapitalize="none" placeholder="ej: cocina2"></div><div><label>Nombre</label><input id="uN" value="${esc(u.nombre||'')}"></div></div>
  <div class="fila"><div><label>Acceso</label><select id="uR" ${yo?'disabled':''} onchange="$('#uMw').style.display=this.value==='admin'?'none':''"><option value="sector">Un módulo</option><option value="admin" ${u.rol==='admin'?'selected':''}>Todo (administrador)</option></select></div>
  <div id="uMw" style="${u.rol==='admin'?'display:none':''}"><label>Módulo</label><select id="uM">${Object.entries(MODULOS).map(([m,n])=>`<option value="${m}" ${u.modulo===m?'selected':''}>${n}</option>`).join('')}</select></div></div>
  <label>${nuevo?'Clave':'Clave nueva (dejala vacía para no cambiarla)'}</label><input id="uC" type="text" autocomplete="new-password" placeholder="mínimo 6 caracteres">
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="uA" ${u.activo?'checked':''} ${yo?'disabled':''} style="width:auto"> Activo (si lo desmarcás, no puede entrar más)</label>
  <div class="acciones" style="margin-top:12px"><button class="btn" id="bGU">💾 Guardar</button></div>`);
  $('#bGU').onclick=async()=>{const rol=$('#uR').value;const clave=$('#uC').value.trim()||null;
    try{await polyRPC('admin_guardar_usuario',{p_token:polyToken(),p_usuario:$('#uU').value,p_nombre:$('#uN').value.trim(),p_rol:rol,p_modulo:rol==='admin'?null:$('#uM').value,p_activo:$('#uA').checked,p_clave:clave});
      cerrarModal();toast(clave?'Guardado ✅ Anotá la clave: '+clave:'Guardado ✅',clave?9000:2500);vUsuarios()}catch(e){toast('⚠️ '+e.message,6000)}};
}

// ================= ARRANQUE =================
cargarTodo().then(ir).catch(e=>{$('#app').innerHTML='<div class="card"><h3>No pude conectar con la base de datos</h3><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Reintentar</button></div>'});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal()});
</script>
